<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推演agent · 模型设置</title>
<!-- [模型设置·改版v8] 照 zcode model-provider 界面骨架：
     一张大卡片内左右分栏——
     左：供应商列表（导航项，点选高亮）；
     右：选中供应商的模型详细设置（连接字段 + 模型列表）。
     添加供应商 = 模板选择器；操作收进「⋯」菜单。-->
<link rel="stylesheet" href="/static/style.css?v=40">
<link rel="stylesheet" href="/static/settings.css?v=10.11">
</head>
<body class="set-body">
<div class="set-page">

  <div class="set-topbar">
    <a href="/" class="btn ghost" id="setBackBtn">← 返回</a>
  </div>

  <div class="set-banner" id="setBanner" style="display:none"></div>

  <div class="set-layout">
    <!-- 左侧设置分区导航：现在只有【模型】，后续记忆/通用等设置项都加在这里 -->
    <aside class="set-sidenav">
      <div class="set-sidenav-title">设置</div>
      <nav class="set-sidenav-list">
        <a class="set-sidenav-item active" href="javascript:void(0)" title="模型设置（当前分区）">模型</a>
      </nav>
    </aside>

    <!-- 右侧：模型设置内容 -->
    <div class="set-content">
      <!-- 一张大卡片：左 = 供应商列表；右 = 选中供应商的模型详细设置 -->
      <div class="set-provider-panel" id="providerPanel">
        <div class="set-provider-side">
          <div class="set-side-head">
            <span class="set-side-title">供应商</span>
            <span class="set-count" id="providerCount">0</span>
            <span class="spacer" style="flex:1"></span>
            <button class="set-add-btn" id="addProviderBtn" title="添加供应商">＋</button>
          </div>
          <div class="set-side-list" id="providerNav"></div>
        </div>
        <div class="set-provider-main" id="providerDetail"></div>
      </div>

      <!-- 角色绑定（全局） -->
      <section class="set-block">
        <div class="set-h2-row">
          <h2 class="set-h2">角色绑定</h2>
          <span class="set-hint" id="roleHint"></span>
        </div>
        <div class="set-card" id="bindingList"></div>
      </section>

      <!-- 高级（全局） -->
      <section class="set-block">
        <details class="set-advanced" id="advancedBox">
          <summary>高级</summary>
          <div class="set-grid">
            <div class="set-field">
              <label for="advDefaultModel">默认模型（角色未绑定 / 未覆盖时的回落）</label>
              <select class="set-select" id="advDefaultModel"></select>
            </div>
            <div class="set-field">
              <label>三席审议总开关</label>
              <label class="set-switch">
                <input type="checkbox" id="advSimpleEnabled" />
                <span>启用 simple（三席审议）</span>
              </label>
            </div>
          </div>
        </details>
      </section>

      <!-- 按卡片类型设置默认模型（新建项目的模板） -->
      <section class="set-block">
        <div class="set-h2-row">
          <h2 class="set-h2">按卡片类型设置默认模型</h2>
          <span class="set-hint" id="ctmHint">每次新建项目，都会把这里的设置整体拷贝成那个项目自己的模型配置表；之后在项目内改某卡模型，以该卡为准，不回写全局。</span>
        </div>
        <div class="set-card" id="ctmList"></div>
        <div class="set-ctm-foot">
          <span class="set-note" id="ctmStatus"></span>
          <span class="spacer" style="flex:1"></span>
          <button class="btn primary" id="ctmSaveBtn">保存模板</button>
        </div>
      </section>

      <!-- 操作栏：属于【模型】分区，不是整个页面。
           保存/还原只作用于模型配置（models.yaml）。
           未来左侧加权限、通用等分区时，每个分区自带自己的操作区，
           互不共用 —— 这是分区化的正确模式。-->
      <div class="set-actionbar">
        <span class="set-save-status" id="setSaveStatus"></span>
        <span class="spacer"></span>
        <button class="btn ghost" id="setRestoreBtn" title="从备份列表里挑一版还原">还原</button>
        <button class="btn primary" id="setSaveBtn">保存并生效</button>
      </div>
    </div>
  </div>

</div>

<!-- 模板选择弹层（添加供应商） -->
<div class="set-modal" id="templateModal" style="display:none">
  <div class="set-modal-box">
    <div class="set-modal-head">
      <span class="set-modal-title">添加供应商</span>
      <span class="spacer"></span>
      <button class="btn ghost" id="templateCloseBtn">关闭</button>
    </div>
    <div class="set-modal-tip">选一个模板（端点/密钥变量已预填），或自定义空供应商</div>
    <div class="set-template-grid" id="templateList"></div>
  </div>
</div>

<!-- 拉取 → 勾选 弹层 -->
<div class="set-modal" id="fetchModal" style="display:none">
  <div class="set-modal-box">
    <div class="set-modal-head">
      <span id="fetchModalTitle">选择模型</span>
      <span class="spacer"></span>
      <button class="btn ghost" id="fetchCloseBtn">关闭</button>
    </div>
    <div class="set-modal-tool">
      <input class="set-input" id="fetchSearch" type="text" placeholder="搜索模型型号…" />
      <span class="set-note" id="fetchCount"></span>
    </div>
    <div class="set-modal-list" id="fetchList"></div>
    <div class="set-modal-foot">
      <span class="set-modal-error" id="fetchError"></span>
      <span class="spacer"></span>
      <button class="btn ghost" id="fetchCancelBtn">取消</button>
      <button class="btn primary" id="fetchAddBtn">添加选中</button>
    </div>
  </div>
</div>

<!-- 还原备份弹层 -->
<div class="set-modal" id="restoreModal" style="display:none">
  <div class="set-modal-box" style="max-width:520px">
    <div class="set-modal-head">
      <span>从备份还原</span>
      <span class="spacer"></span>
      <button class="btn ghost" id="restoreCloseBtn">关闭</button>
    </div>
    <div class="set-modal-list" id="restoreList"></div>
    <div class="set-modal-foot">
      <span class="set-modal-error" id="restoreError"></span>
      <span class="spacer"></span>
      <button class="btn ghost" id="restoreCancelBtn">取消</button>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>
<script src="/static/settings.js?v=10.11"></script>
</body>
</html>
