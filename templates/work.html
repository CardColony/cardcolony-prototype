<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推演agent · 剧本画布</title>
<!-- [思考流支持层 2026-10-12] style.css 升 ?v=10.5：本步追加了
     .live-reasoning.seat-think（三席 think 流按模型分桶的弱化行）规则，
     不升版本号浏览器会吃旧缓存、席位思考行不出样式 -->
<!-- [左栏接线 步2] style.css 的 ?v= 已升（左栏 nav 段整段迁往 nav.css，内容变了）。
     不升版本号浏览器会吃旧缓存——那份旧 style.css 仍带旧 nav 规则，会与新 nav.css
     打架（旧的项目行 hover 背景色会盖掉新卡片的间距渐变）。
     注：此处不写死旧版本号——它会被并发施工线一并推进，写死即漂移。 -->
<link rel="stylesheet" href="/static/style.css?v=45">
<!-- [左栏接线 步2] 左侧边栏样式独立成 nav.css（左栏样式的唯一真相）。
     为什么拆：左栏行结构按定稿重写，样式改动量大；留在 style.css 会与另一条施工线
     撞同一文件。拆出后左栏样式改动的冲突面缩到本行一处。
     版本号：nav.css 改动必须升这里的 ?v=，否则浏览器吃旧缓存、新样式不生效。 -->
<link rel="stylesheet" href="/static/nav.css?v=16">
<!-- [画布商业化重做 2026-10-17] 画布页专属视觉体系独立成 canvas.css（只在 .page-canvas
     作用域内生效，不污染对话页）。必须在本行之后引入：同特异性后者胜，用它覆盖 style.css
     里的旧画布段；改动本文件必须升 ?v=。 -->
<link rel="stylesheet" href="/static/canvas.css?v=20">
</head>
<body class="page-canvas">
<div class="work-page">
  <!-- [T17-F1] 左栏对话导航：恒在；画布态 44px 窄条（悬停浮层全树），对话态 360px
       （注释追实 2026-10-13：宽度 260→320→360，见 static/nav.css .app-nav） -->
  <nav class="app-nav rail" id="appNav">
    <div class="nav-rail">
      <button class="nav-rail-btn" id="navRailBtn" title="对话导航（点击钉住浮层）" aria-label="对话导航"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></svg></button>
      <div class="nav-rail-dot" title="当前项目"></div>
    </div>
    <!-- [迭代四 F4①] 常驻动作条＋通知按钮：不进 .nav-rail（它只在画布态可见，B-6）——
         放导航树之前，rail 态竖排、非 rail 横排靠右（CSS 两态各一条） -->
    <div id="navActions">
      <button id="navNotifyBtn" title="卡间消息通知" aria-label="卡间消息通知"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4.2 6.8a3.8 3.8 0 0 1 7.6 0v2.6l1.2 1.8H3l1.2-1.8V6.8Z"/><path d="M6.6 13.2a1.5 1.5 0 0 0 2.8 0"/></svg><span id="navNotifyCount" class="nav-notify-count"></span></button>
    </div>
    <!-- [对齐样稿 2026-10-12] 搜索区只留搜索框本身——用户定稿：「搜索栏只需要搜索栏，
         不需要别的」。「收起全部」「定位」两钮已移除（DOM＋样式＋接线三处同删，不留死件）。 -->
    <div id="navTop" class="nav-top">
      <!-- [左栏新建项目 2026-10-16 用户令] 新建项目按钮：搜索框**上方**、与搜索框等宽。
           与首页 #homeNewProject 用**同一份实现**（类 .home-new-project ＋ .btn.primary，
           样式与新建链路同源），不是另造一个。接线见 workspace.js 导航初始化段。 -->
      <div class="home-new-project">
        <button id="navNewProject" class="btn primary" title="新建项目">＋ 新项目</button>
      </div>
      <div class="nav-search-box">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        <input id="navSearchInput" type="text" placeholder="搜索" />
      </div>
    </div>
    <div id="navCrumbBox" class="nav-crumb-box" style="display:none"><div id="navCrumb" class="nav-crumb"></div></div>
    <div class="nav-tree" id="navTree">
      <!-- workspace.js renderNav 动态填充 -->
    </div>
    <!-- [模型设置第二步 2026-10-12] 左栏底部常驻入口：卡片聊天界面进【设置】→【模型】。
         .nav-tree 是 flex:1，本容器用 margin-top:auto 推到最底；rail 态（44px 窄条）
         只留图标（样式见 style.css 末尾 .navFooter 段，版本 ?v=10.4）。 -->
    <div id="navFooter" class="nav-footer">
      <button id="navSettingsBtn" class="nav-foot-btn" title="模型设置"
              onclick="location.href='/settings'"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.5M8 12.7v1.5M1.8 8h1.5M12.7 8h1.5M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/></svg><span class="nav-foot-label">设置</span></button>
    </div>
  </nav>

  <!-- [T17-F1] 中区主视图：topbar + stage（画布/对话二选一，data-view 驱动显隐） -->
  <div class="app-main" id="appMain">
    <div class="main-col">
    <!-- [顶栏整合 2026-10-13] 两条栏（.topbar 48px ＋ .ws-head ~35px）合并为一条 44px：
         面包屑 ｜（画布态）设置·zoom·整理画布·新建卡。
         用户 2026-10-13 17:17 四条裁定：① 去「回首页」图标 ② 去「← 画布」——面包屑首段＝项目名＝根卡，
         点它即回画布；不再同时显示项目名与根卡
         （实读 nav_breadcrumb.js:52 首段 cid 与 :53 根卡 cid 同为 work_card_id；全 work 项目名
         与根卡名 10/10 同名）③ 发送/停止合并为输入条一个两态图标按钮 ④ 去「ⓘ 卡详情」。
         [首页两态 2026-10-15] 原「回首页」图标随旧项目列表页概念整体取消一并删除，
         其后的 .bsep 分隔条随之删除（无左邻可分隔，留着是一道无来由的竖线）。
         回首页的通道＝浏览器地址栏 /，与首页自身的「有历史直接跳上次页」判定同源。
         画布专属三件（zoomDisplay/reorganizeBtn/newCardBtn）**不删元素**——canvas.js:33-35 顶层
         即取用、:1436/:1453 直接挂 onclick，删了会 TypeError 让整个画布脚本死掉；改由
         .canvas-only 按 data-view 显隐（画布态显示、聊天态隐藏）。
         topSettingsBtn 已删（无 JS 引用，grep 仅本文件命中；左栏 navFooter 已有同一跳转）。 -->
    <div class="topbar">
    <!-- [阶段3 A3.2 2026-10-17] 纯画布页：本页不含 canvasEntryBtn（画布页无「返回画布」）、
         不含 #chatCrumb / #workspace / 对话弹窗——那些归 card.html。 -->
      <!-- 画布态面包屑（canvas.js renderBreadcrumb 填，吃投影；画布态才显） -->
      <div id="crumb" class="crumb canvas-only"></div>
      <!-- [画布 2026-10-18 · 工作台] 项目状态条：打开画布第一眼要回答"有多少事在等我"。
           数据来自 canvas 投影（每张卡的 work_state / pending_count），canvas.js 填。 -->
      <div id="projectStat" class="proj-stat canvas-only"></div>
      <!-- [画布 2026-10-19 · 事故排查] 构建戳：用户看不到改动时，第一件事是确认
           "他加载的到底是哪一版 HTML"。这里放一个极小的版本号，肉眼可读、不打扰。
           改动 canvas.js/css 时**必须同步改这个号**（连同 main.js 里的 import 版本）。 -->
      <span class="build-stamp canvas-only" title="构建版本：看不到这个号变化＝浏览器还在用旧 HTML">v72</span>
      <span class="spacer"></span>
      <!-- [缩放控件 2026-10-16 用户令] 滚轮缩放废除（canvas.js wheel 监听已删），
           缩放只走此控件组：−/＋每按一次 ±25%；拖动条 25% 档位吸附（min25/max200/step25）；
           锚点＝视口中心。zoomDisplay 保留（canvas.js applyTransform 写它），组内显示百分比。 -->
      <div id="zoomCtrl" class="zoom-ctrl canvas-only">
        <button id="zoomOutBtn" class="zbtn" type="button" title="缩小 −25%">−</button>
        <input id="zoomSlider" class="zoom-slider" type="range" min="25" max="200" step="25" value="100" aria-label="缩放比例" />
        <button id="zoomInBtn" class="zbtn" type="button" title="放大 +25%">＋</button>
        <span id="zoomDisplay" class="zoom-display">100%</span>
      </div>
      <!-- [画布商业化 2026-10-17] 工具栏图标化：文字按钮改成 32×32 图标按钮
           （带 title 与 aria-label），另补「整幅适配」「搜索」两个高频入口。
           三个 id（reorganizeBtn/newCardBtn/zoom*）全部保留——canvas.js 顶层直接取用，
           删或改名会让整个画布脚本 TypeError。 -->
      <button id="fitBtn" class="icon-btn canvas-only" type="button" title="整幅适配（⌘0）" aria-label="整幅适配">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4"/></svg>
      </button>
      <button id="searchBtn" class="icon-btn canvas-only" type="button" title="搜索卡片（⌘K）" aria-label="搜索卡片">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      </button>
      <div class="cv-more-wrap" id="moreWrap">
        <button id="moreBtn" class="icon-btn canvas-only" type="button" aria-haspopup="true" aria-expanded="false" title="更多（整理 / 规则 / 关系 / 并行）" aria-label="更多">
          <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="13" cy="8" r="1.3"/></svg>
        </button>
        <div class="cv-more-menu" id="moreMenu" role="menu">
          <button id="expandAllBtn" class="cv-mi-btn" type="button">全部展开</button>
          <button id="collapseAllBtn" class="cv-mi-btn" type="button">全部折叠</button>
          <button id="reorganizeBtn" class="cv-mi-btn" type="button">整理布局</button>
          <button id="ruleToggleBtn" class="cv-mi-btn" type="button">规则面板</button>
          <button id="relToggleBtn" class="cv-mi-btn" type="button" aria-pressed="false">关系线</button>
          <button id="watchBtn" class="cv-mi-btn" type="button" aria-pressed="false">并行对话层</button>
        </div>
      </div>
      <button id="activityBtn" class="icon-btn canvas-only" type="button" aria-pressed="false" title="项目动态（运行中 + 最近活动）" aria-label="打开项目动态">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9h3l2-5 2 8 2-5h3"/></svg>
      </button>
      <span class="toolbar-sep canvas-only"></span>
      <button id="newCardBtn" class="btn primary canvas-only">＋ 新建卡</button>
    </div>
    <div class="stage">
      <!-- 画布视口 -->
      <div id="viewport">
        <div id="world">
          <svg class="edges" id="edgesSvg"></svg>
          <!-- 卡片节点由 canvas.js 动态注入 -->
        </div>
        <div id="cardTooltip" class="card-tooltip"></div>
      </div>
    </div>
    </div>
    <!-- [规则卡 2026-10-16 三改] 布局右列（非浮层）：主内容列真实缩窄避让，
         任何界面都不被盖。分区直改即存；仅根卡可提议修改（draft_rule_edit）、
         弹窗审批落盘。 -->
    <!-- [画布 2026-10-18 · 并行工作台] 右侧栏双态：
         未选中卡 → 规则卡（原行为，逐字不变）；
         选中卡   → 这张卡的详情（结论 + 待裁定条目 + 打开对话）。
         为什么不跳页：跳页会让人失去画布上下文，看两张卡的结论要来回跳三次——
         那等于用画布模拟对话界面，并行优势归零。 -->
    <div class="rule-panel" id="rulePanel">
      <div class="rule-panel-head" id="rulePanelHead">规则卡 · 各类卡行为准则（直改即存）</div>
      <div class="rule-panel-body" id="rulePanelBody">
        <!-- workspace.js loadRulePanel 动态填充 -->
      </div>
      <div class="card-detail" id="cardDetail" hidden></div>
    </div>
  </div>
</div>
<div id="toastContainer" class="toast-container"></div>
<!-- [画布 2026-10-19 · 实时状况] 项目动态抽屉：
     上段「正在运行」（内存态，3 秒刷新），下段「最近活动」（card_history，按天分组）。
     每一条都连着卡——点一条就飞到那张卡。这是侧边栏列表给不了的：
     列表只说"有这张卡"，不说"它刚被改了什么"。 -->
<div id="activityDrawer" class="cv-drawer" aria-label="项目动态">
  <div class="cv-drawer-head">
    <span class="cv-drawer-title">项目动态</span>
    <button id="activityClose" class="cv-drawer-close" type="button" aria-label="关闭">×</button>
  </div>
  <div id="activityList" class="cv-drawer-list"></div>
</div>
<!-- [迭代四 F4②] 通知面板（浮层）：列表项「时间·发件卡名→收件卡名·类型·摘要」；
     点击跳收件卡；format_ok:false 归「格式异常」分组 -->
<div id="notifyPanel" class="notify-panel">
  <div class="np-head">卡间消息 <button id="npClose" class="np-close">×</button></div>
  <div id="npList" class="np-list"></div>
</div>
<script>
  window.__WORK_ID__ = "{{WORK_ID}}";
  /* [阶段2 A2.1 2026-10-17] 对话独立地址 /work/{wid}/card/{cid} 注入卡号：
     有值＝对话页（boot 直接开这张卡）；空串＝画布页。 */
  window.__CARD_ID__ = "";   /* 画布页无卡号 */
</script>
<!-- [迭代四 F2④] 四 script → 单 ES module 入口（esm/main.js 按依赖序装配：
     util → api → store → stream → canvas → workspace）。原 ?v= 戳过渡保留；
     Cache-Control 策略需改后端（清单外），登记不做的偏离见汇报。 -->
<!-- [思考流支持层 2026-10-12] main.js 升 ?v=13.0：内层 stream.js/workspace.js
     的 import 戳已升 13，不升外层戳浏览器会吃旧模块图 -->
<script type="module" src="/static/esm/main.js?v=73.1"></script>
</body>
</html>
