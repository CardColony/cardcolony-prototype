<!DOCTYPE html>
<!-- work.html —— [分页 2026-10-16] 画布页（/work/{wid}）独立模板。
     画布与对话已拆成两个独立页面（用户 10-16 令：「这不是客户端，是网页，网页不该这样」）：
       画布页 /work/{wid}（本模板，main.js 入口）
       对话页 /work/{wid}/card/{cid}（card.html，main_chat.js 入口）
     本模板只含画布所需 DOM：左栏导航 + 顶栏 + 画布视口 + 规则卡 + 通知/消息浮层。
     对话区（#workspace/Inspector/起草弹窗）已移往 card.html——本页不加载 workspace.js。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推演agent · 剧本画布</title>
<!-- [思考流支持层 2026-10-12] style.css 升 ?v=10.5：本步追加了
     .live-reasoning.seat-think（三席 think 流按模型分桶的弱化行）规则，
     不升版本号浏览器会吃旧缓存、席位思考行不出样式 -->
<!-- [左栏接线 步2] style.css 的 ?v= 已升（左栏 nav 段整段迁往 nav.css，内容变了）。
     不升版本号浏览器会吃旧缓存——那份旧 style.css 仍带旧 nav 规则，会与新 nav.css
     打架（旧的项目行 hover 背景色会盖掉新卡片的间距渐变）。 -->
<link rel="stylesheet" href="/static/style.css?v=35">
<!-- [左栏接线 步2] 左侧边栏样式独立成 nav.css（左栏样式的唯一真相）。 -->
<link rel="stylesheet" href="/static/nav.css?v=10">
</head>
<body>
<div class="work-page">
  <!-- [T17-F1] 左栏对话导航：画布态 44px 窄条（悬停浮层全树）。 -->
  <nav class="app-nav rail" id="appNav">
    <div class="nav-rail">
      <button class="nav-rail-btn" id="navRailBtn" title="对话导航（点击钉住浮层）">☰</button>
      <div class="nav-rail-dot" title="当前项目"></div>
    </div>
    <!-- [迭代四 F4①] 常驻动作条＋通知按钮：不进 .nav-rail（它只在画布态可见，B-6） -->
    <div id="navActions">
      <button id="navNotifyBtn" title="卡间消息通知">🔔<span id="navNotifyCount" class="nav-notify-count"></span></button>
    </div>
    <!-- [对齐样稿 2026-10-12] 搜索区只留搜索框本身（用户定稿）。
         画布态 rail 下搜索框随悬停浮层面板同显同隐（nav.css .nav-rail 规则）。 -->
    <div id="navTop" class="nav-top">
      <div class="nav-search-box">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        <input id="navSearchInput" type="text" placeholder="搜索" />
      </div>
    </div>
    <div id="navCrumbBox" class="nav-crumb-box" style="display:none"><div id="navCrumb" class="nav-crumb"></div></div>
    <div class="nav-tree" id="navTree">
      <!-- canvas.js renderNav 动态填充 -->
    </div>
    <!-- [模型设置第二步 2026-10-12] 左栏底部常驻入口：卡片聊天界面进【设置】→【模型】。 -->
    <div id="navFooter" class="nav-footer">
      <button id="navSettingsBtn" class="nav-foot-btn" title="模型设置"
              onclick="location.href='/settings'">⚙<span class="nav-foot-label">设置</span></button>
    </div>
  </nav>

  <!-- 画布页主区：topbar + stage（仅画布视口，无对话区） + 规则卡 -->
  <div class="app-main" id="appMain" data-view="canvas">
    <div class="topbar">
      <!-- 画布态面包屑（canvas.js renderBreadcrumb 填，吃投影） -->
      <div id="crumb" class="crumb"></div>
      <span class="spacer"></span>
      <!-- [缩放控件 2026-10-16 用户令] 滚轮缩放废除（canvas.js wheel 监听已删），
           缩放只走此控件组：−/＋每按一次 ±25%；拖动条 25% 档位吸附（min25/max200/step25）；
           锚点＝视口中心。zoomDisplay 保留（canvas.js applyTransform 写它），组内显示百分比。 -->
      <div id="zoomCtrl" class="zoom-ctrl">
        <button id="zoomOutBtn" class="zbtn" type="button" title="缩小 −25%">−</button>
        <input id="zoomSlider" class="zoom-slider" type="range" min="25" max="200" step="25" value="100" aria-label="缩放比例" />
        <button id="zoomInBtn" class="zbtn" type="button" title="放大 +25%">＋</button>
        <span id="zoomDisplay" class="zoom-display">100%</span>
      </div>
      <button id="reorganizeBtn" class="btn" title="重算所有卡片位置（清除 pinned）">整理画布</button>
      <button id="newCardBtn" class="btn primary">＋ 新建卡</button>
    </div>

    <div class="stage">
      <!-- 画布视口 -->
      <div id="viewport">
        <div id="world">
          <svg class="edges" id="edgesSvg"></svg>
          <!-- 卡片节点由 canvas.js 动态注入 -->
        </div>
        <div id="cardTooltip" class="card-tooltip"></div>
      </div>
      <!-- 对话区已在 card.html 独立页面——本页不再有 #workspace -->
    </div>
    <!-- [规则卡 2026-10-16 二次归位] 吸附屏幕右侧的常驻卡片（fixed）：画布页在场。
         画布页 withApproval=false——审批弹窗在对话页，画布页无回合收口、不绑定。 -->
    <div class="rule-panel" id="rulePanel">
      <div class="rule-panel-head">规则卡 · 各类卡行为准则（直改即存）</div>
      <div class="rule-panel-body" id="rulePanelBody">
        <!-- canvas.js loadRulePanel 动态填充 -->
      </div>
    </div>
  </div>
</div>
<div id="toastContainer" class="toast-container"></div>
<!-- [迭代四 F4②] 通知面板（浮层）：列表项「时间·发件卡名→收件卡名·类型·摘要」；
     点击跳收件卡；format_ok:false 归「格式异常」分组 -->
<div id="notifyPanel" class="notify-panel">
  <div class="np-head">卡间消息 <button id="npClose" class="np-close">×</button></div>
  <div id="npList" class="np-list"></div>
</div>
<script>
  window.__WORK_ID__ = "{{WORK_ID}}";
</script>
<!-- [分页 2026-10-16] 画布页唯一入口 main.js（装配 store→api→bus→nav_system→rule_panel→canvas）。
     对话在独立页面 /work/{wid}/card/{cid}，本页不加载 workspace.js。 -->
<script type="module" src="/static/esm/main.js?v=35.0"></script>
</body>
</html>
