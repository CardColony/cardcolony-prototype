<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推演agent · 剧本画布</title>
<link rel="stylesheet" href="/static/style.css?v=9.3">
</head>
<body>
<div class="work-page">
  <!-- 顶栏：面包屑 + zoom + 操作按钮 -->
  <div class="topbar">
    <a href="/" class="btn ghost">← 剧本架</a>
    <div id="crumb" class="crumb"></div>
    <span class="spacer"></span>
    <span id="zoomDisplay" class="zoom-display">100%</span>
    <button id="reorganizeBtn" class="btn" title="重算所有卡片位置（清除 pinned）">整理画布</button>
    <button id="newCardBtn" class="btn primary">＋ 新建卡</button>
  </div>

  <!-- 画布视口 -->
  <div id="viewport">
    <div id="world">
      <svg class="edges" id="edgesSvg"></svg>
      <!-- 卡片节点由 canvas.js 动态注入 -->
    </div>
    <div id="cardTooltip" class="card-tooltip"></div>
  </div>

  <!-- 卡片工作区（默认隐藏，单击卡片时显示） -->
  <div id="workspace" class="workspace">
    <div class="ws-left" id="wsLeft">
      <!-- workspace.js 动态填充 -->
    </div>
    <div class="ws-right">
      <div class="chat" id="chatArea"></div>
      <div class="inputbar">
        <textarea id="inputBox" class="inputbox" placeholder="和这张卡讨论…（Ctrl+Enter 发送）" rows="2"></textarea>
        <div class="inputmeta">
          <span class="hint">Ctrl+Enter 发送</span>
          <span class="spacer"></span>
          <button id="sendBtn" class="btn primary">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toastContainer" class="toast-container"></div>
<script>
  window.__WORK_ID__ = "{{WORK_ID}}";
</script>
<script src="/static/api.js?v=9.3"></script>
<script src="/static/canvas.js?v=9.3"></script>
<script src="/static/workspace.js?v=9.3"></script>
</body>
</html>
