# ============================================================
# 模型配置 · 唯一真源（模型设置 · 第一步收拢）
# 全项目只经 src/api/model_config.py 读本文件，别处不许直读。
#
# 三层结构：providers（供应商·父）→ models（模型·子）→ bindings（角色绑定）
# 角色清单见 config/roles.json（模块侧管），本文件只做「角色→模型」关联。
#
# 历史裁定（逐字保留，拆闸铁律）：
#   2026-10-02 拆闸裁定：不允许设置任意 max_tokens，不允许墙钟类闸。
#     - 所有 max_tokens / timeout 全部移除（None = 不传，模型按端点自然行为返回）
#     - retry_grading 关闭（总时长熔断 300 秒是墙钟）
#     （原项目带的 2048 限额是空观点根因：思考型模型额度被思考烧光，正文为空）
# ============================================================

providers:
  deepseek-official:
    protocol: openai
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    note: DeepSeek 官方（只认 deepseek-flash / deepseek-v4-pro）
  volcengine-token-plan:
    protocol: openai
    base_url: https://ark.cn-beijing.volces.com/api/plan/v3
    api_key_env: VOLCENGINE_TOKEN_PLAN_API_KEY
    note: 火山方舟 token plan 端点（ark-code-latest）
  volcengine-coding:
    protocol: openai
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
    api_key_env: VOLCENGINE_CODING_API_KEY
    note: 火山方舟 coding 端点（OpenAI 兼容）
  kimi:
    protocol: openai
    base_url: https://api.kimi.com/coding/v1
    api_key_env: KIMI_API_KEY
    note: Kimi Coding Plan（OpenAI 兼容）
  nous:
    protocol: openai
    base_url: https://inference-api.nousresearch.com/v1
    api_key_env: NOUS_API_KEY
    note: Nous Research（OpenAI 兼容协议）
  deepseek:
    protocol: deepseek
    api_key_env: DEEPSEEK_API_KEY
    models_url: https://api.deepseek.com/v1/models
    note: DeepSeek 官方
  zhipu:
    protocol: openai
    base_url: https://open.bigmodel.cn/api/coding/paas/v4
    api_key_env: ZHIPU_CODING_API_KEY
    note: 智谱 coding plan（OpenAI 兼容；glm-flash 与 glm-5.3 共用）
  minimax:
    protocol: openai
    base_url: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY
    note: MiniMax（OpenAI 兼容）
  mavis:
    protocol: anthropic
    base_url: https://agent.minimax.cn/mavis/api/v1/llm/v1
    note: MiniMax Code（mavis agent 网关·Anthropic Messages 协议·broker 租约鉴权·需本地 MiniMax Code 常驻）
  aliyun:
    protocol: openai
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api_key_env: ALIYUN_TOKEN_PLAN_API_KEY
    note: 阿里云 token-plan（OpenAI 兼容）
  opencode:
    protocol: openai
    base_url: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_API_KEY
    extra_headers:
      x-opencode-session: zhuge-3080
    note: opencode-go 聚合端点（OpenAI 兼容；需 x-opencode-session 头，MissingSessionID 拒单）
  commandcode:
    protocol: openai
    base_url: https://api.commandcode.ai/provider/v1
    api_key_env: COMMAND_CODE_API_KEY
    note: >-
      Command Code Provider API（OpenAI 兼容）。模型 id 带厂商前缀，如
      deepseek/deepseek-v4.1-flash；官方清单见 GET /provider/v1/models（带 context_length，
      其中 deepseek-v4.1-flash = 1,000,000）。免费档：reflection/beam:free、
      minimax/minimax-m3.1-flash:free、poolside/laguna-s-2.1-free、stealth/glyph-cluster:free。
models:
  mavis-m31-flash:
    provider: mavis
    model: MiniMax-M3.1-Flash
    temperature: 1
    max_tokens: 8192
    note: MiniMax M3.1-Flash（mavis 网关·订阅限免·思考强制开·512K 上下文）
  ds-v4-flash-volc:
    provider: volcengine-coding
    model: deepseek-v4-flash
    temperature: 1
    note: 火山方舟 coding · deepseek v4 flash
  ds-v41-flash-eco-volc:
    provider: volcengine-coding
    # [多轮思考回传 2026-10-23] 该端点强制要求 assistant 消息带 tool_calls
    # 时回传本轮 reasoning_content，否则 400（同 ds-v4-flash-volc 纪律）。
    echo_reasoning: true
    reasoning_echo_fill: ""
    model: deepseek-v4-1-flash-economy-261017
    temperature: 1
    note: 火山方舟 coding · deepseek v4.1 flash economy（eco 版，2026-10-25 用户令增加）
  kimi-k31-pro-volc:
    provider: volcengine-coding
    echo_reasoning: true
    reasoning_echo_fill: ""
    model: kimi-k3-1-pro-261024
    temperature: 1
    note: 火山方舟 coding · kimi k3.1 pro（2026-10-25 用户令增加；方舟清单 261024 版）
  ds-flash-official:
    provider: deepseek-official
    model: deepseek-flash
    temperature: 1
    note: DeepSeek 官方 flash（用户给的 key）
  ds-v41-flash-aliyun:
    provider: aliyun
    model: deepseek-v4.1-flash-1017
    temperature: 1
    note: 阿里云 token plan · deepseek v4.1 flash 1017（第一层用）
  ds-v4-flash-aliyun:
    provider: aliyun
    model: deepseek-v4-flash-0731
    temperature: 1
    note: 阿里云 token plan · deepseek v4 flash
  ark-code-latest:
    provider: volcengine-token-plan
    model: ark-code-latest
    temperature: 1
    note: 火山方舟 token plan · ark code latest
  minimax-m31:
    provider: minimax
    model: MiniMax-M3.1-Flash
    temperature: 1
    note: MiniMax M3.1 Flash（M3 已下架）
  kimi-k3:
    provider: kimi
    model: k3
    temperature: 1
    thinking: 'on'
    note: Kimi K3（coding plan 端点）
  deepseek-pro:
    provider: opencode
    model: deepseek-v4-pro
    temperature: 0.3
    thinking: 'on'
    note: DeepSeek V4 Pro（按需选用；[2026-10-19 裁定] 已无降级模型概念）
    retry:
      max_attempts: 3
      backoff_seconds: 2
    reasoning_efforts:
    - low
    - high
    - max
    default_effort: high
  qwen-max:
    provider: aliyun
    model: qwen3.8-max
    temperature: 0.7
    thinking: 'on'
    note: 思考席② qwen3.8-max（阿里云 token-plan）。thinking=off：qwen enable_thinking:false
      —— 思考模式下正文为空（实测）。思考本身走 delta.reasoning_content，由 stream_call 双路解包取回做 think 流；待
      ALIYUN key 就位可实测后再考虑开 on（开 on 的风险＝正文空＝观点空）
    retry:
      max_attempts: 2
  anthropic-claude-haiku-55:
    provider: nous
    model: anthropic/claude-haiku-5.5
    temperature: 0.7
    thinking: max
    note: ''
    reasoning_efforts:
    - max
    - xhigh
    - high
    - medium
    - low
    default_effort: medium
    reasoning_mandatory: false
  glm-53:
    provider: zhipu
    model: glm-5.3
    temperature: 0.7
    thinking: 'on'
    note: ''
  glm-53-flash:
    provider: zhipu
    model: glm-5.3-flash
    temperature: 0.7
    thinking: 'on'
    note: ''
  glm-53-flashx:
    provider: zhipu
    model: glm-5.3-flashx
    temperature: 0.7
    thinking: 'on'
    note: ''
  deepseek-v41-flash:
    provider: opencode
    model: deepseek-v4.1-flash
    temperature: 0.7
    thinking: 'on'
    note: ''
    reasoning_efforts:
    - low
    - high
    - max
    default_effort: high
  deepseek-v4-flash:
    provider: opencode
    model: deepseek-v4-flash
    temperature: 0.7
    thinking: 'on'
    note: ''
    reasoning_efforts:
    - low
    - high
    - max
    default_effort: high
  minimax-m31-flash-free:
    provider: opencode
    model: minimax-m3.1-flash-free
    temperature: 1
    note: 免费（2026-10-22 实调通过）
  beam-free:
    provider: opencode
    model: beam-free
    temperature: 0.7
    note: 免费（Reflection Beam，带 reasoning；2026-10-22 实调通过）
  # [2026-10-22 · Command Code Provider API] 厂商前缀是官方 id 的一部分，不可省
  cmd-ds-v41-flash:
    provider: commandcode
    model: deepseek/deepseek-v4.1-flash
    temperature: 1
    note: Command Code · DeepSeek V4.1 Flash（context_length=1,000,000；2026-10-22 实调 200）
  cmd-beam-free:
    provider: commandcode
    model: reflection/beam:free
    temperature: 0.7
    note: Command Code · Beam 1.0 免费（context_length=1,048,576，带 reasoning；2026-10-22 实调 200）
  cmd-minimax-free:
    provider: commandcode
    model: minimax/minimax-m3.1-flash:free
    temperature: 1
    note: >-
      Command Code · MiniMax M3.1 Flash 免费（context_length=1,000,000；2026-10-22 连测 3/3 通，
      期间出现过瞬时 429「上游暂不可用」，属容量抖动、可重试）
bindings:
  execute: glm-53-flash
  think: glm-53-flash
  synthesize: glm-53-flash
  condense: glm-53-flash
  compress: glm-53-flash
  draft: glm-53
  viewpoint:
  - qwen-max
  - glm-53
  - minimax-m31
system:
  default_model: minimax-m31
simple:
  enabled: true
retry_grading:
  enabled: false
concurrency:
  default: 3
  per_model:
    kimi-k3: 3
    glm-53: 3
    glm-53-flash: 5
    glm-53-flashx: 5
    deepseek-v41-flash: 8
    deepseek-pro: 4
tiers:
  depth_0:
  - kimi-k3
  - ds-flash-official
  depth_1:
  - ds-v41-flash-aliyun
  depth_2:
  - ds-v4-flash-volc
  - ark-code-latest
  - minimax-m31
  - minimax-m31-flash-free
  default:
  - ds-v4-flash-volc
  - ark-code-latest
  - minimax-m31
