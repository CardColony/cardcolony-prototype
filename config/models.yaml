    note: >-
      Command Code · Glyph Cluster 免费（context_length=256,000；2026-11-04 实调 200）。
      思考字段为 `reasoning`（非 reasoning_content），translate.py 已兼容。
      ⚠ 重思考模型：两字回答实测烧 154 个 reasoning token，工具/长链路上很贵（不扣额度但吃上下文）。
  # [2026-10-23 实测] 原 `minimax/minimax-m3.1-flash:free` 免费档已关闭：
  #   端点 GET /models 的 92 条清单里已无该 id；调用返回 403
  #   「The free MiniMax M3.1 Flash window has ended」。
  #   ⇒ 改为付费档 `minimax/minimax-m3.1-flash`（同日实测：裸调 200、带真实工具面
  #   200 且 tool_calls 正确解析）。**这会消耗额度**，不想要就删掉这一段。
  cmd-minimax-flash:
    provider: commandcode
    model: minimax/minimax-m3.1-flash
    temperature: 1
    note: >-
      Command Code · MiniMax M3.1 Flash（付费档；原 :free 免费窗口 2026-10-23 已结束，
      context_length=1,000,000）
