    temperature: 0.7
    thinking: 'on'
    note: ''
  deepseek-v41-flash:
    provider: opencode
    # [多轮思考回传 2026-10-23] 该端点强制要求 assistant 消息
    # 带 tool_calls 时回传本轮 reasoning_content，否则 400。
    echo_reasoning: true
    model: deepseek-v4.1-flash
    reasoning_echo_fill: ""
    temperature: 0.7
    thinking: 'on'
    note: ''
    reasoning_efforts:
