# ============================================================
# 模型配置 · 唯一真源（模型设置 · 第一步收拢）
# 全项目只经 src/api/model_config.py 读本文件，别处不许直读。
#
# 三层结构：providers（供应商·父）→ models（模型·子）→ bindings（角色绑定）
# 角色清单见 config/roles.json（模块侧管），本文件只做「角色→模型」关联。
#
# 历史裁定（逐字保留，拆闸铁律）：
#   2026-10-02 拆闸裁定：不允许设置任意 max_tokens，不允许墙钟类闸。
#     - 所有 max_tokens / timeout 全部移除（None = 不传，模型按端点自然行为返回）
#     - retry_grading 关闭（总时长熔断 300 秒是墙钟）
#     （原项目带的 2048 限额是空观点根因：思考型模型额度被思考烧光，正文为空）
# ============================================================

providers:
  nous:
    protocol: openai
    base_url: https://inference-api.nousresearch.com/v1
    api_key_env: NOUS_API_KEY
    note: Nous Research（OpenAI 兼容协议）
  deepseek:
    protocol: deepseek
    api_key_env: DEEPSEEK_API_KEY
    models_url: https://api.deepseek.com/v1/models
    note: DeepSeek 官方
  zhipu:
    protocol: openai
    base_url: https://open.bigmodel.cn/api/coding/paas/v4
    api_key_env: ZHIPU_CODING_API_KEY
    note: 智谱 coding plan（OpenAI 兼容；glm-flash 与 glm-5.3 共用）
  minimax:
    protocol: openai
    base_url: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY
    note: MiniMax（OpenAI 兼容）
  aliyun:
    protocol: openai
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api_key_env: ALIYUN_TOKEN_PLAN_API_KEY
    note: 阿里云 token-plan（OpenAI 兼容）
  opencode:
    protocol: openai
    base_url: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_API_KEY
    extra_headers:
      x-opencode-session: zhuge-3080
    note: opencode-go 聚合端点（OpenAI 兼容；需 x-opencode-session 头，MissingSessionID 拒单）
models:
  deepseek-pro:
    provider: opencode
    model: deepseek-v4-pro
    temperature: 0.3
    # [思考流补 2026-10-16] thinking: on——deepseek 天生产思考，但必须显式声明
    # 才会经 model_config 注入 reasoning_effort=default_effort(high)；缺声明时
    # 端点退化成内联 <think> 形态（实测 10-16：正文尾部带 </think> 污染）。
    thinking: 'on'
    note: 降级模型（system.fallback_model 指向；调用失败时网关切入）
    retry:
      max_attempts: 3
      backoff_seconds: 2
    reasoning_efforts:
    - low
    - high
    - max
    default_effort: high
  qwen-max:
    provider: aliyun
    model: qwen3.8-max
    temperature: 0.7
    thinking: 'on'
    note: 思考席② qwen3.8-max（阿里云 token-plan）。thinking=off：qwen enable_thinking:false
      —— 思考模式下正文为空（实测）。思考本身走 delta.reasoning_content，由 stream_call 双路解包取回做 think 流；待
      ALIYUN key 就位可实测后再考虑开 on（开 on 的风险＝正文空＝观点空）
    retry:
      max_attempts: 2
  anthropic-claude-haiku-55:
    provider: nous
    model: anthropic/claude-haiku-5.5
    temperature: 0.7
    thinking: max
    note: ''
    reasoning_efforts:
    - max
    - xhigh
    - high
    - medium
    - low
    default_effort: medium
    reasoning_mandatory: false
  glm-53:
    provider: zhipu
    model: glm-5.3
    temperature: 0.7
    thinking: 'on'
    note: ''
  glm-53-flash:
    provider: zhipu
    model: glm-5.3-flash
    temperature: 0.7
    thinking: 'on'
    note: ''
  glm-53-flashx:
    provider: zhipu
    model: glm-5.3-flashx
    temperature: 0.7
    thinking: 'on'
    note: ''
  minimax-m31-flash-preview:
    provider: minimax
    model: MiniMax-M3.1-Flash-Preview
    temperature: 0.7
    thinking: 'on'
    note: ''
  deepseek-v41-flash:
    provider: opencode
    model: deepseek-v4.1-flash
    temperature: 0.7
    thinking: 'on'
    note: ''
    reasoning_efforts:
    - low
    - high
    - max
    default_effort: high
  deepseek-v4-flash:
    provider: opencode
    model: deepseek-v4-flash
    temperature: 0.7
    thinking: 'on'
    note: ''
    reasoning_efforts:
    - low
    - high
    - max
    default_effort: high
  longcat-25-preview-free:
    provider: opencode
    model: longcat-2.5-preview-free
    temperature: 0.7
    thinking: 'on'
    note: ''
  step-5-preview-free:
    provider: opencode
    model: step-5-preview-free
    temperature: 0.7
    thinking: 'on'
    note: ''
bindings:
  execute: deepseek-v41-flash
  think: anthropic-claude-haiku-55
  synthesize: anthropic-claude-haiku-55
  condense: glm-53-flash
  compress: glm-53-flash
  draft: glm-53
  viewpoint:
  - qwen-max
  - glm-53
  - minimax-m31-flash-preview
system:
  default_model: minimax-m31-flash-preview
  fallback_model: longcat-25-preview-free
simple:
  enabled: true
retry_grading:
  enabled: false
