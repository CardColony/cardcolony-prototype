  ds-v41-flash-oc2:
    provider: opencode2
    # 同第一份 opencode 席位纪律：assistant 带 tool_calls 必须回传 reasoning_content。
    echo_reasoning: true
    model: deepseek-v4.1-flash
    reasoning_echo_fill: ""
    temperature: 0.7
    thinking: 'on'
    note: 第二份 opencode Go · deepseek v4.1 flash（2026-11-03 用户令增加，只此一把）
    reasoning_efforts:
    - low
    - high
    - max
    default_effort: high
  glm-53-flash-oc2:
    provider: opencode2
    model: glm-5.3-flash
  deepseek-v4-flash:
    provider: opencode
    # [多轮思考回传 2026-10-23] 该端点强制要求 assistant 消息
    # 带 tool_calls 时回传本轮 reasoning_content，否则 400。
    echo_reasoning: true
    model: deepseek-v4-flash
    reasoning_echo_fill: ""
    temperature: 0.7
    thinking: 'on'
    note: ''
    reasoning_efforts:
    - low
    - high
    - max
    default_effort: high
  beam-free:
