    model: beam-free
    reasoning_echo_fill: ""
    temperature: 0.7
    note: >-
      cost=0 名义免费（2026-11-04 /models 复核）；但 ⚠ 实测 403 RegionError
      「This model is not available in your country」，且该账号 Go 周额度已用尽
      （429 GoUsageLimitError）⇒ 当前实际调不通。保留座椅（仍免费，未删除）待额度/地区处理。
  glm-53-flash-oc1:
    provider: opencode
    model: glm-5.3-flash
  # [2026-10-22 · Command Code Provider API] 厂商前缀是官方 id 的一部分，不可省
