[pytest]
# 步骤一 · 回归网（card_012）。只新增测试与测试配置，不改被测代码。
testpaths = tests
asyncio_mode = auto
addopts = -ra
# 绝不递归进运行数据与备份目录（works/ 下只有卡片与对话，不是测试）
norecursedirs = works 推演agent_backups _backups _trash_recovery_error docs methodology static templates .venv __pycache__
filterwarnings =
    ignore::DeprecationWarning