<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>CardColony · 画布（契约数据接入）</title>
<style>
  :root{
    --bg:#0c1015; --surface:#131a22; --raised:#1a2430; --line:#2a3543;
    --text:#e6edf5; --text-2:#9aa9ba; --text-3:#6b7b8d;
    --focus:#5b9dd9;
    --f-flow:#39b98a; --f-accept:#5b9dd9; --f-block:#e2705a; --f-fix:#d9a13b; --f-done:#7f8b99; --f-claim:#a98bd9;
    --e-parent:#5b6b7d; --e-comm:#4a90d9; --e-dep:#a17ad9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:13px/1.5 "Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  #app{display:flex;flex-direction:column;height:100%}

  /* 顶栏 */
  .top{display:flex;align-items:center;gap:16px;height:48px;padding:0 16px;
    background:var(--surface);border-bottom:1px solid var(--line);flex:none}
  .brand{font-weight:650;letter-spacing:.01em}
  .brand b{color:#e2a63d}
  .sep{width:1px;height:20px;background:var(--line)}
  .stat{color:var(--text-2);font-size:12px;font-variant-numeric:tabular-nums}
  .stat b{color:var(--text);font-weight:600}
  .right{margin-left:auto;display:flex;gap:8px}
  button{font:inherit;color:var(--text);background:var(--raised);border:1px solid var(--line);
    border-radius:6px;padding:5px 10px;cursor:pointer;min-height:28px}
  button:hover{background:#22303f;border-color:#3a4a5c}
  button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

  /* 主体 */
  .main{flex:1;display:flex;min-height:0}
  .canvas-wrap{flex:1;position:relative;overflow:auto;background:
    radial-gradient(circle at 1px 1px,#1a232e 1px,transparent 0) 0 0/22px 22px}
  #world{position:relative;width:1600px;height:1000px;transform-origin:0 0}

  /* 节点 */
  .node{position:absolute;width:200px;min-height:64px;padding:9px 11px;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    cursor:default;transition:border-color .15s,background .15s}
  .node:hover{border-color:#3f5266;background:var(--raised)}
  .node .rail{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:8px 0 0 8px;
    background:var(--f-done)}
  .node .t{font-size:12.5px;font-weight:600;line-height:1.35;padding-left:6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .node .m{display:flex;align-items:center;gap:6px;padding-left:6px;margin-top:4px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--f-done);flex:none}
  .word{font-size:11px;color:var(--text-2)}
  .type{font-size:10px;color:var(--text-3);border:1px solid var(--line);
    border-radius:3px;padding:0 4px;line-height:14px}
  .node.archived{opacity:.45;filter:grayscale(1)}
  .node.archived .rc{font-size:10px;color:#e2705a;padding-left:6px}

  /* 线 */
  .edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .edges path{fill:none;stroke-width:1.4}
  .edges path.parent{stroke:var(--e-parent)}
  .edges path.comm{stroke:var(--e-comm);stroke-dasharray:5 4}
  .edges path.dep{stroke:var(--e-dep);stroke-dasharray:1 3;stroke-width:1.6}

  /* 右侧读数面板 */
  .panel{width:300px;flex:none;background:var(--surface);border-left:1px solid var(--line);
    overflow:auto;padding:14px 16px}
  .panel h3{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--text-3)}
  .panel section{margin-bottom:18px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;
    border-bottom:1px solid #1b2530;font-size:12px}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--text-2)}
  .row .v{font-variant-numeric:tabular-nums;font-weight:600}
  .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
  .log{font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--text-3);
    max-height:160px;overflow:auto;background:#0b1016;border-radius:6px;padding:8px}
  .log .warn{color:#d9a13b}
  .log .error{color:#e2705a}
  .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;
    background:#1d2a36;color:var(--text-2)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="brand">Card<b>Colony</b></span>
    <span class="sep"></span>
    <span class="stat" id="statTop">—</span>
    <span class="sep"></span>
    <span class="stat">状态层 <span class="badge" id="storeStatus">live</span></span>
    <div class="right">
      <button id="btnInc">应用一次增量</button>
      <button id="btnIncBad">发一条错序增量</button>
      <button id="btnResync">触发重同步</button>
    </div>
  </header>

  <div class="main">
    <div class="canvas-wrap"><div id="world"><svg class="edges" id="edges"></svg></div></div>
    <aside class="panel">
      <section>
        <h3>快照版本（§8.2.2 四版本）</h3>
        <div id="verBox"></div>
      </section>
      <section>
        <h3>flow_state 六态分布</h3>
        <div id="flowBox"></div>
      </section>
      <section>
        <h3>entity_lifecycle</h3>
        <div id="lifeBox"></div>
      </section>
      <section>
        <h3>边（canvas_edge.type）</h3>
        <div id="edgeBox"></div>
      </section>
      <section>
        <h3>增量即渲染（F-N7 / A3）</h3>
        <div id="renderBox"></div>
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
          <button id="btnIso">同构比对（A1）</button>
          <button id="btnReplay">事件流重放（A5）</button>
        </div>
        <div class="log" id="proofBox" style="margin-top:8px;max-height:120px"></div>
      </section>
      <section>
        <h3>状态层日志</h3>
        <div class="log" id="logBox"></div>
      </section>
    </aside>
  </div>
</div>

<script src="src/model/enums.js"></script>
<script src="src/model/fixture.js"></script>
<script src="src/state/store.js"></script>
<script>
(function(){
  'use strict';
  var EN = window.CC_ENUMS;

  var FLOW_COLOR = {
    '目标进行中':      'var(--f-flow)',
    '模型自声明本轮达成':'var(--f-claim)',
    '待验收':          'var(--f-accept)',
    '阻塞或暂停':      'var(--f-block)',
    '修正中':          'var(--f-fix)',
    '上级验收通过':    'var(--f-done)'
  };

  var store = window.CCStore.create({ canvas: window.CC_FIXTURE });
  var seq = store.getState().canvas.snapshot_seq;

  store.subscribe(function(_s, reason){ window.__lastReason = reason; render(); });

  /* ---------- 渲染 ---------- */
  function render(){
    var s = store.getState();
    var cv = s.canvas;

    // 顶栏统计：全部从数据派生（不得硬编码）
    var dist = store.flowDistribution();
    var running = dist['目标进行中'] || 0;
    var blocked = dist['阻塞或暂停'] || 0;
    document.getElementById('statTop').innerHTML =
      '<b>' + cv.nodes.length + '</b> 卡 · <b>' + running + '</b> 进行中 · <b>' +
      blocked + '</b> 阻塞/暂停';

    document.getElementById('storeStatus').textContent = s.status;

    // 节点：按 card_id 复用 DOM（F-N7 增量即渲染）——只更新变化的卡，其余节点一个字节不动
    var world = document.getElementById('world');
    var existing = {};
    var old = world.querySelectorAll('.node');
    for (var i = 0; i < old.length; i++) existing[old[i].getAttribute('data-id')] = old[i];

    var byId = {}, touched = 0, reused = 0, created = 0;
    cv.nodes.forEach(function(n){ byId[n.card_id] = n; });

    cv.nodes.forEach(function(n){
      var flow = n.task_summary ? n.task_summary.flow_state : null;
      var word = n.task_summary ? n.task_summary.display_word.primary_word : '无任务';
      var color = flow ? FLOW_COLOR[flow] : 'var(--f-done)';
      var html =
        '<span class="rail" style="background:' + color + '"></span>' +
        '<div class="t">' + esc(n.title) + '</div>' +
        '<div class="m">' +
          '<span class="dot" style="background:' + color + '"></span>' +
          '<span class="word">' + esc(word) + '</span>' +
          '<span class="type">' + esc(n.card_type) + '</span>' +
        '</div>' +
        (n.entity_lifecycle !== 'active'
          ? '<div class="rc">' + esc(n.lifecycle_reason_code || '—') + '</div>' : '');

      var el = existing[n.card_id];
      if (el) {
        // 内容未变 ⇒ 完全不碰该节点（复用）
        if (el.getAttribute('data-sig') !== sig(n, html)) {
          el.innerHTML = html;
          el.setAttribute('data-sig', sig(n, html));
          touched++;
        } else reused++;
        delete existing[n.card_id];
      } else {
        el = document.createElement('div');
        el.setAttribute('data-id', n.card_id);
        el.innerHTML = html;
        el.setAttribute('data-sig', sig(n, html));
        world.appendChild(el);
        created++; touched++;
      }
      el.className = 'node' + (n.entity_lifecycle !== 'active' ? ' archived' : '');
      el.style.left = n.position.x + 'px';
      el.style.top = n.position.y + 'px';
      el.title = n.card_id + ' · ' + n.card_type + ' · ' + n.entity_lifecycle;
    });
    // 已移除的节点才删
    Object.keys(existing).forEach(function(k){ existing[k].remove(); });

    window.__renderStat = { touched: touched, reused: reused, created: created,
      total: cv.nodes.length, reason: window.__lastReason || 'init' };

    drawEdges(cv, byId);
    renderPanels(s);
  }

  function sig(n, html){
    return n.position.x + ':' + n.position.y + ':' + n.entity_lifecycle + ':' + html.length + ':' + html;
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  var NW = 200, NH = 64;

  function drawEdges(cv, byId){
    var svg = document.getElementById('edges');
    var out = '';
    cv.edges.forEach(function(e){
      if (!e.effective) return;
      var a = byId[e.from], b = byId[e.to];
      if (!a || !b) return;
      var x1 = a.position.x + NW / 2, y1 = a.position.y + NH;
      var x2 = b.position.x + NW / 2, y2 = b.position.y;
      var cls = e.type === '父子' ? 'parent' : (e.type === '通信' ? 'comm' : 'dep');
      if (e.type === '父子') {
        // 正交折线：下行再横向再下行
        var my = (y1 + y2) / 2;
        out += '<path class="parent" d="M' + x1 + ',' + y1 +
               ' L' + x1 + ',' + my + ' L' + x2 + ',' + my + ' L' + x2 + ',' + y2 + '"/>';
      } else {
        // 曲线：通信与依赖靠线型区分（第二维）
        var cx = (x1 + x2) / 2;
        out += '<path class="' + cls + '" d="M' + x1 + ',' + y1 +
               ' C' + cx + ',' + (y1 + 60) + ' ' + cx + ',' + (y2 - 60) +
               ' ' + x2 + ',' + y2 + '"/>';
      }
    });
    svg.innerHTML = out;
  }

  function renderPanels(s){
    var cv = s.canvas;
    document.getElementById('verBox').innerHTML =
      row('snapshot_seq', cv.snapshot_seq) +
      row('view_version', cv.canvas_view_version) +
      row('projection_version', cv.projection_version) +
      row('layout_version', cv.layout_version);

    var d = store.flowDistribution();
    document.getElementById('flowBox').innerHTML = EN.FLOW_STATE.map(function(k){
      return '<div class="row"><span class="k"><span class="sw" style="background:' +
        FLOW_COLOR[k] + '"></span>' + k + '</span><span class="v">' + (d[k] || 0) + '</span></div>';
    }).join('');

    var l = store.lifecycleDistribution();
    document.getElementById('lifeBox').innerHTML = EN.ENTITY_LIFECYCLE.map(function(k){
      return '<div class="row"><span class="k">' + k + '</span><span class="v">' + (l[k] || 0) + '</span></div>';
    }).join('');

    var eb = store.edgesByType();
    document.getElementById('edgeBox').innerHTML = EN.EDGE_TYPE.map(function(k){
      return '<div class="row"><span class="k">' + k + '</span><span class="v">' + (eb[k] || 0) + '</span></div>';
    }).join('');

    document.getElementById('logBox').innerHTML = store.getLog().slice(-20).map(function(x){
      return '<div class="' + x.level + '">' + x.at.slice(11, 19) + ' ' + esc(x.msg) + '</div>';
    }).join('') || '<div>（无）</div>';

    var rs = window.__renderStat || { touched: 0, reused: 0, created: 0, total: 0, reason: '—' };
    document.getElementById('renderBox').innerHTML =
      row('本次触发', rs.reason) +
      row('改动节点', rs.touched) +
      row('原样复用', rs.reused) +
      row('新建', rs.created) +
      row('节点总数', rs.total);
  }

  function row(k, v){
    return '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
  }

  /* ---------- 自验按钮：走真实增量通道 ---------- */
  document.getElementById('btnInc').addEventListener('click', function(){
    seq += 1;
    var res = store.applyIncrement({
      operation: 'canvas.node_patch',
      payload: { card_id: 'card_464', patch: { title: '画布页 · 视觉与实现（增量已应用）' } },
      view_version: store.getState().canvas.canvas_view_version + 1,
      projection_version: store.getState().canvas.projection_version,
      snapshot_seq: seq,
      layout_version: store.getState().canvas.layout_version
    });
    flash(res.ok ? '增量应用成功，snapshot_seq=' + seq : '增量被拒：' + res.reason);
  });

  document.getElementById('btnIncBad').addEventListener('click', function(){
    // 故意跳号，验证四版本校验能拦住并触发重同步
    seq += 5;
    var res = store.applyIncrement({
      operation: 'canvas.node_patch',
      payload: { card_id: 'card_464', patch: { title: '不该生效' } },
      view_version: store.getState().canvas.canvas_view_version,
      projection_version: store.getState().canvas.projection_version,
      snapshot_seq: seq,
      layout_version: store.getState().canvas.layout_version
    });
    flash(res.ok ? '意外通过（不应发生）' : '已拦下：' + res.reason + ' → 触发重同步');
  });

  document.getElementById('btnResync').addEventListener('click', function(){
    store.requestResync('manual_test', null);
    flash('已触发重同步（无后端，走本地快照保持可用）');
  });

  function flash(msg){
    var el = document.getElementById('storeStatus');
    el.textContent = msg;
    el.style.background = '#23303d';
  }

  function proof(lines){
    document.getElementById('proofBox').innerHTML = lines.map(function(x){
      return '<div>' + esc(x) + '</div>';
    }).join('');
  }

  function digest(cv){
    return JSON.stringify({
      project_id: cv.project_id, snapshot_seq: cv.snapshot_seq,
      canvas_view_version: cv.canvas_view_version,
      layout_version: cv.layout_version, projection_version: cv.projection_version,
      nodes: cv.nodes.map(function(n){ return [n.card_id, n.title, n.card_type,
        n.card_state, n.entity_lifecycle, n.task_summary && n.task_summary.flow_state,
        n.task_summary && n.task_summary.display_word.primary_word,
        n.position.x, n.position.y, n.parent_id, n.lifecycle_reason_code, n.is_operable]; }),
      edges: cv.edges.map(function(e){ return [e.relation_id, e.from, e.to, e.type, e.effective, e.revision]; })
    });
  }

  /* A1 同构：快照构建 vs 增量到达，逐字段一致 */
  document.getElementById('btnIso').addEventListener('click', function(){
    var base = JSON.parse(JSON.stringify(window.CC_FIXTURE));
    var a = window.CCStore.create({ canvas: base });
    // 路径一：整份快照
    var snap = JSON.parse(JSON.stringify(base));
    snap.nodes[10].title = '画布页 · 视觉与实现（同构样本）';
    snap.snapshot_seq = 2; snap.canvas_view_version = 2;
    a.replaceSnapshot({ canvas: snap });
    var da = digest(a.getState().canvas);

    // 路径二：同一结果由增量到达
    var b = window.CCStore.create({ canvas: base });
    var r = b.applyIncrement({
      operation: 'canvas.node_patch',
      payload: { card_id: 'card_464', patch: { title: '画布页 · 视觉与实现（同构样本）' } },
      view_version: 2, projection_version: 1, snapshot_seq: 2, layout_version: 1
    });
    var db = digest(b.getState().canvas);
    proof([
      '路径一（快照替换）：' + (a.getState().canvas.nodes[10].title),
      '路径二（增量到达）：' + (b.getState().canvas.nodes[10].title),
      '增量返回：' + JSON.stringify(r),
      '逐字段摘要一致：' + (da === db ? '是 ✓' : '否 ✗'),
      '摘要长度：' + da.length + ' / ' + db.length
    ]);
  });

  /* A5 重放：同一事件流重放两次，读数一致 */
  document.getElementById('btnReplay').addEventListener('click', function(){
    function run(){
      var st = window.CCStore.create({ canvas: JSON.parse(JSON.stringify(window.CC_FIXTURE)) });
      var frames = [
        { operation: 'canvas.node_patch', payload: { card_id: 'card_464', patch: { title: '重放 A' } },
          view_version: 2, projection_version: 1, snapshot_seq: 2, layout_version: 1 },
        { operation: 'canvas.edge_upsert', payload: { edge: { relation_id: 'rel_test', from: 'card_001',
          to: 'card_464', type: '通信', effective: true, revision: 1 } },
          view_version: 3, projection_version: 1, snapshot_seq: 3, layout_version: 1 },
        { operation: 'canvas.node_patch', payload: { card_id: 'card_074', patch: { title: '重放 B' } },
          view_version: 4, projection_version: 1, snapshot_seq: 4, layout_version: 1 }
      ];
      frames.forEach(function(f){ st.applyIncrement(f); });
      return digest(st.getState().canvas);
    }
    var d1 = run(), d2 = run();
    proof([
      '事件流：3 帧（node_patch / edge_upsert / node_patch）',
      '第 1 次重放摘要长度：' + d1.length,
      '第 2 次重放摘要长度：' + d2.length,
      '两次读数一致：' + (d1 === d2 ? '是 ✓' : '否 ✗')
    ]);
  });

  render();
  window.__app = { store: store };
})();
</script>
</body>
</html>
