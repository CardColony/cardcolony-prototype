<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画布根卡原型 v3 — 树的门面与呼吸口</title>
<style>
  :root{
    --bg:#14161a;          /* 画布深底 */
    --panel:#1d2026;       /* 卡面 */
    --panel-raised:#242833;
    --border:#2c313c;
    --border-soft:#262b34;
    --fg:#e6e8ee;
    --fg-dim:#9aa0ac;
    --fg-faint:#6b7180;

    --root:#e0a45c;        /* 根的琥珀 */
    --root-deep:#b9853f;
    --talk:#5cc8b8;        /* 对话/快照的冷青 */
    --talk-dim:#3b8f84;

    --radius:8px;
    --line:1px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    display:flex;align-items:flex-start;justify-content:center;
    padding:80px 40px;gap:48px;
  }
  .stage{display:flex;flex-direction:column;gap:36px;align-items:center;}
  .stage-caption{color:var(--fg-dim);font-size:12px;letter-spacing:2px;text-transform:uppercase;}

  /* ============ 根卡整卡：树 ============ */
  .workcard{
    position:relative;
    width:360px;
    background:var(--panel);
    border:var(--line) solid var(--border);
    border-radius:var(--radius);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    overflow:hidden;
  }
  /* 根：左边条 */
  .workcard::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
    background:var(--root);
  }
  .workcard-main{
    display:flex;
    margin-left:10px;               /* 让开左条 */
  }
  .workcard-body{
    flex:1;
    padding:18px 16px 14px 12px;
    display:flex;flex-direction:column;gap:10px;
    min-width:0;
  }
  /* ① 项目名 —— 克制的、大的名字，无任何标签 */
  .workcard-title{
    font-size:20px;font-weight:650;line-height:1.25;color:var(--fg);
    letter-spacing:.3px;
  }
  .workcard-title .root-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--root);margin-right:8px;vertical-align:2px;
  }
  /* ③ 当前状况 —— 三行，和现在一样 */
  .status-label{
    font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--fg-faint);margin-top:4px;
  }
  .status-lines{
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    font-size:12px;line-height:1.7;color:var(--fg-dim);
  }
  .status-lines .st{
    display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .status-lines .st b{color:var(--fg);font-weight:600;margin-right:6px;}

  /* ④ 树开关：整卡右缘贯通竖轨 */
  .tree-toggle{
    width:44px;flex:none;
    border-left:var(--line) solid var(--border-soft);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;
    color:var(--fg-dim);
    transition:background .15s,color .15s;
    position:relative;
  }
  .tree-toggle:hover{background:var(--panel-raised);color:var(--fg);}
  .tree-toggle .tt-icon{font-size:14px;line-height:1;transition:transform .18s;}
  .tree-toggle .tt-count{font-size:16px;font-weight:650;color:var(--fg);font-variant-numeric:tabular-nums;}
  .tree-toggle .tt-cap{font-size:9px;letter-spacing:1px;color:var(--fg-faint);}
  .tree-toggle.open{background:linear-gradient(180deg,#2a2317,#24201a);color:var(--root);}
  .tree-toggle.open .tt-count{color:var(--root);}
  .tree-toggle.open .tt-icon{transform:none;}
  .tree-toggle.closed .tt-icon{transform:rotate(-90deg);}

  /* ============ ⑤ 吸附的快照卡：树长出来的对话口 ============ */
  .snap-card{
    margin-left:10px;             /* 与根卡共享左条线 */
    border-top:var(--line) solid var(--border-soft);
    position:relative;
    background:linear-gradient(180deg,transparent,#1a1d22 30%);
  }
  /* 快照卡的冷青边条 —— 与根琥珀区分：这是"对话"，不是"本体" */
  .snap-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
    background:var(--talk);
    opacity:.85;
  }
  /* 快照行：整条可点 */
  .snap-row{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px 8px 14px;
    cursor:pointer;min-width:0;
  }
  .snap-row:hover{background:rgba(92,200,184,.06);}
  .snap-who{
    flex:none;font-size:11px;font-weight:600;color:var(--talk);
    white-space:nowrap;
  }
  .snap-msg{
    flex:1;font-size:12px;color:var(--fg-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
  }
  .snap-msg .t{color:var(--fg);}
  .snap-arrow{flex:none;font-size:11px;color:var(--fg-faint);}
  /* 内联输入框：可直接在画布上发消息 */
  .snap-input{
    display:flex;align-items:center;gap:8px;
    padding:8px 12px 12px 14px;
  }
  .snap-input input{
    flex:1;background:var(--panel-raised);border:var(--line) solid var(--border);
    border-radius:6px;color:var(--fg);font-size:12px;
    padding:7px 10px;outline:none;min-width:0;
  }
  .snap-input input::placeholder{color:var(--fg-faint);}
  .snap-input input:focus{border-color:var(--talk);}
  .snap-input .send{
    flex:none;background:var(--talk);color:#0d1a18;border:none;border-radius:6px;
    font-size:11px;font-weight:650;padding:7px 12px;cursor:pointer;
  }
  .snap-input .send:active{transform:translateY(1px);}

  /* ============ 轻量回复浮层 ============ */
  .reply-pop{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:340px;max-height:70vh;
    background:var(--panel-raised);
    border:var(--line) solid var(--border);
    border-radius:10px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    display:none;flex-direction:column;overflow:hidden;z-index:20;
  }
  .reply-pop.show{display:flex;}
  .reply-head{
    display:flex;align-items:center;gap:8px;
    padding:10px 14px;border-bottom:var(--line) solid var(--border-soft);
  }
  .reply-head .rdot{width:7px;height:7px;border-radius:50%;background:var(--talk);}
  .reply-head .rt{flex:1;font-size:12px;font-weight:600;color:var(--fg);}
  .reply-head .rx{cursor:pointer;color:var(--fg-faint);font-size:14px;line-height:1;padding:2px 4px;}
  .reply-head .rx:hover{color:var(--fg);}
  .reply-body{
    padding:10px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;
    max-height:44vh;min-height:0;
  }
  .reply-body .pm{font-size:11px;max-width:85%;padding:7px 10px;border-radius:7px;line-height:1.5;}
  .reply-body .pm.in{background:#1b2930;color:var(--fg);align-self:flex-start;}
  .reply-body .pm.out{background:var(--talk);color:#0d1a18;align-self:flex-end;}
  .reply-body .pm .who{font-size:9px;opacity:.7;display:block;margin-bottom:2px;font-weight:600;}
  .reply-input{
    display:flex;gap:8px;padding:10px 14px;border-top:var(--line) solid var(--border-soft);
  }
  .reply-input input{
    flex:1;background:var(--panel);border:var(--line) solid var(--border);
    border-radius:6px;color:var(--fg);font-size:12px;padding:8px 10px;outline:none;
  }
  .reply-input input:focus{border-color:var(--talk);}
  .reply-input button{
    background:var(--talk);color:#0d1a18;border:none;border-radius:6px;
    font-size:12px;font-weight:650;padding:0 14px;cursor:pointer;
  }
  .pop-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10;}
  .pop-mask.show{display:block;}

  /* ============ 对照：普通子卡 ============ */
  .compare-caption{margin-top:6px;color:var(--fg-faint);font-size:11px;text-align:center;letter-spacing:1px;}
  .childcard{
    width:280px;background:var(--panel);
    border:var(--line) solid var(--border);border-radius:var(--radius);
    padding:14px 14px 12px 18px;position:relative;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
  }
  .childcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--border);}
  .childcard .ct{font-size:14px;font-weight:600;color:var(--fg);margin-bottom:6px;}
  .childcard .cs{
    font-size:11px;line-height:1.6;color:var(--fg-faint);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  /* 展开的子卡树（示意） */
  .kid-row{display:flex;flex-direction:column;gap:8px;margin-top:18px;width:360px;}
  .kid{
    background:var(--panel);border:var(--line) solid var(--border);border-radius:6px;
    padding:9px 12px;font-size:12px;color:var(--fg-dim);
    display:flex;justify-content:space-between;align-items:center;
    margin-left:14px;border-left:3px solid var(--border);
  }
  .kid b{color:var(--fg);font-weight:600;}
</style>
</head>
<body>

  <!-- 根卡：树的门面与呼吸口 -->
  <div class="stage">
    <div class="stage-caption">根卡</div>
    <div class="workcard" id="rootCard">
      <div class="workcard-main">
        <div class="workcard-body">
          <div class="workcard-title"><span class="root-dot"></span>银河远征计划</div>
          <div class="status-label">当前状况</div>
          <div class="status-lines">
            <span class="st"><b>阶段</b>轨道验证 · 第三轮迭代</span>
            <span class="st"><b>进度</b>燃料方案已定，推进引擎待测</span>
            <span class="st"><b>卡点</b>引擎冷却接口未闭合，屏幕待裁决</span>
          </div>
        </div>
        <div class="tree-toggle open" id="toggle">
          <span class="tt-icon" id="ttIcon">▾</span>
          <span class="tt-count" id="ttCount">3</span>
          <span class="tt-cap">子卡</span>
        </div>
      </div>

      <!-- 吸附的快照卡 -->
      <div class="snap-card">
        <div class="snap-row" id="snapRow">
          <span class="snap-who">勘探队·队长</span>
          <span class="snap-msg"><span class="t">引擎冷却方案</span>已重算三版，温差收敛到 2.1°，可以提交</span>
          <span class="snap-arrow">↗</span>
        </div>
        <div class="snap-input">
          <input type="text" placeholder="对这个项目说点什么…" id="quickInput">
          <button class="send">发送</button>
        </div>
      </div>
    </div>

    <!-- 展开示意：子卡树 -->
    <div class="kid-row" id="kidRow">
      <div class="kid"><b>燃料子系统</b><span>已定案</span></div>
      <div class="kid"><b>推进引擎</b><span>待测</span></div>
      <div class="kid"><b>冷却接口</b><span>未闭合</span></div>
    </div>
  </div>

  <!-- 对照：普通子卡 -->
  <div class="stage">
    <div class="stage-caption">普通子卡（现状对比）</div>
    <div class="childcard">
      <div class="ct">推进引擎</div>
      <div class="cs">引擎冷却方案已重算三版，温差收敛到 2.1°。当前停在推进参数确认与屏幕裁决。这是第二行。这是第三行截断。</div>
    </div>
  </div>

  <!-- 轻量回复浮层 -->
  <div class="pop-mask" id="mask"></div>
  <div class="reply-pop" id="pop">
    <div class="reply-head">
      <span class="rdot"></span>
      <span class="rt">银河远征计划 · 最新消息</span>
      <span class="rx" id="popClose">✕</span>
    </div>
    <div class="reply-body" id="popBody">
      <div class="pm in"><span class="who">勘探队·队长</span>引擎冷却方案已重算三版，温差收敛到 2.1°，可以提交裁决。</div>
      <div class="pm in"><span class="who">燃料子系统</span>燃料配比参数已确认，供你参考。</div>
    </div>
    <div class="reply-input">
      <input type="text" placeholder="回复…" id="popInput">
      <button>回复</button>
    </div>
  </div>

<script>
  const toggle=document.getElementById('toggle');
  const kidRow=document.getElementById('kidRow');
  const ttIcon=document.getElementById('ttIcon');
  let open=true;
  toggle.addEventListener('click',()=>{
    open=!open;
    toggle.classList.toggle('open',open);
    toggle.classList.toggle('closed',!open);
    ttIcon.textContent=open?'▾':'▸';
    kidRow.style.display=open?'flex':'none';
  });

  // 快照 → 轻量回复窗
  const snapRow=document.getElementById('snapRow');
  const mask=document.getElementById('mask');
  const pop=document.getElementById('pop');
  const popClose=document.getElementById('popClose');
  snapRow.addEventListener('click',e=>{e.stopPropagation();mask.classList.add('show');pop.classList.add('show');});
  const hide=()=>{mask.classList.remove('show');pop.classList.remove('show');};
  popClose.addEventListener('click',hide);
  mask.addEventListener('click',hide);
</script>
</body>
</html>
