/* ====== 真值移植：ui.css 原文（body.page-chat → .pz） ====== */
/* ============================================================================
   ui.css —— 对话界面设计系统（商业级）
   ---------------------------------------------------------------------------
   作用域：仅 .pz（对话页 card.html）。画布页 work.html 不引入本文件，
           style.css 的既有令牌与规则对它逐字不变。
   加载序：style.css → nav.css → ui.css（本文件最后，层叠覆盖）。

   设计原则
   1. 单一强调色（靛蓝），其余全中性。颜色只承担语义，不承担装饰。
   2. 三级表面（bg / surface-1 / surface-2），靠 1px 线与明度差分层，不靠阴影堆叠。
   3. 间距走 4px 网格；字号走 11/12/13/14/15/17/20 阶梯；行高正文 1.7。
   4. 动效只做 opacity/transform/color，时长 120–200ms，且尊重 reduced-motion。
   5. 深浅双主题同源：所有颜色走变量，切换 data-theme 即可，零规则分叉。
   ============================================================================ */

/* ---------------------------------------------------------------------------
   一、令牌
   --------------------------------------------------------------------------- */

.pz {
  /* 表面/线/文字：融合层——ui 中性令牌全部别名到画布纸面变量，
     左栏/对话与画布同底同线同字色（深浅主题各自跟随 .root 令牌） */
  --ui-bg: var(--bg);
  --ui-surface-1: var(--surface);
  --ui-surface-2: var(--panel);
  --ui-surface-3: var(--chipbg);
  --ui-surface-4: var(--line2);
  --ui-line: var(--line);
  --ui-line-2: var(--line2);
  --ui-line-3: var(--line2);
  --ui-line-input: var(--line2);
  --ui-text: var(--tx);
  --ui-text-2: var(--tx2);
  --ui-text-3: var(--tx3);
  --ui-text-4: var(--tx3);

  /* 强调：并入画布金色系——发送钮/链接/焦点环/当前行洗底/用户泡描边 与画布同一笔 */
  --ui-accent: var(--gold);
  --ui-accent-hi: color-mix(in srgb, var(--gold) 80%, #000);
  --ui-accent-lo: color-mix(in srgb, var(--gold) 13%, transparent);
  --ui-accent-line: color-mix(in srgb, var(--gold) 32%, transparent);
  /* [5715 · 对比度网] 强调底上的字用**深墨**，不用白字：
  --ui-accent-ink: #1c2733;

  /* 语义 */
  --ui-ok: #4ec98a;
  --ui-ok-lo: rgba(78, 201, 138, 0.13);
  --ui-warn: #e0a63c;
  --ui-warn-lo: rgba(224, 166, 60, 0.13);
  --ui-err: #f0685f;
  --ui-err-lo: rgba(240, 104, 95, 0.13);

  /* 几何 */
  --ui-r-xs: 6px;
  --ui-r-sm: 8px;
  --ui-r-md: 12px;
  --ui-r-lg: 16px;
  --ui-r-xl: 20px;
  --ui-r-pill: 999px;

  /* 间距 */
  --ui-s1: 4px;
  --ui-s2: 8px;
  --ui-s3: 12px;
  --ui-s4: 16px;
  --ui-s5: 24px;
  --ui-s6: 32px;
  --ui-s7: 48px;

  /* 阴影（极少用：只给真正浮起的层） */
  --ui-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.24);
  --ui-shadow-2: 0 8px 28px rgba(0, 0, 0, 0.36);
  --ui-shadow-3: 0 18px 48px rgba(0, 0, 0, 0.46);

  /* 动效 */
  --ui-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ui-fast: 120ms;
  --ui-mid: 180ms;

  /* 排版 */
  /* Windows 11 的 Segoe UI Variable 是可变字体（字重过渡更细）；
     中文用 YaHei UI 变体（比 Microsoft YaHei 行高更紧凑、hinting 更稳）；
     macOS 走 PingFang SC。全部系统字体，离线可用。 */
  --ui-font: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont,
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei",
    "Source Han Sans SC", "Noto Sans SC", system-ui, sans-serif;
  --ui-mono: "SFMono-Regular", "JetBrains Mono", "Cascadia Code", Consolas,
    "Liberation Mono", Menlo, monospace;

  /* 内容列宽：中文正文 68–76 字符的舒适区 */
  /* [P29 · 2026-10-30 · 用户「现在的对话页太窄了，加宽一点，注意输入框要同宽」]
     768 → 960px（+192px，+25%）。

     ★ 为什么改这一个变量就够（这一段就是「同宽」的机关）：
       ui.css 这套里，**对话页所有横向尺寸都以 --ui-col 为轴**，六处引用同一值：
         :602  .flow-view-scroll   padding: 0 var(--ui-col-pad) 28px  ← 内容列左右留白
         :606  .flow-view-column   max-width: var(--ui-col)          ← **内容列**
         :1594 .flow-view-to-bottom-slot  padding-right: calc((100% - var(--ui-col))/2 - 48px)
         :1642 .composer-seat  --flow-composer-card-max-width: var(--ui-col) ← **输入卡**
         :1643 .composer-seat  --flow-composer-side-clearance: var(--ui-col-pad)
       ⇒ 内容列与输入卡**本来就是同一个变量** ⇒ 改一处必然同宽 ⇒ 天生不会对不齐。

     ★ 反面教材（别重蹈）：本项目另有一套「dsh 照抄」旧规范在 style.css 里
       （内容列 748px 硬编码 + 输入卡 780px 写死 + 回底钮 calc(100%-748px)，
       三处各写各的）。它在对话页**不生效**（被本页 .pz 规则覆盖），
       但它正是「同一个宽度散落三处」的老病根。第一次改宽度时改错到那一套，
       结果：内容列与输入卡**真的**被改成一个 960 一个 768 ⇒ 反而更不齐。
       ⇒ 结论：改横向尺寸前，先确认**哪一套规则真正生效**（别改被覆盖的死规范）。

     960px ≈ 每行 60 个中文字（16px 字号），仍在深色大屏的舒适阅读区。 */
  --ui-col: 960px;
  --ui-col-pad: 28px;
}

/* 浅色主题 */
.root[data-theme="light"] .pz {
  --ui-bg: var(--bg);
  --ui-surface-1: var(--surface);
  --ui-surface-2: var(--panel);
  --ui-surface-3: var(--chipbg);
  --ui-surface-4: var(--line2);
  --ui-line: var(--line);
  --ui-line-2: var(--line2);
  --ui-line-3: var(--line2);
  --ui-line-input: var(--line2);
  --ui-text: var(--tx);
  --ui-text-2: var(--tx2);
  --ui-text-3: var(--tx3);
  --ui-text-4: var(--tx3);

  --ui-accent: var(--gold);
  --ui-accent-hi: color-mix(in srgb, var(--gold) 80%, #000);
  --ui-accent-lo: color-mix(in srgb, var(--gold) 11%, transparent);
  --ui-accent-line: color-mix(in srgb, var(--gold) 30%, transparent);
  /* [5715 · 对比度网] 浅色主题的强调色本来就深（#5560d8），白字 5.18:1 够 AA ⇒
     仍用白字；深色主题那边强调色偏亮 ⇒ 那边改用深墨（见上方深色块）。 */
  --ui-accent-ink: #1c2733;

  --ui-ok: #17925c;
  --ui-ok-lo: rgba(23, 146, 92, 0.1);
  --ui-warn: #a9721a;
  --ui-warn-lo: rgba(169, 114, 26, 0.1);
  --ui-err: #cf3f36;
  --ui-err-lo: rgba(207, 63, 54, 0.09);

  --ui-shadow-1: 0 1px 2px rgba(16, 19, 24, 0.06);
  --ui-shadow-2: 0 8px 24px rgba(16, 19, 24, 0.1);
  --ui-shadow-3: 0 18px 44px rgba(16, 19, 24, 0.14);
}

/* ---------------------------------------------------------------------------
   [5715 · 修] 老令牌桥接（浅色主题）
   对话页里仍有一批控件用的是 style.css 的**老令牌**（--panel/--text/--dim/
   --border/--bg…），而老令牌在 :root 只有**一套深色值、没有浅色覆盖**——
   浅色主题只重定义了 --ui-*。后果：模型选择器 `.model-pill`（--panel 底 +
   --text 字）在浅色界面里是**近黑底白字的实心药丸**，一屏浅色里视觉权重最高
   （实测截图），读起来像个告警条而不是辅助控件。

   修法：在对话页作用域内把老令牌**映射**到新设计系统的对应值——
   一次修好所有还在用老令牌的对话页控件，而不是逐个打补丁。
   只作用于浅色主题：深色下老令牌的观感已由既有样式调过，不动它（零回归）。
   --------------------------------------------------------------------------- */
.root[data-theme="light"] .pz {
  /* 只补画布没有的老令牌名；--bg/--panel 等已存在的直接继承画布值（成环即死） */
  --bg-deep: var(--chipbg);
  --panel-hover: var(--surface);
  --border: var(--line2);
  --text: var(--tx);
  --text-soft: var(--tx2);
  --dim: var(--tx3);
}

/* ---------------------------------------------------------------------------
   二、基底
   --------------------------------------------------------------------------- */

.pz {
  background: var(--ui-bg);
  color: var(--ui-text);
  font-family: var(--ui-font);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.pz ::selection {
  background: var(--ui-accent-line);
  color: var(--ui-text);
}

.pz :focus-visible {
  outline: 2px solid var(--ui-accent);
  outline-offset: 2px;
  border-radius: var(--ui-r-xs);
}

.pz ::-webkit-scrollbar { width: 6px; height: 6px; }
.pz ::-webkit-scrollbar-track { background: transparent; }
.pz ::-webkit-scrollbar-thumb {
  background: rgba(148, 155, 166, 0.10);
  border-radius: var(--ui-r-pill);
  border: 2px solid transparent;
  background-clip: content-box;
}
.pz ::-webkit-scrollbar-thumb:hover { background: rgba(148, 155, 166, 0.45); background-clip: content-box; }
.pz .flow-view-scroll:hover::-webkit-scrollbar-thumb { background: rgba(148, 155, 166, 0.28); background-clip: content-box; }
.pz .flow-view-scroll { scrollbar-width: thin; scrollbar-color: rgba(148,155,166,0.18) transparent; }
.pz ::-webkit-scrollbar-button { display: none; }

/* 外壳：左栏 + 主列 */
.pz .work-page { background: var(--ui-bg); }
.pz .app-main { background: var(--ui-bg); }
.pz .main-col { background: var(--ui-bg); }

/* ---------------------------------------------------------------------------
   三、顶栏
   --------------------------------------------------------------------------- */

.pz .topbar {
  height: 52px;
  padding: 0 18px;
  gap: 10px;
  background: var(--ui-bg);
  border-bottom: 1px solid var(--ui-line);
  backdrop-filter: none;
}

.pz .topbar .canvas-entry {
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--ui-r-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--ui-text-3);
  transition: background var(--ui-fast) var(--ui-ease),
    color var(--ui-fast) var(--ui-ease), border-color var(--ui-fast) var(--ui-ease);
}
.pz .topbar .canvas-entry:hover {
  background: var(--ui-surface-2);
  border-color: var(--ui-line);
  color: var(--ui-text);
}
.pz .topbar .canvas-entry svg { width: 15px; height: 15px; }

/* 面包屑 */
.pz .topbar .crumb {
  display: flex;
  align-items: center;
  gap: 2px;
  font-size: 13px;
  color: var(--ui-text-3);
  min-width: 0;
  overflow: hidden;
}
.pz .topbar .crumb .cseg {
  display: inline-flex;
  align-items: center;
  height: 26px;
  padding: 0 7px;
  border-radius: var(--ui-r-xs);
  color: var(--ui-text-2);
  white-space: nowrap;
  transition: background var(--ui-fast) var(--ui-ease), color var(--ui-fast) var(--ui-ease);
}
.pz .topbar .crumb .cseg:hover { background: var(--ui-surface-2); color: var(--ui-text); }
.pz .topbar .crumb .cseg.root { color: var(--ui-text-2); font-weight: 400; }
.pz .topbar .crumb .cseg.cur {
  color: var(--ui-text);
  font-weight: 600;
  max-width: 46ch;
  overflow: hidden;
  text-overflow: ellipsis;
  display: inline-block;
  line-height: 26px;
}
.pz .topbar .crumb .cseg.cur:hover { background: transparent; }
.pz .topbar .crumb .cseg.more {
  color: var(--ui-text-4);
  padding: 0 4px;
  cursor: default;
  letter-spacing: 0.05em;
}
.pz .topbar .crumb .cseg.more:hover { background: transparent; color: var(--ui-text-2); }
.pz .topbar .crumb .csep {
  color: var(--ui-text-4);
  font-size: 12px;
  padding: 0 1px;
  user-select: none;
}

/* 顶栏右侧动作 */
.pz .topbar .spacer { flex: 1; }
.pz .topbar-actions {
  display: flex;
  align-items: center;
  gap: 2px;
}
/* 常用动作（过程开关）与系统动作（主题/详情）分组，中间一道细线——
   否则三个图标挤成一堆，看不出谁是谁的。 */
.pz #themeToggleBtn { margin-left: 8px; position: relative; }
.pz #themeToggleBtn::before {
  content: "";
  position: absolute;
  left: -5px;
  top: 8px;
  bottom: 8px;
  width: 1px;
  background: var(--ui-line-2);
}
.pz .tb-btn {
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--ui-r-sm);
  background: transparent;
  color: var(--ui-text-3);
  transition: background var(--ui-fast) var(--ui-ease),
    color var(--ui-fast) var(--ui-ease), border-color var(--ui-fast) var(--ui-ease);
}
.pz .tb-btn:hover {
  background: var(--ui-surface-2);
  border-color: var(--ui-line);
  color: var(--ui-text);
}
.pz .tb-btn svg { width: 15px; height: 15px; display: block; }
.pz .tb-btn .ic-sun { display: none; }
.root[data-theme="light"] .pz .tb-btn .ic-sun { display: block; }
.root[data-theme="light"] .pz .tb-btn .ic-moon { display: none; }

/* ---------------------------------------------------------------------------
   四、左栏导航
   ---------------------------------------------------------------------------
   结构由 nav_render.js 决定（虚拟滚动：行 absolute 定位在 .nav-vspacer 内，
   每项目＝一张四圆角卡片，树线由 .nav-segs 内联坐标画）。
   **行高契约不可动**：.nav-phead 44px / .nav-card 30px 与 state_layers.js 的
   NAV_PHEAD_HEIGHT / NAV_ROW_HEIGHT 同源，改一处＝虚拟滚动行错位。
   本段只换色与细节，不改几何。
   --------------------------------------------------------------------------- */

.pz .app-nav {
  width: 272px;
  background: var(--ui-surface-1);
  border-right: 1px solid var(--ui-line);
}

.pz .nav-tree {
  padding: 2px 0 14px;
  scrollbar-color: rgba(255, 255, 255, 0.14) transparent;
}
@supports selector(::-webkit-scrollbar) {
  .pz .nav-tree { scrollbar-width: auto; scrollbar-color: auto; }
  .pz .nav-tree::-webkit-scrollbar { width: 4px; }
  .pz .nav-tree::-webkit-scrollbar-thumb {
    background: var(--ui-line-2);
    border-radius: 2px;
    border: none;
    background-clip: padding-box;
  }
  .pz .nav-tree::-webkit-scrollbar-thumb:hover { background: var(--ui-line-3); }
}

/* 搜索区 */
.pz .nav-top {
  padding: 52px 10px 8px;   /* 顶到 52px＝主区顶栏高，两栏首行齐平 */
  gap: 8px;
}
.pz #navNewProject {
  height: 32px;
  border: 1px solid var(--ui-line-2);
  border-radius: var(--ui-r-sm);
  background: transparent;
  color: var(--ui-text);
  font-size: 13px;
  font-weight: 500;
  transition: background var(--ui-fast) var(--ui-ease),
    border-color var(--ui-fast) var(--ui-ease);
}
.pz #navNewProject:hover {
  background: var(--ui-surface-2);
  border-color: var(--ui-line-3);
}
.pz .nav-search-box {
  padding: 6px 9px;
  gap: 7px;
  background: var(--ui-surface-2);
  border: 1px solid transparent;
  border-radius: var(--ui-r-sm);
  transition: border-color var(--ui-fast) var(--ui-ease),
    background var(--ui-fast) var(--ui-ease);
}
.pz .nav-search-box:hover { border-color: var(--ui-line-2); }
.pz .nav-search-box:focus-within {
  background: var(--ui-surface-1);
  border-color: var(--ui-accent-line);
  box-shadow: none;
}
.pz .nav-search-box > svg { width: 13px; height: 13px; color: var(--ui-text-3); }
.pz .nav-search-box input { color: var(--ui-text); font-size: 13px; }
.pz .nav-search-box input::placeholder { color: var(--ui-text-3); }

/* 通知：钉在左栏右上角，与主区顶栏同高——左栏顶部不再有一条孤立的小按钮行 */
.pz .app-nav { position: relative; }
.pz #navActions {
  position: absolute;
  top: 12px;
  right: 10px;
  padding: 0;
  z-index: 3;
}
.pz #navNotifyBtn {
  position: relative;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--ui-r-sm);
  background: transparent;
  color: var(--ui-text-3);
  font-size: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background var(--ui-fast) var(--ui-ease), color var(--ui-fast) var(--ui-ease);
}
.pz #navNotifyBtn:hover { background: var(--ui-surface-2); color: var(--ui-text); border-color: transparent; }
.pz #navNotifyBtn::before {
  content: "";
  width: 15px;
  height: 15px;
  background: currentColor;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1.6a4.2 4.2 0 0 0-4.2 4.2v2.4L2.6 10.6a.7.7 0 0 0 .6 1h9.6a.7.7 0 0 0 .6-1L12.2 8.2V5.8A4.2 4.2 0 0 0 8 1.6Zm0 12.2a1.9 1.9 0 0 1-1.8-1.3h3.6A1.9 1.9 0 0 1 8 13.8Z'/></svg>") center/contain no-repeat;
  mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1.6a4.2 4.2 0 0 0-4.2 4.2v2.4L2.6 10.6a.7.7 0 0 0 .6 1h9.6a.7.7 0 0 0 .6-1L12.2 8.2V5.8A4.2 4.2 0 0 0 8 1.6Zm0 12.2a1.9 1.9 0 0 1-1.8-1.3h3.6A1.9 1.9 0 0 1 8 13.8Z'/></svg>") center/contain no-repeat;
}
.pz .nav-notify-count {
  top: 1px;
  right: 1px;
  min-width: 13px;
  height: 13px;
  padding: 0 3px;
  border-radius: var(--ui-r-pill);
  background: var(--ui-err);
  font-size: 9px;
  line-height: 13px;
  font-weight: 600;
}

/* 浅色下反转层级：侧栏底 surface-2（浅灰），卡片 surface-1（白）——
   白卡浮在浅灰底上，与深色下「亮卡浮在暗底」是同一套层级直觉。 */
.root[data-theme="light"] .pz .app-nav { background: var(--ui-bg); }
.root[data-theme="light"] .pz .nav-search-box { background: var(--ui-surface-3); }
.root[data-theme="light"] .pz .nav-search-box:focus-within { background: var(--ui-surface-1); }

/* 卡片容器（每项目一张） */
.pz .nav-phead {
  color: var(--ui-text);
  background: linear-gradient(to bottom, transparent 8px, var(--ui-surface-1) 8px);
}
.root[data-theme="light"] .pz .nav-phead {
  background: linear-gradient(to bottom, transparent 8px, var(--ui-surface-1) 8px);
}
.pz .nav-phead::before { border-color: var(--ui-line-2); }
.pz .nav-phead:hover { box-shadow: inset 0 8px 0 0 var(--ui-surface-2); }
.pz .nav-phead.current { box-shadow: inset 0 8px 0 0 var(--selbg); }
.pz .nav-card {
  color: var(--ui-text-2);
  background: var(--ui-surface-1);
}
.root[data-theme="light"] .pz .nav-card { background: var(--ui-surface-1); }
.pz .nav-card:hover { box-shadow: inset 0 0 0 999px var(--ui-surface-2); color: var(--ui-text); }
.pz .nav-card.current {
  box-shadow: inset 0 0 0 999px var(--selbg);
  color: var(--ui-text);
}
.pz .nav-card.current .nav-ctitle { color: var(--ui-text); font-weight: 500; }
.pz .nav-card.nav-last::after { border-color: var(--ui-line-2); }
.pz .nav-phead.nav-last::before { border-color: var(--ui-line-2); }

/* 当前强调条 */
.pz .nav-card.current::before {
  left: 2px;
  top: 6px;
  bottom: 6px;
  width: 2px;
  border-radius: 0 2px 2px 0;
  background: var(--ui-accent);
}
.pz .nav-phead.current::after {
  left: 2px;
  top: 15px;
  bottom: 7px;
  width: 2px;
  border-radius: 0 2px 2px 0;
  background: var(--ui-accent);
}

/* 树线 */
.pz .nav-seg { background: var(--ui-line-2); }

/* 箭头：描边色与卡片底色同源（咬断树线） */
.pz .nav-chev:not(.leaf):hover::before { background: var(--ui-line-2); }
.pz .nav-chev svg .under { stroke: var(--ui-surface-1); stroke-width: 5; }
.root[data-theme="light"] .pz .nav-chev svg .under { stroke: var(--ui-surface-1); }
.pz .nav-chev svg .top { stroke: var(--ui-text-3); stroke-width: 1.7; }
.pz .nav-card:hover svg .under,
.pz .nav-phead:hover svg .under { stroke: var(--ui-surface-2); }
.pz .nav-card.current svg .under,
.pz .nav-phead.current svg .under { stroke: var(--ui-surface-2); }
.pz .nav-chev.open svg { transform: rotate(90deg); }

/* 图标：去彩色噪点，统一中性；项目图标保留一点暖色作为层级锚点 */
.pz .nav-ico svg { background: var(--ui-surface-1); border-radius: 3px; }
.root[data-theme="light"] .pz .nav-ico svg { background: var(--ui-surface-1); }
.pz .nav-card:hover .nav-ico svg,
.pz .nav-phead:hover .nav-ico svg { background: var(--ui-surface-2); }
.pz .nav-card.current .nav-ico svg,
.pz .nav-phead.current .nav-ico svg { background: var(--ui-surface-1); }
.root[data-theme="light"] .pz .nav-card.current .nav-ico svg,
.root[data-theme="light"] .pz .nav-phead.current .nav-ico svg { background: var(--ui-surface-1); }
.pz .nav-ico.proj { color: #c9a227; }
.pz .nav-ico.doc { color: var(--ui-text-3); }
.root[data-theme="light"] .pz .nav-ico.proj { color: #a8871a; }
.root[data-theme="light"] .pz .nav-ico.doc { color: var(--ui-text-3); }

/* 标题 */
.pz .nav-pname { font-weight: 500; font-size: 13px; color: var(--ui-text); }
.pz .nav-ctitle { font-size: 13px; padding-left: 6px; }

/* 行尾 */
.pz .nav-time { font-size: 11px; color: var(--ui-text-3); font-variant-numeric: tabular-nums; }
.pz .nav-card:hover .nav-time,
.pz .nav-phead:hover .nav-time { opacity: 0; }
.pz .nav-more, .pz .nav-plus {
  color: var(--ui-text-3);
  border-radius: var(--ui-r-xs);
  transition: opacity var(--ui-fast) var(--ui-ease), background var(--ui-fast) var(--ui-ease);
}
.pz .nav-time { transition: opacity var(--ui-fast) var(--ui-ease); }
.pz .nav-more:hover, .pz .nav-plus:hover {
  color: var(--ui-text);
  background: var(--ui-line-2);
}
.pz .nav-spinner { border-color: var(--ui-line-3); border-top-color: var(--ui-accent); }
.pz .nav-loading { border-color: var(--ui-line-2); border-top-color: var(--ui-text-3); }

/* 空态 / 菜单 */
.pz .nav-empty { color: var(--ui-text-3); font-size: 12px; }
.pz .nav-menu {
  background: var(--ui-surface-1);
  border: 1px solid var(--ui-line-2);
  border-radius: var(--ui-r-md);
  box-shadow: var(--ui-shadow-2);
  padding: 4px;
}
.pz .nav-menu-item { border-radius: var(--ui-r-xs); font-size: 12.5px; color: var(--ui-text-2); }
.pz .nav-menu-item:hover { background: var(--ui-surface-2); color: var(--ui-text); }
.pz .nav-menu-item.danger { color: var(--ui-err); }
.pz .nav-menu-item.danger:hover { background: var(--ui-err-lo); }
.pz mark { background: rgba(224, 166, 60, 0.22); color: inherit; border-radius: 2px; }

/* 底部设置 */
.pz .nav-footer {
  margin-top: 0;
  padding: 8px 10px 10px;
  border-top: 1px solid var(--ui-line);
}
.pz .nav-foot-btn {
  height: 30px;
  padding: 0 8px;
  border: 1px solid transparent;
  border-radius: var(--ui-r-xs);
  background: transparent;
  color: var(--ui-text-3);
  font-size: 13px;
  transition: background var(--ui-fast) var(--ui-ease), color var(--ui-fast) var(--ui-ease);
}
.pz .nav-foot-btn:hover { background: var(--ui-surface-2); color: var(--ui-text); }

/* ---------------------------------------------------------------------------
   五、主舞台与对话外壳
   --------------------------------------------------------------------------- */

.pz .stage { background: var(--ui-bg); padding: 0; }
.pz .workspace { background: var(--ui-bg); }

.pz .chat {
  margin: 0;
  padding: 0;
  background: var(--ui-bg);
  border: 0;
  border-radius: 0;
  overflow: hidden;
  flex: 1;
  min-height: 0;
}

.pz .flow-view-scroll {
  padding: 0 var(--ui-col-pad) 28px;
  scroll-behavior: auto;
  /* [P29 · 2026-10-30 · 「输入框要同宽」的第二个机关]
     竖向滚动条会**吃掉内容区的宽度**（Chromium: scrollbar-width:thin = 10px），
     而输入卡不在这个滚动容器里 ⇒ 两边的「可用宽度」天然不等。
     实测（探针描边取像素，1280 视口）：
         内容列 .flow-view-column  left=298.9  right=1242.3  width=943.4
         输入卡 .flow-input-card   left=298.9  right=1252.6  width=953.7
                                      ↑ 左缘齐   ↑ 右缘差 10.3px = 滚动条占位
     ⇒ 同一个 --ui-col **不等于**同宽：还得让两边的滚动条槽位一样。
     ⇒ 本规则用 `scrollbar-gutter: stable` **恒定预留**槽位（不再随内容长短忽有忽无），
        输入区用**同一套**机制预留同样槽位（见 .flow-input-root）⇒ 两边可用宽度恒等。
     ⇒ 顺带修掉一个抖动：会话变长/变短时滚动条出现/消失，内容列宽度会跳 10px。 */
  scrollbar-gutter: stable;
}
.pz .flow-view-column {
  max-width: var(--ui-col);
  gap: 0;
  padding-top: 28px;
  /* 撑满可视高度：空态才能在消息区里真正垂直居中，而不是贴在顶部 */
  min-height: 100%;
}

/* 顶栏到首条消息的呼吸 */
.pz .flow-view-column > *:first-child { margin-top: 8px; }

/* 日期分隔：跨天会话的锚点。细线 + 居中日期，不抢消息本身 */
.pz .date-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 26px 0 10px;
  user-select: none;
}
.pz .date-divider::before,
.pz .date-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--ui-line);
}
.pz .date-divider span {
  flex: none;
  font-size: 11px;
  line-height: 1;
  color: var(--ui-text-3);
  letter-spacing: 0.02em;
}

/* ---------------------------------------------------------------------------
   六、消息
   --------------------------------------------------------------------------- */

/* 轮次容器：每个节点自带上下间距，用 margin 而非 gap（便于压缩连续过程行） */
.pz .flow-view-item { min-width: 0; }
/* 相邻过程行收紧：过程是「一条时间线」，不是一段段独立消息 */
.pz .step-row + .step-row,
.pz .step-row + .think,
.pz .think + .step-row { margin-top: 2px; }

/* 用户 */
.pz .flow-user-row { padding: 14px 0 2px; }
/* [P29 · 2026-10-30] 内容列 768→960 后，用户气泡若还卡 560px，
   会变成「列里右侧大片空白、字挤在中间」——视觉上等于没加宽。
   ⇒ 同步放宽到 720px（占列宽 75%），仍保留右侧留白（气泡右对齐）。 */
.pz .flow-user-stack { position: relative; max-width: min(720px, 84%); gap: 4px; }
.pz .flow-user-bubble {
  background: var(--ui-surface-1);
  border: 1px solid var(--ui-accent-line);
  border-radius: var(--ui-r-lg);
  border-bottom-right-radius: 6px;
  padding: 10px 15px;
  font-size: 15px;
  line-height: 1.65;
  color: var(--ui-text);
  word-break: break-word;
}
.pz .flow-user-bubble .md p:first-child { margin-top: 0; }
.pz .flow-user-bubble .md p:last-child { margin-bottom: 0; }
.pz .flow-user-row.is-pending .flow-user-bubble { opacity: 0.62; }

/* 用户气泡 hover 操作：绝对定位在气泡左侧（垂直居中），**不占行内高度** */
.pz .msg-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 24px;
  opacity: 0;
  transform: translateY(-1px);
  transition: opacity var(--ui-fast) var(--ui-ease), transform var(--ui-fast) var(--ui-ease);
  pointer-events: none;
}
.pz .flow-user-stack > .msg-actions {
  position: absolute;
  right: calc(100% + 10px);
  top: 50%;
  transform: translateY(-50%);
  white-space: nowrap;
}
.pz .flow-user-row:hover .msg-actions,
.pz .msg.assistant:hover .msg-actions,
.pz .msg-actions:focus-within {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.pz .msg-act {
  height: 24px;
  min-width: 24px;
  padding: 0 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: 1px solid transparent;
  border-radius: var(--ui-r-xs);
  background: transparent;
  color: var(--ui-text-3);
  font-size: 11px;
  transition: background var(--ui-fast) var(--ui-ease),
    color var(--ui-fast) var(--ui-ease), border-color var(--ui-fast) var(--ui-ease);
}
.pz .msg-act:hover {
  background: var(--ui-surface-2);
  border-color: var(--ui-line);
  color: var(--ui-text);
}
.pz .msg-act svg { width: 13px; height: 13px; display: block; }
.pz .msg-act.is-ok { color: var(--ui-ok); }
.pz .msg-time {
  font-size: 11px;
  color: var(--ui-text-3);
  font-variant-numeric: tabular-nums;
  margin-right: 4px;
  user-select: none;
}

/* 助手 */
.pz .msg.assistant {
  position: relative;
  padding: 14px 0 6px;
  margin: 0;
  font-size: 15px;
  line-height: 1.75;
  color: var(--ui-text);
  background: transparent;
  border: 0;
}

/* 助手元信息：默认极弱，hover 才亮 */
.pz .msg.assistant .meta {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 20px;
  margin-bottom: 6px;
  font-size: 11px;
  color: var(--ui-text-4);
  opacity: 0.85;
  transition: opacity var(--ui-fast) var(--ui-ease);
}
.pz .msg.assistant:hover .meta { opacity: 1; }
.pz .msg.assistant .meta .model-badge {
  border: 0;
  padding: 0;
  font-size: 11px;
  color: var(--ui-text-3);
  background: transparent;
  line-height: 1;
}
.pz .msg.assistant .meta .beh,
.pz .msg.assistant .meta .end {
  font-size: 11px;
  color: var(--ui-text-4);
}
.pz .msg.assistant .meta .mtime {
  font-size: 11px;
  color: var(--ui-text-3);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}
/* 元信息各项之间用细点分隔（比 gap 更清楚是一组同级信息） */
.pz .msg.assistant .meta > * + *::before {
  content: "·";
  margin-right: 8px;
  color: var(--ui-text-4);
}
.pz .msg.assistant .meta .end-error { color: var(--ui-err); }

/* 助手操作条：贴右下，hover 浮出 */
.pz .msg.assistant > .msg-actions {
  position: absolute;
  right: 0;
  top: 10px;
  z-index: 3;
  padding: 2px 4px;
  border-radius: var(--ui-r-sm);
  background: var(--ui-surface-2);
  border: 1px solid var(--ui-line);
  box-shadow: var(--ui-shadow-1);
}

/* 消息正文容器 */
.pz .md { color: var(--ui-text); }
.pz .md > *:first-child { margin-top: 0; }
.pz .md > *:last-child { margin-bottom: 0; }

/* ---------------------------------------------------------------------------
   七、Markdown
   --------------------------------------------------------------------------- */

.pz .md p {
  margin: 0 0 12px;
  line-height: 1.78;
}
.pz .md p:last-child { margin-bottom: 0; }

.pz .md h1,
.pz .md h2,
.pz .md h3,
.pz .md h4,
.pz .md h5,
.pz .md h6 {
  margin: 26px 0 10px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: -0.005em;
  color: var(--ui-text);
}
.pz .md h1 { font-size: 22px; }
.pz .md h2 {
  font-size: 18px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--ui-line);
}
.pz .md h3 { font-size: 16px; }
.pz .md h4 { font-size: 14.5px; }
.pz .md h5,
.pz .md h6 { font-size: 14px; color: var(--ui-text-2); }

.pz .md strong { font-weight: 600; color: var(--ui-text); }
.pz .md em { font-style: italic; }
.pz .md del { color: var(--ui-text-3); }
.pz .md mark {
  background: rgba(224, 166, 60, 0.22);
  color: inherit;
  border-radius: 3px;
  padding: 0 2px;
}

.pz .md a {
  color: var(--ui-accent);
  text-decoration: underline;
  text-decoration-color: var(--ui-accent-line);
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
  transition: color var(--ui-fast) var(--ui-ease), text-decoration-color var(--ui-fast) var(--ui-ease);
}
.pz .md a:hover { color: var(--ui-accent-hi); text-decoration-color: currentColor; }

.pz .md ul,
.pz .md ol {
  margin: 0 0 12px;
  padding-left: 22px;
}
.pz .md li {
  margin: 1px 0;
  line-height: 1.72;
  padding-left: 2px;
}
.pz .md li::marker { color: var(--ui-text-3); }
.pz .md ul ul,
.pz .md ol ol,
.pz .md ul ol,
.pz .md ol ul { margin: 3px 0; }

.pz .md li.task {
  list-style: none;
  margin-left: -20px;
  display: flex;
  align-items: flex-start;
  gap: 7px;
}
.pz .md li.task .cb {
  flex: none;
  font-size: 13px;
  line-height: 1.7;
  color: var(--ui-text-3);
}
.pz .md li.task.done { color: var(--ui-text-3); }
.pz .md li.task.done .cb { color: var(--ui-ok); }

.pz .md blockquote {
  margin: 0 0 12px;
  padding: 2px 0 2px 14px;
  border-left: 2px solid var(--ui-line-3);
  color: var(--ui-text-2);
}
.pz .md blockquote p { margin: 0 0 6px; }
.pz .md blockquote p:last-child { margin-bottom: 0; }

.pz .md hr {
  border: 0;
  border-top: 1px solid var(--ui-line);
  margin: 22px 0;
}

/* 行内码 */
.pz .md code {
  font-family: var(--ui-mono);
  font-size: 0.87em;
  padding: 1px 5px;
  border-radius: 5px;
  background: var(--ui-surface-3);
  border: 0;
  color: #e0b877;
  word-break: break-word;
}
.root[data-theme="light"] .pz .md code { color: #9a5a12; }

/* 代码块：容器 + 头部栏 + 高亮 */
.pz .md .code-block {
  margin: 2px 0 16px;
  border: 1px solid var(--ui-line);
  border-radius: var(--ui-r-md);
  background: var(--ui-surface-1);
  overflow: hidden;
}
.pz .md .code-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 32px;
  padding: 0 8px 0 12px;
  background: var(--ui-surface-2);
  border-bottom: 1px solid var(--ui-line);
}
.pz .md .code-lang {
  font-family: var(--ui-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--ui-text-3);
}
.pz .md .code-copy {
  height: 24px;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid transparent;
  border-radius: var(--ui-r-xs);
  background: transparent;
  color: var(--ui-text-2);
  font-size: 11px;
  transition: background var(--ui-fast) var(--ui-ease), color var(--ui-fast) var(--ui-ease);
}
.pz .md .code-copy:hover { background: var(--ui-surface-3); color: var(--ui-text); }
.pz .md .code-copy.is-ok { color: var(--ui-ok); }
.pz .md .code-copy svg { width: 12px; height: 12px; }
.pz .md pre {
  margin: 0;
  padding: 12px 14px;
  background: transparent;
  border: 0;
  overflow-x: auto;
  font-family: var(--ui-mono);
  font-size: 12.5px;
  line-height: 1.65;
  color: #c9d1d9;
  white-space: pre;
  tab-size: 2;
}
.root[data-theme="light"] .pz .md pre { color: #24292f; }
.pz .md pre code {
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font-size: inherit;
}

/* 语法着色（自研轻量 tokenizer，色板取自 GitHub Dark 的中性档） */
.pz .tok-key { color: #ff7b72; }
.pz .tok-str { color: #a5d6ff; }
.pz .tok-num { color: #79c0ff; }
.pz .tok-com { color: #8b949e; font-style: italic; }
.pz .tok-fn { color: #d2a8ff; }
.pz .tok-op { color: #ff7b72; }
.pz .tok-var { color: #ffa657; }
.root[data-theme="light"] .pz .tok-key { color: #cf222e; }
.root[data-theme="light"] .pz .tok-str { color: #0a3069; }
.root[data-theme="light"] .pz .tok-num { color: #0550ae; }
.root[data-theme="light"] .pz .tok-com { color: #6e7781; }
.root[data-theme="light"] .pz .tok-fn { color: #8250df; }
.root[data-theme="light"] .pz .tok-op { color: #cf222e; }
.root[data-theme="light"] .pz .tok-var { color: #953800; }

/* 表格 */
.pz .md .table-wrap {
  margin: 0 0 14px;
  border: 1px solid var(--ui-line);
  border-radius: var(--ui-r-md);
  overflow-x: auto;
}
.pz .md table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  line-height: 1.6;
}
.pz .md thead th {
  background: var(--ui-surface-2);
  font-weight: 500;
  color: var(--ui-text-2);
  text-align: left;
  white-space: nowrap;
}
.pz .md th,
.pz .md td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--ui-line);
  vertical-align: top;
}
.pz .md tbody tr:last-child td { border-bottom: 0; }
.pz .md tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.014); }
.root[data-theme="light"] .pz .md tbody tr:nth-child(even) { background: rgba(16, 19, 24, 0.018); }
.pz .md tbody tr:hover { background: var(--ui-surface-2); }

/* 语义标记 */
.pz .md .sm.ok { color: var(--ui-ok); }
.pz .md .sm.no { color: var(--ui-err); }
.pz .md .sm.warn { color: var(--ui-warn); }
.pz .md .sm.ask { color: var(--ui-accent); }
.pz .md .sm.box { color: var(--ui-text-3); }
.pz .md .sm.box.on { color: var(--ui-ok); }

/* ---------------------------------------------------------------------------
   八、过程行（工具 / 事件 / 思考 / 三席）
   --------------------------------------------------------------------------- */

/* 过程行容器：连续过程行收紧间距，形成「一条时间线」 */
.pz .step-row {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 3px 0 3px 2px;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--ui-text-3);
  border-radius: var(--ui-r-xs);
  transition: background var(--ui-fast) var(--ui-ease);
}
.pz .step-row:hover { background: rgba(255, 255, 255, 0.02); }
.root[data-theme="light"] .pz .step-row:hover { background: rgba(16, 19, 24, 0.025); }
.pz .step-row.has-detail { cursor: pointer; }

/* 事件名：原始 code 不再当徽标展示——降为极弱的小标签，仅在需要区分时可见 */
.pz .step-row .ev {
  flex: none;
  min-width: 0;
  max-width: 0;
  overflow: hidden;
  opacity: 0;
  font-family: var(--ui-mono);
  font-size: 10px;
  color: var(--ui-text-4);
  transition: max-width var(--ui-mid) var(--ui-ease), opacity var(--ui-mid) var(--ui-ease),
    margin var(--ui-mid) var(--ui-ease);
}
.pz .step-row:hover .ev {
  max-width: 130px;
  opacity: 1;
  margin-right: 2px;
}

.pz .step-row .txt {
  flex: 1;
  min-width: 0;
  color: var(--ui-text-2);
  word-break: break-word;
}
.pz .step-row .txt b { font-weight: 500; color: var(--ui-text); }
.pz .step-row .sub {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--ui-text-3);
  font-variant-numeric: tabular-nums;
}
/* 技术字段（fld() 生成的 key=value）默认不显示：对话界面讲「做了什么」，
   不讲「载荷字段叫什么」。hover 该行时才浮出，留痕仍在、噪音归零。 */
.pz .step-row .f,
.pz .step-row .k {
  font-family: var(--ui-mono);
  font-size: 10.5px;
  color: var(--ui-text-4);
}
.pz .step-row .f {
  display: none;
  margin-left: 4px;
}
.pz .step-row:hover .f { display: inline; }
.pz .step-row .mk.ok { color: var(--ui-ok); }
.pz .step-row .mk.no { color: var(--ui-err); }
.pz .step-row .mk.run { color: var(--ui-warn); }
.pz .step-row.err .txt { color: var(--ui-err); }

/* 状态点 */
.pz .step-row .mk.ok,
.pz .step-row .mk.no,
.pz .step-row .mk.run {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  font-size: 0;
  background: currentColor;
}
.pz .step-row .mk.run { animation: ui-blink 1.1s ease-in-out infinite; }
@keyframes ui-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* 缩进档退役后：子行只靠左侧细线区分 */
.pz .step-row.lv2,
.pz .step-row.lv3 { padding-left: 10px; }
.pz .step-row.lv2::before,
.pz .step-row.lv3::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 4px;
  bottom: 4px;
  width: 1px;
  background: var(--ui-line);
}

/* 轮次分隔：把「第 N 轮」从一条普通过程行升级成时间线分隔线——
   过程区读起来是「轮 → 动作 → 结果」，而不是一串同权重的日志行。 */
.pz .step-row[data-ev="round_start"] {
  align-self: stretch;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 22px 0 8px;
  padding: 0;
  font-size: 11px;
  letter-spacing: 0.02em;
  color: var(--ui-text-3);
}
.pz .step-row[data-ev="round_start"] .txt { flex: none; color: var(--ui-text-3); }
.pz .step-row[data-ev="round_start"]::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--ui-line);
}
.pz .step-row[data-ev="round_start"]:hover { background: transparent; }

/* 纯技术事件（pair_id / chars）：不进对话视觉，留痕在事件流里 */
.pz .step-row[data-ev="run_start"] { display: none; }

/* 上下文装配行：只在 hover 时可读，平时退成一条极淡的注脚 */
.pz .step-row[data-ev="context"] { font-size: 11px; color: var(--ui-text-3); }
.pz .step-row[data-ev="context"] .sub { color: var(--ui-text-3); }

/* 工具行 */
.pz .step-row.tool-row {
  align-self: stretch;   /* 卡片必须通栏：宽度随内容伸缩会显得参差 */
  width: 100%;
  align-items: center;
  gap: 9px;
  padding: 6px 10px;
  margin: 4px 0;
  border: 1px solid var(--ui-line);
  border-radius: var(--ui-r-sm);
  background: var(--ui-surface-1);
  color: var(--ui-text-2);
}
.pz .step-row.tool-row:hover {
  border-color: var(--ui-line-2);
  background: var(--ui-surface-2);
}
.pz .step-row.tool-row .tool-ico {
  width: 14px;
  height: 14px;
  flex: none;
  border-radius: 4px;
  background: var(--ui-text-4);
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M6.2 2.6a2.6 2.6 0 0 0-3.4 3.4l1.6-1.6 1.9.5.5 1.9-1.6 1.6a2.6 2.6 0 0 0 3.4-3.4l4.3 4.3a1.3 1.3 0 0 1-1.8 1.8L6.8 6.8'/><path d='M11.6 9.4l1.8 1.8a1.6 1.6 0 1 1-2.3 2.3l-1.8-1.8'/></svg>") center/contain no-repeat;
  mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M6.2 2.6a2.6 2.6 0 0 0-3.4 3.4l1.6-1.6 1.9.5.5 1.9-1.6 1.6a2.6 2.6 0 0 0 3.4-3.4l4.3 4.3a1.3 1.3 0 0 1-1.8 1.8L6.8 6.8'/><path d='M11.6 9.4l1.8 1.8a1.6 1.6 0 1 1-2.3 2.3l-1.8-1.8'/></svg>") center/contain no-repeat;
}
.pz .step-row.tool-row.ok .tool-ico { background: var(--ui-ok); }
.pz .step-row.tool-row.fail .tool-ico { background: var(--ui-err); }
.pz .step-row.tool-row.running .tool-ico {
  background: var(--ui-warn);
  animation: ui-blink 1.1s ease-in-out infinite;
}
.pz .step-row.tool-row .txt {
  display: flex;
  align-items: baseline;
  gap: 8px;
  color: var(--ui-text-2);
  /* 〔5715 · P18 文字超框〕允许这一行在 flex 行里收缩。
     不写 min-width:0 ⇒ flex item 的自动最小尺寸＝min-content ⇒
     长内容把这一行撑到内容宽（实测 1953px）⇒ 消息列被顶破、文字漏出框外。 */
  min-width: 0;
}
.pz .step-row.tool-row .txt b {
  font-family: var(--ui-mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--ui-text);
  /* 〔5715 · P18〕原来是 flex:none（＝永不收缩）⇒ 工具名槽按 max-content 撑开。
     实测：上游把「命令文本」当成了工具名（`cd "…" && python …`），这一槽直接
     宽 1953px ⇒ 768px 的消息列 scrollWidth 冲到 1994px ⇒ 文字横着漏出去、
     整条对话出现横向滚动条。
     改成「可收缩 ＋ 单行省略号」（与同行的 .targs / .tool-sum 同款），
     完整内容仍在点开的 .tool-body 里。 */
  flex: 0 1 auto;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pz .step-row.tool-row .targs {
  font-family: var(--ui-mono);
  font-size: 11px;
  color: var(--ui-text-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  /* 〔5715 · P18〕不写 min-width:0 ⇒ 自动最小尺寸＝nowrap 全文宽 ⇒
     这一项自己就把行撑宽（省略号也因此永远不生效）。 */
  min-width: 0;
  flex: 0 1 auto;
}
.pz .step-row.tool-row.fail .txt b { color: var(--ui-err); }
.pz .step-row.tool-row .tool-sum {
  flex-basis: 100%;
  /* 〔5715 · P18〕缩进由 **margin** 改 **padding**（与 style.css 的 .step-detail 同理）：
     margin 不计在 flex-basis 里、padding 计入（全局 box-sizing:border-box）
     ⇒ 原来 margin-left:23px ＋ basis:100% ＝ 外尺寸超出行宽 12px（实测越界）。 */
  margin: 3px 0 0 0;
  padding-left: 23px;
  font-size: 11.5px;
  color: var(--ui-text-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  /* 〔5715 · P18〕min-width:0 才能既收缩、又不撑破行。 */
  min-width: 0;
}
.pz .step-row.tool-row .tool-body {
  flex-basis: 100%;
  display: none;
  /* 〔5715 · P18〕同上：缩进改 padding，否则展开后同样越界 12px。 */
  margin: 6px 0 2px 0;
  padding: 10px 12px 10px 23px;
  border: 1px solid var(--ui-line);
  border-radius: var(--ui-r-sm);
  background: var(--ui-surface-2);
  font-family: var(--ui-mono);
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--ui-text-2);
  max-height: 320px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  cursor: text;
}
.pz .step-row.tool-row.open .tool-body { display: block; }
.pz .step-row.tool-row.open .tool-sum { display: none; }
.pz .step-row.tool-row .tool-body.err { border-color: rgba(240, 104, 95, 0.3); }

/* 让 tool-row 成为纵向可换行容器 */
.pz .step-row.tool-row { flex-wrap: wrap; }
.pz .step-row.tool-row .ev { display: none; }

/* 计划步骤清单 */
.pz .psteps {
  margin: 4px 0 6px 10px;
  padding: 8px 12px;
  border-left: 1px solid var(--ui-line-2);
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.pz .psteps .pstep {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 12px;
  color: var(--ui-text-2);
}
.pz .psteps .pstep .bt {
  flex: none;
  font-size: 10px;
  padding: 0 5px;
  border-radius: 3px;
  background: var(--ui-surface-3);
  color: var(--ui-text-3);
  line-height: 16px;
}
.pz .psteps .pstep .f {
  margin-left: auto;
  font-family: var(--ui-mono);
  font-size: 10px;
  color: var(--ui-text-4);
}

/* 步骤详情 pre */
.pz .step-detail {
  flex-basis: 100%;
  display: none;
  /* [5715 · 修] 缩进由 **margin** 改 **padding**（margin 不计进 flex-basis，
     10px 外边距把这一行推出容器 ⇒ 整行横向溢出 10px、右边框被裁，实测 19 行全中）。
     padding 计入 border-box（全局 box-sizing:border-box），缩进保留、溢出归零。 */
  margin: 6px 0 2px 0;
  padding: 10px 12px 10px 22px;
  border: 1px solid var(--ui-line);
  border-radius: var(--ui-r-sm);
  background: var(--ui-surface-2);
  font-family: var(--ui-mono);
  font-size: 11px;
  line-height: 1.6;
  color: var(--ui-text-2);
  max-height: 280px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  cursor: text;
}

/* 思考块 */
.pz .think {
  margin: 6px 0;
  border-radius: var(--ui-r-sm);
  font-size: 12.5px;
}
.pz .think-head {
  display: flex;
  align-items: center;
  gap: 7px;
  height: 26px;
  padding: 0 8px;
  border-radius: var(--ui-r-sm);
  color: var(--ui-text-3);
  cursor: pointer;
  user-select: none;
  transition: background var(--ui-fast) var(--ui-ease), color var(--ui-fast) var(--ui-ease);
}
.pz .think-head:hover { background: var(--ui-surface-2); color: var(--ui-text-2); }
.pz .think-ico {
  width: 13px;
  height: 13px;
  flex: none;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  border-top-color: transparent;
  opacity: 0.8;
}
.pz .think.thinking .think-ico { animation: spin 1.1s linear infinite; }
.pz .think.done .think-ico {
  border-color: var(--ui-text-4);
  border-top-color: var(--ui-text-4);
  opacity: 0.5;
}
.pz .think-lab { font-weight: 500; color: var(--ui-text-2); font-size: 12px; }
.pz .think-sep { color: var(--ui-text-4); }
.pz .think-sum {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ui-text-3);
  font-size: 12px;
}
.pz .think-time {
  flex: none;
  font-size: 11px;
  color: var(--ui-text-4);
  font-variant-numeric: tabular-nums;
}
.pz .think-body {
  margin: 2px 0 4px 20px;
  padding: 8px 12px;
  border-left: 1px solid var(--ui-line-2);
  color: var(--ui-text-3);
  font-size: 12.5px;
  line-height: 1.72;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 320px;
  overflow: auto;
}
.pz .think.collapsed .think-body { display: none; }

/* 三席卡片 */
.pz .seats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
  margin: 8px 0 10px;
}
.pz .seat-card {
  display: flex;
  flex-direction: column;
  /* 旧规则是 height:300px 固定高——短内容会空出大半张卡。
     改成内容自适应 + 上限 320：三张由 grid 拉到等高（并排可比），超高才内滚。 */
  height: auto;
  min-height: 96px;
  max-height: 320px;
  border: 1px solid var(--ui-line);
  border-radius: var(--ui-r-md);
  background: var(--ui-surface-1);
  padding: 10px 12px;
  min-width: 0;
}
/* 失败席：整卡描边转红（只标状态文字的话，三张卡扫过去看不出哪张挂了） */
.pz .seat-card:has(.st.fail) { border-color: rgba(240, 104, 95, 0.3); }
.pz .seat-card .sc-body { flex: 0 1 auto; }
.pz .seat-card .sc-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: -10px -12px 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--ui-line);
  font-size: 12px;
}
.pz .seat-card .sc-head .m {
  font-family: var(--ui-mono);
  font-size: 11px;
  color: var(--ui-text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pz .seat-card .sc-head .st {
  flex: none;
  font-size: 11px;
  color: var(--ui-text-2);
  padding: 0 7px;
  border: 1px solid var(--ui-line-2);
  border-radius: var(--ui-r-pill);
  background: var(--ui-surface-2);
  line-height: 18px;
}
.pz .seat-card .sc-head .st.fail { color: var(--ui-err); border-color: rgba(240, 104, 95, 0.35); }
.pz .seat-card .sc-body {
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--ui-text-2);
  max-height: 220px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
.pz .seat-card .sc-body .tk { color: var(--ui-text-3); }
.pz .seat-card .sc-body .ot { margin-top: 6px; color: var(--ui-text-2); }
.pz .seat-card .sc-foot {
  margin-top: 8px;
  padding-top: 6px;
  border-top: 1px solid var(--ui-line);
  display: flex;
  justify-content: space-between;
  font-size: 10.5px;
  color: var(--ui-text-4);
  font-variant-numeric: tabular-nums;
}
.pz .seat-card .sc-foot .ok { font-family: var(--ui-mono); }

/* 系统提示 / 错误 / 建卡 */
.pz .sys-newcards,
.pz .sys-tools,
.pz .sys-error {
  align-self: stretch;
  margin: 6px 0;
  padding: 8px 12px;

/* [P29 · 2026-10-30 · 「输入框要同宽」的另一半机关]
   消息列在 `.flow-view-scroll`（滚动容器）里 ⇒ 竖向滚动条吃掉 10px 宽度；
   输入卡不在滚动容器里 ⇒ 两边「可用宽度」天然差 10px。
   实测（探针描边 + 按颜色取像素，1280 视口）：
       内容列 .flow-view-column  left=298.9  right=1242.3  width=943.4
       输入卡 .flow-input-card   left=298.9  right=1252.6  width=953.7   ← 右缘差 10.3px
   ⇒ 同一个 --ui-col **不等于**同宽，还差一个滚动条槽位。
   ⇒ 解法：两侧用**同一套**机制预留同样宽的槽位（scrollbar-gutter: stable），
     浏览器在同一个平台给出的槽位宽度必然相同 ⇒ 可用宽度恒等 ⇒ 像素级同宽。
     · 消息侧 .flow-view-scroll：scrollbar-gutter: stable（恒定预留，不再忽有忽无）
     · 输入侧 .flow-input-root：同样 stable，并把槽位画成全透明（看不见但占位）
   ⚠ 为什么不能只在消息侧加 stable：那样内容长短变化时输入卡与内容列会**互相漂移**
     （一个恒定、一个随滚动条出现而变）⇒ 反而更糟。必须两侧同时改。 */
.pz .flow-input-root {
  /* 槽位要隐形：透明轨道 + 透明滑块（否则输入区右侧会多一条可见滚动条） */
  scrollbar-color: transparent transparent;
  scrollbar-gutter: stable;
  overflow-y: auto;
  /* 焦点光环（0 0 0 3px）画在卡片外沿 ⇒ 顶部补 4px 内边距，别被 overflow 裁掉 */
  padding-top: 4px;
  padding-bottom: 14px;
}

.pz .flow-input-card {
  /* [5715 · 1.4.11] 描边是**控件识别线**（不是装饰线）⇒ 用 ≥3:1 的 --ui-line-input */
  border: 1px solid var(--ui-line-input);
  border-radius: var(--ui-r-xl);
  background: var(--ui-surface-1);
  box-shadow: none;
  padding-top: 12px;
  gap: 10px;
  transition: border-color var(--ui-mid) var(--ui-ease),
    background var(--ui-mid) var(--ui-ease);
}

.pz .flow-input-card:focus-within {

  /* 焦点环：只改描边色变化太弱（深底下几乎看不出），补一圈极淡的 accent 光晕 */
  box-shadow: 0 0 0 3px var(--ui-accent-lo);

/* ---------------------------------------------------------------------------
   十二、Inspector 右栏（改为浮动抽屉）
   --------------------------------------------------------------------------- */

.pz .inspector {
  /* [2026-10-29 用户令] 「右侧边栏的展开，应该不动卡片正文信息，现在正文信息会随
     右侧边栏展开而移动，根本没有必要」
     病根：抽屉原来是 flex 子项（flex:none + width 0→348）⇒ 展开时 .ws-right 被挤窄
     ⇒ 正文列在更窄的空间里重新居中 ⇒ **左移 174px**（1920 屏实测）。
     它本来就浮在正文右侧的空白上、不压正文，凭什么让正文动？
     ⇒ 改成**绝对定位浮层**：不参与 flex，`.ws-right` 宽度恒定，正文位置恒定。 */
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 0;
  flex: none;
  background: var(--ui-surface-1);
  border-left: 0;
  overflow: hidden;
  transition: width var(--ui-mid) var(--ui-ease);
  z-index: 70;
}
.pz .inspector.open {
  width: 348px;
  border-left: 1px solid var(--ui-line);
  box-shadow: -14px 0 36px rgba(0, 0, 0, 0.22);
}
.pz .inspector .insp-body {
  width: 348px;
  height: 100%;
  overflow-y: auto;
  padding: 18px 16px 28px;
  opacity: 0;
  transition: opacity var(--ui-fast) var(--ui-ease);
}
.pz .inspector.open .insp-body { opacity: 1; }
.pz .inspector:not(.open) .insp-body { display: none; }

/* 右缘竖排标签退役：对话页的卡详情入口统一到顶栏 #topInspBtn。
   保留元素（workspace.js 仍绑 onclick，删元素会 TypeError），只做视觉隐藏。 */
.pz .insp-tab { display: none; }
.pz .insp-tab::before {
  content: "";
  width: 14px;
  height: 14px;
  background: currentColor;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm0 2.4a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm.9 8H7.1V7h1.8v4.9Z'/></svg>") center/contain no-repeat;
  mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm0 2.4a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm.9 8H7.1V7h1.8v4.9Z'/></svg>") center/contain no-repeat;
}
.pz .insp-tab:hover {
  background: var(--ui-surface-3);
  color: var(--ui-text);
}
.pz .inspector.open .insp-tab {
  border-radius: var(--ui-r-sm) 0 0 var(--ui-r-sm);
}

  margin-top: 2px;
}
.pz .inspector .ws-edit:focus,
.pz .inspector input[type="text"]:focus,
.pz .inspector select:focus {
  border-color: var(--ui-accent-line);
  background: var(--ui-surface-1);
}
.pz .inspector .ws-edit::placeholder,
.pz .inspector input::placeholder { color: var(--ui-text-4); }

.pz .inspector .edit-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.pz .inspector .save-status { font-size: 11px; color: var(--ui-text-3); }
.pz .inspector .save-status.ok { color: var(--ui-ok); }
.pz .inspector .save-status.err { color: var(--ui-err); }

.pz .inspector .rej-item,
.pz .inspector .h-item {
  padding: 7px 10px;
  margin-bottom: 4px;
  border: 1px solid var(--ui-line);
  border-radius: var(--ui-r-sm);
  background: var(--ui-surface-2);
  font-size: 12px;
  line-height: 1.65;
  color: var(--ui-text-2);
  word-break: break-word;
}
.pz .inspector .rej-empty {
  padding: 10px 12px;
  border: 1px dashed var(--ui-line-2);
  border-radius: var(--ui-r-sm);
  font-size: 12px;
  color: var(--ui-text-4);
}
.pz .inspector .history-toggle {
  font-size: 11.5px;
  color: var(--ui-text-3);
  cursor: pointer;
  padding: 4px 0;
  user-select: none;
}
.pz .inspector .history-toggle:hover { color: var(--ui-text); }
.pz .inspector .history-list { display: none; margin-top: 6px; }
.pz .inspector .history-list.expanded { display: block; }

.pz .inspector .add-child-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.pz .inspector .add-child-row input { flex: 1; min-width: 0; }
.pz .inspector .rel-add-row select { flex: 1; min-width: 0; }
.pz .inspector .rel-add-row .btn { flex: none; }

.pz .inspector .rel-del {
  margin-left: auto;
  border: 0;
  background: transparent;
  color: var(--ui-text-4);
  font-size: 12px;
  cursor: pointer;
  padding: 0 2px;
}
.pz .inspector .rel-del:hover { color: var(--ui-err); }

/* ---------------------------------------------------------------------------
   十三、弹窗 / Toast / 通知面板
   --------------------------------------------------------------------------- */

.pz .draft-modal-overlay {
  background: rgba(4, 6, 10, 0.62);
  backdrop-filter: blur(2px);
}
.pz .draft-modal-panel {
  width: 640px;
  max-height: 74vh;
  border: 1px solid var(--ui-line-2);
  border-radius: var(--ui-r-lg);
  background: var(--ui-surface-1);
  box-shadow: var(--ui-shadow-3);
}
/* 草稿区是「给人读的文档」，不是代码：用正文排版，不用等宽字 */
.pz .draft-area {
  font-family: var(--ui-font);
  font-size: 13.5px;
  line-height: 1.8;
  color: var(--ui-text);
  background: var(--ui-surface-2);
  border-color: var(--ui-line);
  border-radius: var(--ui-r-sm);
  padding: 14px 16px;
}
.pz .draft-modal-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--ui-line);
  font-size: 14px;
  font-weight: 500;
}
.pz .draft-modal-foot {
  padding: 12px 18px;
  border-top: 1px solid var(--ui-line);
  background: var(--ui-surface-2);
}
.pz .btn {
  height: 30px;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--ui-line-2);
  border-radius: var(--ui-r-sm);
  background: var(--ui-surface-2);
  color: var(--ui-text);
  font-size: 12.5px;
  font-weight: 400;
  transition: background var(--ui-fast) var(--ui-ease),
    border-color var(--ui-fast) var(--ui-ease), color var(--ui-fast) var(--ui-ease);
}
.pz .btn:hover { background: var(--ui-surface-3); border-color: var(--ui-line-3); }
.pz .btn.primary {
  background: var(--sendbg);
  border-color: var(--sendbg);
  color: #fff;
}
.pz .btn.primary:hover { background: var(--sendhi); border-color: var(--sendhi); }
.pz .btn.ghost { background: transparent; }
.pz .btn.ghost:hover { background: var(--ui-surface-2); }
.pz .btn.danger { background: var(--ui-err); border-color: var(--ui-err); color: #fff; }

.pz .toast {
  border: 1px solid var(--ui-line-2);
  border-radius: var(--ui-r-md);
  background: var(--ui-surface-2);
  box-shadow: var(--ui-shadow-2);
  color: var(--ui-text);
  font-size: 12.5px;
  padding: 10px 14px;
}
.pz .toast.error { border-color: rgba(240, 104, 95, 0.4); color: var(--ui-err); }
.pz .toast.success { border-color: rgba(78, 201, 138, 0.4); color: var(--ui-ok); }

.pz .notify-panel {
  top: 50px;
  left: 10px;
  width: 356px;
  max-height: 62vh;
  border: 1px solid var(--ui-line-2);
  border-radius: var(--ui-r-md);
  background: var(--ui-surface-1);
  box-shadow: var(--ui-shadow-2);
  overflow: hidden auto;
}
.pz .notify-panel .np-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 38px;
  padding: 0 12px;
  border-bottom: 1px solid var(--ui-line);
  font-size: 12.5px;
  color: var(--ui-text-2);
}
.pz .notify-panel .np-close {
  width: 24px;
  height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--ui-r-xs);
  background: transparent;
  color: var(--ui-text-3);
  font-size: 14px;
  line-height: 1;
}
.pz .notify-panel .np-close:hover { background: var(--ui-surface-2); color: var(--ui-text); }
.pz .notify-panel .np-list { padding: 6px; }

/* ---------------------------------------------------------------------------
   十四、动效与可访问性
   --------------------------------------------------------------------------- */

@media (prefers-reduced-motion: reduce) {
  .pz *,
  .pz *::before,
  .pz *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* 窄屏：左栏收窄、内容列贴边 */
@media (max-width: 1180px) {
  .pz .app-nav { width: 240px; }
  .pz { --ui-col-pad: 20px; }
}

/* 窄屏（<900px）：左栏改抽屉——不是直接消失（消失＝没有导航可用） */
.pz .nav-drawer-btn { display: none; }
@media (max-width: 900px) {
  .pz { --ui-col-pad: 16px; }
  .pz .nav-drawer-btn { display: inline-flex; }
  .pz .app-nav {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 280px;
    /* 对话页内 .workspace 是 z-index:100 的绝对定位层 ⇒ 抽屉必须高于它 */
    z-index: 9998;
    transform: translateX(-100%);
    transition: transform var(--ui-mid) var(--ui-ease);
    box-shadow: 1px 0 0 var(--ui-line-2), 24px 0 48px rgba(0, 0, 0, 0.45);
  }
  .pz.nav-open .app-nav { transform: none; }
  .pz.nav-open .nav-top { padding-top: 16px; }
  .pz.nav-open #navActions { top: 12px; }
}

/* 空项目徽标（无根卡）：提示性质，不与标题抢注意力 */
.pz .nav-pempty {
  border: 1px dashed var(--ui-line-2);
  border-radius: var(--ui-r-xs);
  background: transparent;
  color: var(--ui-text-4);
  font-size: 10.5px;
  line-height: 1.5;
  padding: 0 5px;
}
.pz .nav-pempty:hover { color: var(--ui-text-2); border-color: var(--ui-line-3); }

/* ---------------------------------------------------------------------------
   过程细节开关（顶栏 #procToggleBtn）
   ---------------------------------------------------------------------------
   折叠态：只留工具调用与轮次分隔。运行时注脚（装配上下文/判断协议/交付拼接/
   完成汇总/建卡提案）在折叠态不占位置——它们对「读对话」的人是噪音，
   对「对账」的人是证据，所以做成可切换，而不是二选一删掉。
   --------------------------------------------------------------------------- */
.pz.proc-collapsed .step-row:not(.tool-row):not([data-ev="round_start"]) {
  display: none;
}
.pz.proc-collapsed .step-row[data-ev="round_start"] { margin-top: 14px; }
.pz .tb-btn.is-off { color: var(--ui-text-4); }
.pz .tb-btn.is-off:hover { color: var(--ui-text-2); }

/* 搜索清除键：有输入才出现（不占常态空间） */
.pz .nav-search-clear {
  flex: none;
  width: 18px;
  height: 18px;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ui-text-3);
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
}
.pz .nav-search-clear:hover { background: var(--ui-line-2); color: var(--ui-text); }
.pz .nav-search-box.has-value .nav-search-clear { display: inline-flex; }

/* 窄屏：气泡接近满宽，左侧放不下操作条 —— 落到气泡下方，仍是绝对定位（不占位） */
@media (max-width: 1100px) {
  .pz .flow-user-stack > .msg-actions {
    right: 0;
    top: calc(100% + 2px);
    transform: none;
  }
  .pz .flow-user-row { padding-bottom: 12px; }
}

/* 切卡入场：只动 opacity（不动位移，避免长会话整块跳动） */
.pz .flow-view-root.view-enter { animation: view-enter 160ms var(--ui-ease); }
@keyframes view-enter { from { opacity: 0; } to { opacity: 1; } }

/* 骨架：更像真实内容的分布（首块是用户气泡的右对齐块） */
.pz .chat-skeleton { padding: 28px 0 0; gap: 12px; }
.pz .chat-skeleton .sk-bubble {
  align-self: flex-end;
  width: 42%;
  height: 44px;
  border-radius: var(--ui-r-lg);
  background: var(--ui-surface-2);
  margin-bottom: 10px;
}

/* ---------------------------------------------------------------------------
   按压态：所有可点元素在按下瞬间必须有反馈（否则「点了没反应」）
   ---------------------------------------------------------------------------
   用 filter 而不是 transform：发送键等元素本身带 translateY，叠 transform 会跳位。
   --------------------------------------------------------------------------- */
.pz .btn:active,
.pz .tb-btn:active,
.pz .msg-act:active,
.pz .flow-input-primary:active:not(:disabled),
.pz .flow-queue-action:active:not(:disabled),
.pz .ce-hint:active,
.pz .nav-more:active,
.pz .nav-plus:active,
.pz .md .code-copy:active {
  filter: brightness(0.86);
}
.pz .nav-card:active,
.pz .nav-phead:active {
  box-shadow: inset 0 0 0 999px var(--ui-surface-3);
}
.pz .flow-view-older-btn:active:not(:disabled) { filter: brightness(0.9); }
.pz .flow-view-to-bottom:active { filter: brightness(0.9); }

/* 底部设置入口：齿轮从 Unicode ⚙ 换成与铃铛/搜索同一套线性 SVG */
.pz .nav-foot-btn::before {
  content: "";
  width: 15px;
  height: 15px;
  flex: none;
  background: currentColor;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 5.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6Zm0 1.4a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8Z'/><path d='M7 1.4h2l.25 1.55.9.52 1.45-.6 1.42 1.42-.6 1.45.52.9L14.9 7v2l-1.55.25-.52.9.6 1.45-1.42 1.42-1.45-.6-.9.52L9 14.6H7l-.25-1.64-.9-.52-1.45.6-1.42-1.42.6-1.45-.52-.9L1.1 9V7l1.64-.25.52-.9-.6-1.45 1.42-1.42 1.45.6.9-.52L7 1.4Z' fill='none' stroke='currentColor' stroke-width='1.3' stroke-linejoin='round'/></svg>") center/contain no-repeat;
  mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 5.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6Zm0 1.4a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8Z'/><path d='M7 1.4h2l.25 1.55.9.52 1.45-.6 1.42 1.42-.6 1.45.52.9L14.9 7v2l-1.55.25-.52.9.6 1.45-1.42 1.42-1.45-.6-.9.52L9 14.6H7l-.25-1.64-.9-.52-1.45.6-1.42-1.42.6-1.45-.52-.9L1.1 9V7l1.64-.25.52-.9-.6-1.45 1.42-1.42 1.45.6.9-.52L7 1.4Z' fill='none' stroke='currentColor' stroke-width='1.3' stroke-linejoin='round'/></svg>") center/contain no-repeat;
}
.pz .nav-foot-btn .gear-glyph { display: none; }

/* ============================================================
   [评审窗口 2026-10-29 · 用户口径（第四次修正）]
     「你是不是缩小了正卡对话区域的宽度？就为了你这张浮窗？」
     「你摆在正卡信息流右侧，空间是足足够够的」
     「不是真的浮一个窗口在所有信息上方，它的层级和卡片信息流是同级的」
     「右侧边栏展开，应该盖住它」
     「点击它展开不是向右展开，是向左展开，挤压卡片本身的信息流，给它留出空间，而且是充分展开」
     「收缩状态不需要显示那么多信息，显示最近的一条就足够了」

   ⇒ 收缩态：落在对话列右侧的**空白带**里，对话区宽度**一点不动**、不覆盖任何文字。
     高度只有一行（头部 38 ＋ 最近一条 34）。
   ⇒ 展开态：**向左**扩到 640，`.ws-right` 加 padding-right 让位（这才叫挤压对话区）。
   ⇒ 层级：低于右侧 inspector（`z-index` 55 vs 70）——它展开时盖住本窗口。
   ============================================================ */
.pz .fwin {
  position: fixed;
  left: auto;
  right: 16px;          /* JS 会按对话列右缘改成 left，这里只是兜底 */
  top: 88px;
  width: 380px;
  display: flex;
  flex-direction: column;
  background: var(--ui-surface-1);
  border: 1px solid var(--ui-line);
  border-radius: 10px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
  z-index: 55;          /* 低于 .inspector(70)：右侧抽屉展开时盖住它 */
  overflow: hidden;
  transition: width var(--ui-mid, 0.18s) var(--ui-ease, ease),
              height var(--ui-mid, 0.18s) var(--ui-ease, ease);
}
.pz .fwin[hidden] { display: none; }
.pz .fwin.dragging { transition: none; user-select: none; }

/* [对齐场浮窗 2026-11-11] 对齐窗与评审窗同构同位：
   · 单开时顶在 88px（与评审窗同一个默认位）；
   · 评审窗也开着 ⇒ JS 把它顶到评审窗底缘之下（alPlace）；
   · 评审窗全幅展开（.rv-full）时本窗藏起——那块地方归评审窗用。 */
.pz.rv-full .fwin-al { display: none; }
.pz .fwin-al .fwin-dot { background: #5cc8d8; }

/* 展开：**向左长、把正卡挤窄**，但正卡信息流**还在**（不是换页、不是隐藏）。
   用户：「点击它展开不是向右展开，是向左展开，挤压卡片本身的信息流，给它留出空间，
   而且是充分展开」＋「不要这么极端好吗？……你现在完全换了一个页面」

   宽度取内容区的六成左右：1920 屏 → 900（正卡剩 636，对话列被挤窄但仍可读）；
   1366 屏 → 765（正卡剩 577）。让位用 padding-right，对话列在剩余空间里重新居中。 */
/* 展开：向左长、把正文**挤窄**（用户：「点击它展开不是向右展开，是向左展开，
   挤压卡片本身的信息流，给它留出空间，而且是充分展开」）。
   ★ 注意这里跟 inspector 是**两条不同的规则**：
     · 评审窗口展开 ⇒ 挤正文（padding-right 让位，正文变窄但仍然在）
     · 卡详情抽屉展开 ⇒ **不动正文**（它已改成绝对定位浮层，见上）
   宽度取内容区六成，但给正文留 500px 下限（860 = 左栏 360 ＋ 500）。 */
.pz { --rv-full-w: min(56vw, 900px, calc(100vw - 860px)); }

.pz .fwin[data-mode="full"] {
  right: 16px;
  left: auto;
  width: var(--rv-full-w);
  top: 56px;
  bottom: 20px;
  height: auto;
  border-radius: 12px;
}
.pz.rv-full .ws-right {
  padding-right: calc(var(--rv-full-w) + 32px);
  transition: padding-right var(--ui-mid, 0.18s) var(--ui-ease, ease);
}
/* [对齐场浮窗 2026-11-11] 对齐窗全幅展开时同款让位（与 rv-full 同口径）。 */
.pz.al-full .ws-right {
  padding-right: calc(var(--rv-full-w) + 32px);
  transition: padding-right var(--ui-mid, 0.18s) var(--ui-ease, ease);
}

/* 右侧卡详情抽屉展开时盖住本窗口（用户：「右侧边栏展开，应该盖住它」） */
.pz .inspector { z-index: 70; }

/* ---- 头：一行 ---- */
.pz .fwin-head {
  flex: none;
  height: 38px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 4px 0 11px;
  border-bottom: 1px solid var(--ui-line);
  cursor: grab;
  user-select: none;
}
.pz .fwin-head:active { cursor: grabbing; }
.pz .fwin[data-mode="full"] .fwin-head { cursor: default; }
.pz .fwin-dot {
  width: 7px; height: 7px; border-radius: 50%; flex: none;
  background: var(--ui-accent);
  box-shadow: 0 0 0 3px rgba(125, 136, 238, 0.16);
  animation: fwinPulse 1.8s ease-in-out infinite;
}
.pz .fwin.done .fwin-dot { background: var(--ui-ok); animation: none; box-shadow: 0 0 0 3px var(--ui-ok-lo); }
@keyframes fwinPulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }
.pz .fwin-title {
  font-size: 12.5px; font-weight: 600; color: var(--ui-text); flex: none;
  max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pz .fwin-count {
  font-size: 11px; font-variant-numeric: tabular-nums; flex: none;
  color: var(--ui-text-2); padding: 1px 6px;
  background: var(--ui-surface-2); border-radius: 6px;
}
.pz .fwin-sp { flex: 1; min-width: 4px; }
.pz .fwin-btn {
  flex: none; width: 24px; height: 24px; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--ui-text-2);
  background: transparent; border: 0; border-radius: 6px; cursor: pointer;
}
.pz .fwin-btn:hover { background: var(--ui-surface-3, var(--ui-surface-2)); color: var(--ui-text); }

/* ---- 收缩态：**滚动事件列表** + 底部实时行 ---- */
/* [2026-10-31 用户令「所有动作、思考、事件都要看得见」] 改前这里是"永远只有最近一条"，
   每条新事件把上一行覆盖掉 ⇒ 用户看不到过程。现在改成滚动列表：
   已完成事件逐条追加，底部一行显示正在逐字输出的内容。 */
.pz .fwin-last {
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: 0;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--ui-text-2);
  cursor: pointer;
  max-height: 40vh;
  overflow: hidden;
}
.pz .fwin-events {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 6px 11px 2px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  scroll-behavior: smooth;
}
.pz .fwin-ev {
  display: flex;
  align-items: baseline;
  gap: 7px;
  min-width: 0;
}
.pz .fwin-ev > time {
  flex: none; width: 46px; opacity: 0.5; font-size: 10px;
  font-variant-numeric: tabular-nums;
}
.pz .fwin-ev > .t {
  flex: 1; min-width: 0;
  overflow-wrap: anywhere;
  color: var(--ui-text-2);
}
.pz .fwin-ev.is-tool > .t { color: var(--ui-accent, #6aa9ff); }
.pz .fwin-ev.is-speak > .t { color: var(--ui-text); }
.pz .fwin-ev.is-error > .t { color: var(--ui-err, #ff6b6b); }

const collapsedLock={};
function autoFold(){stat(byId["card_001"]);
 for(const c of CARDS){if(collapsedLock[c.id]||!c.p||c.k==="master"||!c.ch.length)continue;

  x0=Math.min(x0,c.x);y0=Math.min(y0,c.top);x1=Math.max(x1,c.x+c.w);y1=Math.max(y1,c.bot)}

  (main.clientWidth-110)/(b.x1-b.x0+40),(main.clientHeight-130)/(b.y1-b.y0+40))));

  k:simN%3?"unit":"worker",s:simN%3?"run":"qed",p:p.id,ch:[]};
 if(n.s==="run")n.st="初始化 · 领取任务中…";
 n.attach=EXEC.has(n.k)&&byId[n.p].k==="master";

   <button class="flow-queue-header" type="button"><span class="flow-queue-lead"><svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4h10M2 7h10M2 10h6"/></svg></span>
   <span class="flow-queue-count">2 条排队消息</span><span class="flow-queue-chevron"><svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5L7 5l3.5 3.5"/></svg></span></button>
   <ul class="flow-queue-list">
    <li class="flow-queue-row"><span class="flow-queue-lead"><svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4h10M2 7h10M2 10h6"/></svg></span><span class="flow-queue-preview">验收口径最终版发我一份</span></li>
    <li class="flow-queue-row"><span class="flow-queue-lead"><svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4h10M2 7h10M2 10h6"/></svg></span><span class="flow-queue-preview">顺带把挂列也归置一下</span></li>
   </ul></div></div>`);
 if(un)c.unread=null;
 document.getElementById("modelBadgeMount").innerHTML=`<span class="model-badge">${mdl}</span>`;
 document.getElementById("inspBody").innerHTML=
  `<div class="blocktitle">${esc(c.t)}<span class="note">${c.id}</span></div>
   <div class="ws-title">${esc(c.t)}</div>
   ${[["类型",`<span class="type-badge">${c.k}</span>`],["状态",SNAME[c.s]],["模型",mdl],
    ["父卡",par?esc(par.t):"—"],["子卡",c.ch.filter(k=>!k.attach).length+" 张"],
    ["挂列",c.ch.filter(k=>k.attach).length+" 张"]]
    .map(([k,v])=>`<div class="rel-item"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")}`;
 openDr(null);tip.classList.remove("on");mpop.classList.remove("open");
 ROOT.dataset.view="chat";buildNav(navQ.value);build();
 /* 切卡收场务态：让位类清掉，再按目标卡挂载收缩浮窗 */
 if(typeof chatViewEl!=="undefined"){chatViewEl.classList.remove("rv-full","al-full");
  rvWin.dataset.mode="compact";alWin.dataset.mode="compact";updateFwins(c)}}
chatArea.onclick=e=>{

document.getElementById("chatCrumb").onclick=e=>{const s=e.target.closest(".cseg");

document.getElementById("canvasEntryBtn").onclick=backToCanvas;
const inspEl=document.getElementById("inspector");
document.getElementById("topInspBtn").onclick=()=>inspEl.classList.toggle("open");
document.getElementById("inspTab").onclick=()=>inspEl.classList.toggle("open");
document.getElementById("procToggleBtn").onclick=e=>{const b=e.currentTarget,off=b.classList.toggle("is-off");
 b.setAttribute("aria-pressed",off?"false":"true");
 document.querySelector(".view-chat").classList.toggle("proc-off",off)};
document.getElementById("themeToggleBtn").onclick=()=>{
 ROOT.dataset.theme=ROOT.dataset.theme==="light"?"dark":"light"};
document.getElementById("cv-full").onclick=()=>{

document.getElementById("navSettingsBtn").onclick=()=>toast("设置 · 另稿");
navQ.oninput=e=>{e.target.closest(".nav-search-box").classList.toggle("has-value",!!e.target.value);buildNav(e.target.value)};

/* 输入卡镜像层同步（真实 input-bar.js：ta 透明+caret，backdrop 显示文字，mirror 隐形量尺寸） */
const compInEl=document.getElementById("compIn"),
 compMir=document.querySelector("[data-input-mirror]"),
 compBack=document.querySelector("[data-input-backdrop]");
function syncMirror(){const v=compInEl.value+"\u200b";
 compMir.textContent=v;compBack.innerHTML=esc(v)}
compInEl.addEventListener("input",syncMirror);syncMirror();
function sendComp(){const i=compInEl;if(!i.value.trim())return;
 chatArea.querySelector(".flow-view-column").insertAdjacentHTML("beforeend",
  `<div class="flow-view-item"><div class="flow-user-row"><div class="flow-user-stack"><div class="flow-user-bubble">${esc(i.value)}</div>
   <div class="msg-actions"><span class="msg-time">${new Date().toTimeString().slice(0,5)}</span></div></div></div></div>`);
 i.value="";syncMirror();chatArea.querySelector(".flow-view-scroll").scrollTop=1e9;toast("已发送 · 演示")}
document.getElementById("compSend").onclick=sendComp;
document.getElementById("compIn").onkeydown=e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendComp()}};
document.getElementById("autoToggleBtn").onclick=e=>{const b=e.target;
 b.textContent=b.textContent==="手动模式"?"自动模式":"手动模式";toast("演示：本卡 "+b.textContent)};
document.getElementById("draftBtn").onclick=()=>toast("起草需求 · 演示");
document.getElementById("statusDraftBtn").onclick=()=>toast("更新现状 · 演示");

/* ================= 场务：评审窗 / 对齐窗（.fwin）/ 职能档案 ================= */
const chatViewEl=document.querySelector(".view-chat"),
 rvWin=document.getElementById("rvWin"),alWin=document.getElementById("alWin");
/* 场的对话内容：真实行模板——批次摘要行 + 评审系过程行 + 卡间信 */
function venueFlow(k,v){
 const fld=(kk,vv)=>vv==null||vv===""?"":` <span class="f">· <span class="k">${kk}</span>=${vv}</span>`,
  item=h=>`<div class="flow-view-item">${h}</div>`,
  row=(t,txt,mk,cls,detail)=>`<div class="step-row ${cls||""}${detail?" has-detail":""}" data-ev="${t}">
   <span class="ev">${t}</span><span class="txt">${txt}</span><span class="sub">${mk||""}</span>
   ${detail?`<pre class="step-detail">${detail}</pre>`:""}</div>`,
  cmsg=(tp,disp,must,from,to,txt,reply)=>`<div class="msg cmsg ${tp.replace("msg_","")}">
   <div class="bar"></div><div class="body"><div class="head"><span class="tag">${tp} · ${disp}</span>
   ${must?'<span class="must">须回应</span>':""}<span class="dir">${from} → ${to}</span></div>
   <div class="txt">${esc(txt)}</div>${reply?`<div class="replyto">回应 ${reply}</div>`:""}</div></div>`;
 if(k==="rv")return item(`<div class="rv-batch"><span class="n">第 1 批次</span><b>${esc(v.t)} · ${byId[v.target].t}</b>
   <span>4 席 · 通过 <b>${v.passed}/${v.total}</b>${v.s==="run"?" · 评审中":" · 已收口"}</span></div>`)
  +item(row("review_batch_opened","评审批次开启"+fld("members",v.total)+fld("focus","边界与验收"),'<span class="mk">◎</span>评审',"ok"))
  +item(row("review_dispatch","评审派活"+fld("kind","verify")+fld("to","风控席"),'<span class="mk">▶</span>评审'))
  +item(row("review_spoke","QA席 发言"+fld("model","claude-sonnet-4-5")+fld("chars",412)+" · 通过",'<span class="mk">◆</span>评审',"ok"))
  +item(row("review_revise","被评方 改草稿"+fld("chars",861)+" · 已改",'<span class="mk">✎</span>评审',"ok"))
  +item(cmsg("msg_ask","询问",1,"风控席",v.target,"边界第 2 条『作者不评自己』——card_206 的验收件里有自评签名，是历史遗留还是漏判？"))
  +item(row("review_spoke","风控席 发言中"+fld("model","gpt-5.2"),'<span class="mk">◌</span>评审',"lv3"))
  +(v.s==="run"?item(`<div class="msg assistant pending"><div class="md">风控席正在核对第 2 条边界▍</div></div>`)
    +item(`<div class="flow-turn-status" role="status"><span class="flow-turn-status-label">Deliberating...</span><span class="flow-turn-status-clock">1:14</span></div>`)
   :item(row("review_all_passed","评审全员通过",'<span class="mk ok">✓</span>通过',"ok")));
 return item(`<div class="rv-batch"><span class="n" style="color:#5cc8d8">对齐场</span><b>${esc(v.topic||v.t)}</b>
   <span>3 席 · 已结束 <b>${v.ended}/${v.total}</b></span></div>`)
  +item(cmsg("msg_sync","同步",0,"card_204",v.target,"dispatch 字段命名口径：intent/route/lane，对齐后落卡面。"))
  +item(row("harness_message","条件集消息"+fld("to",v.target)+fld("kind","align_ping"),'<span class="mk">⇄</span>值守',"lv3"))
  +item(`<div class="msg assistant pending"><div class="md">等 ${v.target} 答复口径…▍</div></div>`)}
function fillFwin(k,v){
 const W=k==="rv"?rvWin:alWin;
 W.querySelector(".fwin-title").textContent=v.t;
 W.querySelector(".fwin-count").textContent=k==="rv"?`${v.passed}/${v.total}`:`${v.ended}/${v.total}`;
 W.querySelector(".fwin-events").innerHTML=v.events.map(([t,x,c])=>
  `<div class="fwin-ev${c?" is-"+c:""}"><time>${t}</time><span class="t">${esc(x)}</span></div>`).join("");
 W.querySelector(".fwin-live time").textContent="now";
 W.querySelector(".fwin-live .t").textContent=v.live;
 W.querySelector(".fwin-page").innerHTML=venueFlow(k,v)}
function showCompact(k,v){const W=k==="rv"?rvWin:alWin;
 fillFwin(k,v);W.hidden=false;W.dataset.mode="compact"}
function hideFwin(k){const W=k==="rv"?rvWin:alWin;
 W.hidden=true;W.dataset.mode="compact";
 chatViewEl.classList.remove(k==="rv"?"rv-full":"al-full")}
function openVenue(k,v){
 if(k==="fn")return;
 openChatView(v.target);
 const W=k==="rv"?rvWin:alWin;
 fillFwin(k,v);W.hidden=false;W.dataset.mode="full";
 chatViewEl.classList.add(k==="rv"?"rv-full":"al-full");
 if(k==="rv")alWin.dataset.mode==="full"&&(alWin.dataset.mode="compact");
 else if(rvWin.dataset.mode==="full"){rvWin.dataset.mode="compact"}}
document.getElementById("rvExpandBtn").onclick=()=>openVenue("rv",RV.find(v=>v.target===chatCard)||RV[0]);
document.getElementById("alExpandBtn").onclick=()=>openVenue("al",AL.find(v=>v.target===chatCard)||AL[0]);
document.getElementById("rvCloseBtn").onclick=()=>hideFwin("rv");
document.getElementById("alCloseBtn").onclick=()=>hideFwin("al");
/* 本卡有进行中场 → 收缩态浮窗自动在右上（openChatView 里调） */
function updateFwins(c){
 const rvv=RV.find(v=>v.target===c.id&&v.s==="run"),alv=AL.find(v=>v.target===c.id&&v.s==="run");
 rvv?showCompact("rv",rvv):hideFwin("rv");
 alv?showCompact("al",alv):hideFwin("al");
 // 对齐窗错位：评审窗也开着 → 顶到它底缘之下（alPlace 语义）
 if(!alWin.hidden&&!rvWin.hidden&&alWin.dataset.mode!=="full")
  alWin.style.top=(rvWin.getBoundingClientRect().bottom+8)+"px";
 else alWin.style.top=""}
/* 职能档案浮层（.nav-fn-panel 真结构） */
let fnPanel=null;
function openFnPanel(f,anchor){fnPanel?.remove();
 fnPanel=document.createElement("div");fnPanel.className="nav-fn-panel pz";
 const r=anchor.getBoundingClientRect();
 fnPanel.style.left=Math.min(r.right+10,innerWidth-380)+"px";
 fnPanel.style.top=Math.min(r.top,innerHeight-400)+"px";
 fnPanel.innerHTML=`<div class="nav-fn-ph"><span class="nav-fn-pname">${esc(f.t)}</span>
   <span class="nav-fn-pstate${f.duty==="archived"?" off":""}">${f.duty==="archived"?"已撤岗":"在岗"}</span></div>
  <div class="nav-fn-prow"><b>职能号</b><span>${f.id}</span></div>
  <div class="nav-fn-prow"><b>派驻</b><span>${byId[f.venue]?byId[f.venue].t:"—"}</span></div>
  <div class="nav-fn-prow col"><b>职责书</b><span>${esc(f.charter)}</span></div>
  ${f.talk.length?`<div class="nav-fn-talk">${f.talk.map(([k,x])=>
   `<div class="nav-fn-msg ${k}">${k==="u"?"<i>你</i>":"<i>职能</i>"}${esc(x)}</div>`).join("")}</div>`:""}`;
 document.body.appendChild(fnPanel);
 setTimeout(()=>document.addEventListener("mousedown",function h(e){
  if(!fnPanel.contains(e.target)){fnPanel.remove();fnPanel=null;
   document.removeEventListener("mousedown",h)}}),0)}

{const m=new Map();CARDS.forEach(c=>m.set(c.id,dep(c)*90));build(m)}
</script>
