<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>画布卡片原型 v5</title>
<style>
  :root{
    --bg:#12151c;
    --panel:#1a1e28;
    --panel-2:#161a22;
    --border:#2a3040;
    --fg:#e8eaf0;
    --dim:#9aa0b0;
    --c-work:#c8862e;       /* 根卡琥珀 */
    --c-work-dim:#7a5a22;   /* 关联族的深琥珀（消息卡左条/底色） */
    --radius:8px;
    --bar-w:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--fg);
    font:13px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;
    padding:40px; display:flex; gap:60px; align-items:flex-start;
  }
  .label{color:var(--dim); font-size:11px; letter-spacing:.12em; margin-bottom:14px;}

  /* ======== 卡片底座 ======== */
  .card{
    width:240px;                 /* 窄 */
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  /* 左边条：整卡一条竖线贯通 */
  .card .radius-holder{ display:flex; }
  .leftbar{ width:var(--bar-w); border-radius:var(--radius) 0 0 var(--radius); flex-shrink:0; }

  /* ======== 根卡 ======== */
  .root-card{ } 
  .root-card .leftbar{ background:var(--c-work); }
  .root-card-body{ flex:1; padding:14px 14px 14px 12px; display:flex; flex-direction:column; gap:12px; }

  .title{ font-size:19px; font-weight:700; text-align:center; letter-spacing:.02em; line-height:1.3; }

  /* 状况三行 */
  .status-head{ font-size:10px; color:var(--dim); letter-spacing:.18em; text-transform:uppercase; }
  .status-lines{ display:flex; flex-direction:column; gap:5px; }
  .status-line{ color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status-line::before{ content:"› "; color:var(--c-work); font-weight:700; }

  /* 右缘：树开关区（数字 + 符号） */
  .tree-toggle{
    width:40px; flex-shrink:0; cursor:pointer; user-select:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    border-left:1px solid var(--border);
    color:var(--dim); transition:color .15s, background .15s;
  }
  .tree-toggle:hover{ color:var(--fg); background:rgba(200,134,46,.06); }
  .tree-toggle .sym{ font-size:16px; line-height:1; }
  .tree-toggle .cnt{ font-size:11px; }
  .tree-toggle.open{ color:var(--c-work); }
  .tree-toggle.open .sym{ transform:rotate(90deg); }

  /* ======== 吸附的消息卡（独立完整卡） ======== */
  .msg-card{ width:240px; margin-top:12px; background:var(--panel-2); }
  .msg-card .leftbar{ background:var(--c-work-dim); }
  .msg-card-body{ flex:1; padding:10px 12px; display:flex; flex-direction:column; gap:9px; }

  .snap{
    cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:2px 0;
  }
  .snap-text{ color:var(--fg); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .snap-arrow{ color:var(--c-work); font-size:14px; flex-shrink:0; }

  .quick-input{
    display:flex; align-items:center; gap:6px;
    border:1px solid var(--border); border-radius:6px; background:var(--bg); padding:6px 8px;
  }
  .quick-input input{
    flex:1; background:transparent; border:none; outline:none; color:var(--fg); font-size:13px;
  }
  .quick-input input::placeholder{ color:var(--dim); }
  .quick-input .go{ color:var(--c-work); font-size:15px; cursor:pointer; line-height:1; }

  /* ======== 快捷回复窗（轻量浮层） ======== */
  .reply{
    width:260px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    margin-top:14px; overflow:hidden; display:flex; flex-direction:column;
  }
  .reply-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; border-bottom:1px solid var(--border);
  }
  .reply-head .t{ font-size:11px; letter-spacing:.12em; color:var(--dim); }
  .reply-head .x{ cursor:pointer; color:var(--dim); font-size:15px; line-height:1; }
  .reply-msgs{ padding:8px 10px; display:flex; flex-direction:column; gap:6px; max-height:110px; overflow-y:auto; }
  .reply-msg{ background:var(--panel-2); border-radius:6px; padding:5px 8px; font-size:12px; color:var(--fg); }
  .reply-in{ border-top:1px solid var(--border); padding:7px 10px; display:flex; gap:6px; align-items:center; }
  .reply-in input{ flex:1; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:5px 8px; color:var(--fg); outline:none; font-size:12px; }
  .reply-in .go{ color:var(--c-work); font-size:15px; cursor:pointer; line-height:1; }

  /* ======== 普通子卡（对照） ======== */
  .child-card{ }
  .child-card .leftbar{ background:#3d4470; }
  .child-card-body{ flex:1; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
  .child-title{ font-size:13px; font-weight:600; }
  .child-sum{ color:var(--dim); font-size:12px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .child-count{ align-self:flex-end; color:var(--dim); font-size:11px; display:flex; align-items:center; gap:3px; }
</style>
</head>
<body>

  <!-- ===== 根卡 + 吸附消息卡 ===== -->
  <div>
    <div class="label" style="margin-top:80px">根卡 ↓</div>
    <div class="card root-card">
      <div class="radius-holder">
        <div class="leftbar"></div>
        <div class="root-card-body">
          <div class="title">银河远征计划</div>
          <div>
            <div class="status-head">当前状况</div>
            <div class="status-lines" style="margin-top:6px">
              <div class="status-line">已完成资源侦察，燃料库存充足</div>
              <div class="status-line">第二批殖民模块建造中已完成 60%</div>
              <div class="status-line">航道规划待最终确认</div>
            </div>
          </div>
        </div>
        <div class="tree-toggle" onclick="this.classList.toggle('open')">
          <span class="sym">▸</span>
          <span class="cnt">3</span>
        </div>
      </div>
    </div>

    <!-- 独立消息卡，缝隙吸附 -->
    <div class="card msg-card">
      <div class="radius-holder">
        <div class="leftbar"></div>
        <div class="msg-card-body">
          <div class="snap" onclick="document.getElementById('reply').style.display='flex'">
            <span class="snap-text">第二批殖民模块三分之二完成，是否可以开始铺设航道标桩？</span>
            <span class="snap-arrow">↗</span>
          </div>
          <div class="quick-input">
            <input type="text" placeholder="" />
            <span class="go">➤</span>
          </div>
        </div>
      </div>
    </div>

    <div class="reply" id="reply" style="display:none">
      <div class="reply-head">
        <span class="t">快捷回复</span>
        <span class="x" onclick="document.getElementById('reply').style.display='none'">×</span>
      </div>
      <div class="reply-msgs">
        <div class="reply-msg">进展过半，模块装配按计划。</div>
        <div class="reply-msg">第二批模块三分之二完成，可以开始铺设航道标桩？</div>
      </div>
      <div class="reply-in">
        <input type="text" placeholder="" />
        <span class="go">➤</span>
      </div>
    </div>
  </div>

  <!-- ===== 普通子卡对照 ===== -->
  <div>
    <div class="label" style="margin-top:80px">普通子卡 ↓</div>
    <div class="card child-card">
      <div class="radius-holder">
        <div class="leftbar"></div>
        <div class="child-card-body">
          <div class="child-title">航道规划</div>
          <div class="child-sum">评估三条候选航道的引力弹弓效益、燃料窗口与殖民时序，选定主航道方案并提交复核。</div>
          <div class="child-count"><span style="font-size:12px">▸</span> 2</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
