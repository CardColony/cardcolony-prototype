<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardColony · 设置页 · 交互原型 v1</title>
<style>
/* ============================================================
   令牌：深/浅两套同名齐备
   --line 是对「控件内填充／所在面板」调的，不是对页面底色调的
   ============================================================ */
html[data-theme="dark"]{
  --bg:#0d1117;
  --bg-deep:#12181f;
  --panel:#151a21;
  --panel-2:#1b222b;
  --panel-3:#212a34;
  --line:#63758a;
  --line-soft:#26303a;
  --text:#e6edf3;
  --text-soft:#c3cfdb;
  --text-mute:#9fadbb;
  --accent:#4c9aff;
  --accent-ink:#061019;
  --sel:#212a34;
  --ok:#3fb950;
  --warn:#d29922;
  --err:#ff7b72;
  --focus:#7cc0ff;
  --skel:#64748b;
  --shadow:0 18px 48px rgba(0,0,0,.55);
}
html[data-theme="light"]{
  --bg:#f2f4f7;
  --bg-deep:#ffffff;
  --panel:#ffffff;
  --panel-2:#f6f8fa;
  --panel-3:#eef2f7;
  --line:#7b8794;
  --line-soft:#dbe2ea;
  --text:#10161d;
  --text-soft:#39424d;
  --text-mute:#4b5563;
  --accent:#0b5cad;
  --accent-ink:#ffffff;
  --sel:#e8eef7;
  --ok:#146c2e;
  --warn:#8a5a00;
  --err:#b3202a;
  --focus:#0b5cad;
  --skel:#7b8794;
  --shadow:0 18px 48px rgba(16,22,29,.18);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--text);
  font:13px/1.5 ui-sans-serif,-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
.mute{color:var(--text-mute)}
.grow{flex:1 1 auto}

/* ---------- 顶栏：标题 / 过滤 / 主题 / 说明 ---------- */
.topbar{
  flex:0 0 auto;height:46px;display:flex;align-items:center;gap:8px;
  padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center}
.dotmark{width:9px;height:9px;border-radius:2px;background:var(--accent);display:inline-block;margin-right:7px}
.sep,.crumb{color:var(--text-mute);font-size:12px}
.inp{
  height:28px;padding:0 8px;background:var(--bg-deep);color:var(--text);
  border:1px solid var(--line);border-radius:5px;min-width:0;
}
.inp::placeholder{color:var(--text-mute)}
.filter{width:180px}
.sel{height:28px}
.btn{
  min-height:30px;padding:0 10px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:5px;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--panel-3)}
.btn.sm{min-height:28px;padding:0 8px;font-size:12px}
.btn-pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-pri:hover{background:var(--accent)}
.btn-danger{border-color:var(--err);color:var(--err)}

/* ---------- 骨架：左分区列表 + 右单列 ---------- */
.shell{flex:1 1 auto;display:flex;min-height:0}
.navlist{
  width:206px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);
  padding:6px;overflow:auto;
}
.navrow{
  display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:0 8px;margin:1px 0;
  background:none;border:0;border-left:3px solid transparent;border-radius:5px;
  color:var(--text-soft);cursor:pointer;text-align:left;
}
.navrow:hover{background:var(--panel-2);color:var(--text)}
.navrow[aria-current="true"]{background:var(--sel);border-left-color:var(--accent);color:var(--accent);font-weight:650}
.navrow .nb{margin-left:auto;font-size:11px;color:var(--text-mute)}
.navfoot{margin:10px 8px 0;padding-top:8px;border-top:1px solid var(--line-soft);color:var(--text-mute);font-size:11px;line-height:1.55}

.content{flex:1 1 auto;min-width:0;overflow:auto;outline:none}
.crumb2{
  position:sticky;top:0;z-index:2;height:38px;display:flex;align-items:center;gap:7px;
  padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line-soft);
  color:var(--text-mute);font-size:12px;
}
.crumb2 b{color:var(--text);font-weight:600}
.list{padding:4px 0 48px}

/* ---------- 分组与行 ---------- */
.grp{margin-top:6px}
.grphd{
  display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:0 14px;
  background:none;border:0;cursor:pointer;color:var(--text-mute);
  font-size:11px;letter-spacing:.5px;text-align:left;
}
.grphd:hover{color:var(--text)}
.caret{display:inline-block;width:10px;transition:transform .12s ease}
.grphd[aria-expanded="false"] .caret{transform:rotate(-90deg)}
.gtag{margin-left:auto;font-size:11px;letter-spacing:0;color:var(--text-mute)}

/* 行线一律不画：pi 的列表靠名单与填充区分，不靠分隔线（1.4:1 的线既称不上边界又过不了 3:1） */
.row{
  display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:0 16px;
  background:none;border:0;color:var(--text);text-align:left;
}
button.row{cursor:pointer}
button.row:hover{background:var(--panel-2)}
.row.static{cursor:default}
.row.first{border-top:0}
.grpbody{padding:2px 0 6px}
.row.model{min-height:38px}
.rl{flex:0 0 168px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl.wide{flex:0 0 220px}
.rm{color:var(--text-mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv{margin-left:auto;color:var(--text-soft);font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.rc{color:var(--text-mute);font-size:13px;width:12px;text-align:center;flex:0 0 auto}
.bold{font-weight:600}

.badge{
  display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel-2);
  font-size:11px;color:var(--text-soft);white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--ok)}
.dot.err{background:var(--err)}
.dot.warn{background:var(--warn)}
.tag{
  font-size:11px;color:var(--text-mute);border:1px dashed var(--line);
  border-radius:4px;padding:0 5px;line-height:18px;white-space:nowrap;
}
.mini{height:26px;padding:0 6px;font-size:12px}
.sw{
  appearance:none;-webkit-appearance:none;width:40px;height:26px;border-radius:13px;
  background:var(--panel-3);border:1px solid var(--line);position:relative;cursor:pointer;margin:0;
}
.sw::after{
  content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:var(--text-mute);transition:transform .12s ease,background .12s ease;
}
.sw:checked{background:var(--sel);border-color:var(--accent)}
.sw:checked::after{transform:translateX(14px);background:var(--accent)}

/* ---------- 四态 ---------- */
.state{padding:22px 16px;max-width:720px}
.sk{height:12px;border-radius:3px;background:var(--skel);margin:10px 0}
.sk.w1{width:52%}
.sk.w2{width:74%}
.sk.w3{width:38%}
.st-title{font-size:14px;font-weight:650;margin:0 0 6px}
.st-note{color:var(--text-soft);font-size:12.5px;margin:0 0 6px;line-height:1.6}
.st-code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:var(--text-mute)}
.st-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ---------- 底部键位条 ---------- */
.keybar{
  flex:0 0 auto;min-height:34px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:4px 12px;background:var(--panel);border-top:1px solid var(--line);
  color:var(--text-mute);font-size:11.5px;
}
.keybar kbd{
  font:inherit;border:1px solid var(--line);border-radius:4px;padding:0 5px;
  background:var(--panel-2);color:var(--text-soft);
}
.keybar .right{margin-left:auto}

/* ---------- 抽屉（不遮主视野、不锁交互） ---------- */
.drawer{
  position:fixed;top:46px;right:0;bottom:0;width:min(600px,90vw);z-index:40;
  background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;
}
.drawer[hidden]{display:none}
.dhdr{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;flex:1 1 auto;flex-wrap:wrap}
.tab{
  min-height:28px;padding:0 10px;background:none;border:1px solid transparent;border-radius:5px;
  cursor:pointer;color:var(--text-mute);font-size:12px;
}
.tab[aria-selected="true"]{background:var(--panel-3);border-color:var(--line);color:var(--text)}
.dbody{overflow:auto;padding:14px 16px 44px;font-size:12.5px;line-height:1.62}
.dbody h3{font-size:13px;margin:18px 0 6px}
.dbody h3:first-child{margin-top:0}
.dbody p{margin:0 0 8px;color:var(--text-soft)}
.dbody ul{margin:0 0 10px;padding-left:18px;color:var(--text-soft)}
.dbody li{margin:2px 0}
.dbody code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;background:var(--panel-2);padding:0 4px;border-radius:3px}
table.t{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0 12px}
table.t th,table.t td{border:1px solid var(--line-soft);padding:3px 6px;text-align:left;vertical-align:top}
table.t th{background:var(--panel-2);color:var(--text-soft);font-weight:600}
table.t td{color:var(--text-soft)}
table.t td.n{text-align:right;font-family:ui-monospace,monospace}
.pass{color:var(--ok)}
.fail{color:var(--err)}

/* ---------- 输入型短层（可短暂接管，带可见取消） ---------- */
.dlgwrap{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);
}
.dlgwrap[hidden]{display:none}
.dlg{
  width:min(440px,92vw);background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);padding:16px;
}
.dlg h3{margin:0 0 6px;font-size:14px}
.dlg p{margin:0 0 10px;color:var(--text-soft);font-size:12.5px;line-height:1.6}
.dlg .field{display:flex;gap:8px;align-items:center;margin:8px 0}
.dlg .field label{flex:0 0 92px;color:var(--text-mute);font-size:12px}
.dlg .dfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:52px;z-index:70;
  background:var(--panel-3);border:1px solid var(--line);border-radius:6px;
  padding:6px 12px;font-size:12px;color:var(--text);max-width:70vw;
}
.toast[hidden]{display:none}

/* ---------- reduced-motion：降级不减少可点元素 ---------- */
.reduce-motion *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header class="topbar">
  <span class="brand"><i class="dotmark"></i>CardColony</span>
  <span class="sep">/</span>
  <span class="crumb" id="topCrumb">设置</span>
  <span class="grow"></span>
  <input id="filter" class="inp filter" placeholder="过滤当前列表" aria-label="过滤当前列表" autocomplete="off">
  <select id="stateSel" class="inp sel" aria-label="预览状态">
    <option value="normal">正常</option>
    <option value="loading">加载</option>
    <option value="empty">空</option>
    <option value="error">错误</option>
    <option value="denied">无权限</option>
  </select>
  <button class="btn sm" id="btnTheme" type="button">浅色</button>
  <button class="btn sm" id="btnNotes" type="button">设计说明</button>
  <button class="btn sm" id="btnSelf" type="button">自检</button>
</header>

<div class="shell">
  <nav class="navlist" id="navlist" aria-label="设置分区"></nav>
  <main class="content" id="content" tabindex="-1"></main>
</div>

<footer class="keybar" id="keybar"></footer>

<aside class="drawer" id="drawer" hidden aria-label="设计说明与自检">
  <div class="dhdr">
    <div class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-tab="notes" aria-selected="true">设计说明</button>
      <button class="tab" type="button" role="tab" data-tab="diff" aria-selected="false">改动对照</button>
      <button class="tab" type="button" role="tab" data-tab="self" aria-selected="false">自检读数</button>
    </div>
    <button class="btn sm" id="btnCloseDrawer" type="button">关闭</button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

<div class="dlgwrap" id="dlgHost" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";

/* ============================================================
   0. 运行期错误计数（自检用）
   ============================================================ */
var ERRCOUNT = 0;
window.addEventListener('error', function(){ ERRCOUNT++; });
window.addEventListener('unhandledrejection', function(){ ERRCOUNT++; });

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ============================================================
   1. 示意数据（形状照 pi：provider / model / 七类卡默认）
   ============================================================ */
var LEVELS = ['off','minimal','low','medium','high','xhigh','max'];

var DATA = {
  default: { model:'anthropic/claude-opus-4', level:'high' },

  providers: [
    { id:'anthropic', api:'anthropic', baseUrl:'', apiKeyVar:'ANTHROPIC_API_KEY',
      modelsUrl:'', note:'', cred:{ source:'auth.json', tail:'9f2c', updated:'2026-11-08' } },
    { id:'openai', api:'openai-responses', baseUrl:'', apiKeyVar:'OPENAI_API_KEY',
      modelsUrl:'', note:'', cred:{ source:'models.json apiKey', tail:'a71e', updated:'2026-11-06' } },
    { id:'openrouter', api:'openai-completions', baseUrl:'https://openrouter.ai/api/v1', apiKeyVar:'OPENROUTER_API_KEY',
      modelsUrl:'https://openrouter.ai/api/v1/models', note:'聚合网关', cred:{ source:'环境变量', tail:'—', updated:'—' } },
    { id:'local', api:'openai-completions', baseUrl:'http://127.0.0.1:11434/v1', apiKeyVar:'',
      modelsUrl:'', note:'本机 ollama', cred:null }
  ],

  models: [
    { provider:'anthropic', model:'claude-opus-4',        reasoning:true,  ctx:200000, max:32000, cost:[15,75],  temp:1,   level:'high' },
    { provider:'anthropic', model:'claude-sonnet-4-5',    reasoning:true,  ctx:200000, max:64000, cost:[3,15],   temp:1,   level:'medium' },
    { provider:'anthropic', model:'claude-haiku-4',       reasoning:false, ctx:200000, max:32000, cost:[1,5],    temp:0.7, level:'off' },
    { provider:'openai',    model:'gpt-5.1',              reasoning:true,  ctx:400000, max:128000,cost:[2.5,10], temp:1,   level:'medium' },
    { provider:'openai',    model:'gpt-5.1-mini',         reasoning:true,  ctx:400000, max:64000, cost:[0.4,1.6],temp:0.7, level:'low' },
    { provider:'openrouter',model:'deepseek/deepseek-v4', reasoning:true,  ctx:128000, max:32000, cost:[0.3,1.2],temp:0.9, level:'medium' },
    { provider:'local',     model:'qwen3-coder:30b',      reasoning:false, ctx:131072, max:16384, cost:[0,0],    temp:0.6, level:'off' }
  ],

  cardTypes: [
    { k:'master',   n:'master · 根卡',   scope:'all' },
    { k:'manager',  n:'manager',        scope:'manager' },
    { k:'unit',     n:'unit',           scope:'unit' },
    { k:'worker',   n:'worker',         scope:'worker' },
    { k:'ui',       n:'ui',             scope:'ui' },
    { k:'qa_card',  n:'qa_card',        scope:'functional.qa' },
    { k:'pm_card',  n:'pm_card',        scope:'functional.pm' }
  ],

  /* 按卡类型默认：未设则回落全局默认 */
  seeds: {
    master:{ model:'anthropic/claude-opus-4', level:'high' },
    manager:{ model:'', level:'' },
    unit:{ model:'', level:'' },
    worker:{ model:'openai/gpt-5.1-mini', level:'low' },
    ui:{ model:'', level:'' },
    qa_card:{ model:'', level:'' },
    pm_card:{ model:'', level:'' }
  },

  catalog: { builtin:'0.99.2', overlay:'pi.dev', updated:'2026-11-09 23:40', count:1284, offline:'命中（3 天前）' },

  rules: [
    { scope:'all',            chars:3120 },
    { scope:'manager',        chars:640  },
    { scope:'unit',           chars:520  },
    { scope:'worker',         chars:1180 },
    { scope:'ui',             chars:1640 },
    { scope:'functional.qa',  chars:920  },
    { scope:'functional.pm',  chars:780  }
  ],

  archives: [
    { id:'card_301', title:'老设置页逐区清单', at:'2026-10-28', reason:'已并入 card_310' },
    { id:'card_279', title:'密钥轮换流程',     at:'2026-10-21', reason:'被 card_310 取代' },
    { id:'card_244', title:'模型目录刷新器',   at:'2026-10-12', reason:'实现迁入主进程' },
    { id:'card_198', title:'备份策略草案',     at:'2026-10-02', reason:'并入备份区' },
    { id:'card_155', title:'供应商连通性探针', at:'2026-09-19', reason:'实验作废' }
  ],

  backups: [
    { name:'settings-2026-11-09.json', at:'2026-11-09 22:10', size:'18.4 KB', auto:true },
    { name:'settings-2026-11-08.json', at:'2026-11-08 21:40', size:'17.9 KB', auto:true },
    { name:'before-proxy-migration',   at:'2026-11-05 10:02', size:'16.2 KB', auto:false },
    { name:'settings-2026-11-01.json', at:'2026-11-01 20:15', size:'15.8 KB', auto:true }
  ]
};

var SECTIONS = [
  { k:'models',  n:'模型',       nb:'4 供应商' },
  { k:'rules',   n:'项目规则',   nb:'7 分区' },
  { k:'archive', n:'归档与留痕', nb:'' },
  { k:'backups', n:'备份与还原', nb:'自动' }
];

/* ============================================================
   2. 视图状态
   ============================================================ */
var UI = {
  section:'models',
  page:'models',          /* models | provider | defaults | picker | rules | archive | backups */
  arg:null,               /* provider id / 种子类型 */
  filter:'',
  state:'normal',         /* normal | loading | empty | error | denied */
  collapsed:{}
};

/* ============================================================
   3. 行 / 组 的构件
   ============================================================ */
function group(key, title, tag, body){
  var open = !UI.collapsed[key];
  return '<div class="grp">'+
    '<button class="grphd" type="button" data-act="toggle" data-grp="'+key+'" aria-expanded="'+(open?'true':'false')+'">'+
      '<span class="caret" aria-hidden="true">▾</span><span>'+esc(title)+'</span>'+
      (tag?'<span class="gtag">'+esc(tag)+'</span>':'')+
    '</button>'+
    (open?'<div class="grpbody">'+body+'</div>':'')+
  '</div>';
}

function rowGo(page, arg, label, meta, value, cls){
  return '<button class="row '+(cls||'')+'" type="button" data-act="go" data-page="'+esc(page)+'" data-arg="'+esc(arg||'')+'">'+
    '<span class="rl">'+esc(label)+'</span>'+
    (meta?'<span class="rm">'+esc(meta)+'</span>':'')+
    '<span class="rv">'+esc(value||'')+'</span>'+
    '<span class="rc" aria-hidden="true">›</span>'+
  '</button>';
}

function rowStatic(label, meta, valueHtml, cls){
  return '<div class="row static '+(cls||'')+'">'+
    '<span class="rl">'+esc(label)+'</span>'+
    (meta?'<span class="rm">'+esc(meta)+'</span>':'')+
    '<span class="rv">'+(valueHtml||'')+'</span>'+
  '</div>';
}

function badgeCred(ok){
  return ok
    ? '<span class="badge"><i class="dot ok" aria-hidden="true"></i>凭证 ✓</span>'
    : '<span class="badge"><i class="dot err" aria-hidden="true"></i>未解析</span>';
}

function fmtK(n){ return n>=1000 ? Math.round(n/1000)+'K' : String(n); }

/* ============================================================
   4. 各页面渲染
   ============================================================ */
function credOk(p){ return !!(p.cred && p.cred.source && p.cred.source!=='环境变量'); }
function modelsOf(pid){ return DATA.models.filter(function(m){ return m.provider===pid; }); }
function providerOf(pid){ for(var i=0;i<DATA.providers.length;i++) if(DATA.providers[i].id===pid) return DATA.providers[i]; return null; }

function buildModels(){
  var h = '';
  var d = DATA.default;

  h += group('g-default','默认','', 
    rowGo('picker','__default__','默认模型', d.model, levelLabel(d.level)) +

function buildPicker(target){
  var isLevel = (target === '__level__');
  var h = '<button class="row first" type="button" data-act="go" data-page="'+(target==='__default__'||isLevel?'models':'defaults')+'">'+
    '<span class="rl">‹ 返回</span><span class="rm">'+(isLevel?'思考等级':'选择模型')+'</span><span class="rv"></span></button>';

  if(isLevel){
    var body = LEVELS.map(function(l){
      var cur = DATA.default.level === l;
      return '<button class="row" type="button" data-act="pickLevel" data-arg="'+l+'">'+
        '<span class="rl mono">'+l+'</span>'+
        '<span class="rm">'+(l==='off'?'不思考':'预算随模型能力收敛')+'</span>'+
        '<span class="rv">'+(cur?'当前':'')+'</span><span class="rc" aria-hidden="true">'+(cur?'●':'›')+'</span></button>';
    }).join('');
    return h + group('k-level','思考等级（pi: off … max）','', body);
  }

  var f = UI.filter.toLowerCase();
  var list = DATA.models.filter(function(m){
    if(!f) return true;
    return (m.provider+'/'+m.model).toLowerCase().indexOf(f) >= 0;
  });
  var rows = list.map(function(m){
    var ok = credOk(providerOf(m.provider)||{});
    return '<button class="row" type="button" data-act="pickModel" data-arg="'+esc(m.provider+'/'+m.model)+'" data-target="'+esc(target)+'">'+
      '<span class="rl wide mono">'+esc(m.model)+'</span>'+
      '<span class="rm">'+esc(m.provider)+' · ctx '+fmtK(m.ctx)+'</span>'+
      '<span class="rv">'+badgeCred(ok)+'</span>'+
      '<span class="rc" aria-hidden="true">›</span></button>';
  }).join('');
  if(!rows) rows = rowStatic('没有匹配的模型', '未配置凭证的供应商不列在这里（pi: /model 只列凭证可用）','');
  return h + group('k-models','模型 '+list.length+' / '+DATA.models.length,'', rows);
}

   5. 渲染装配
   ============================================================ */
function crumbFor(){
  var map = { models:'模型', rules:'项目规则', archive:'归档与留痕', backups:'备份与还原' };
  var h = '<span>设置</span><span aria-hidden="true">/</span><b>'+esc(map[UI.section]||'')+'</b>';
  if(UI.page === 'provider'){ h += '<span aria-hidden="true">/</span><span>供应商</span><span aria-hidden="true">/</span><b>'+esc(UI.arg)+'</b>'; }
  if(UI.page === 'defaults'){ h += '<span aria-hidden="true">/</span><b>按卡类型默认</b>'; }
  if(UI.page === 'picker'){ h += '<span aria-hidden="true">/</span><b>选择模型</b>'; }
  return h;
}

function renderNav(){
  var h = SECTIONS.map(function(s){
    var cur = UI.section === s.k;
    return '<button class="navrow" type="button" data-act="section" data-arg="'+s.k+'" aria-current="'+(cur?'true':'false')+'">'+
      '<span>'+esc(s.n)+'</span>'+(s.nb?'<span class="nb">'+esc(s.nb)+'</span>':'')+'</button>';
  }).join('');
  $('#navlist').innerHTML = h;
}

function renderContent(){
  var box = $('#content');
  var crumb = '<div class="crumb2">'+crumbFor()+'</div>';

  if(UI.state !== 'normal'){
    var sv = UI.state==='loading'?stateLoading():UI.state==='empty'?stateEmpty():UI.state==='error'?stateError():stateDenied();
    box.innerHTML = crumb + '<div class="list">'+sv+'</div>';
    return;
  }

  var body = '';
  if(UI.section === 'models'){
    if(UI.page === 'provider') body = buildProvider(UI.arg);
    else if(UI.page === 'defaults') body = buildDefaults();
    else if(UI.page === 'picker') body = buildPicker(UI.arg);
    else body = buildModels();
  } else if(UI.section === 'rules'){
    body = buildRules();
  } else if(UI.section === 'archive'){
    body = buildArchive();
  } else {
    body = buildBackups();
  }
  box.innerHTML = crumb + '<div class="list">'+body+'</div>';
}

function renderKeybar(){
  var kb = $('#keybar');
  var left = '';
  if(UI.state !== 'normal'){
    left = '<span>本视图为状态演示</span><span><kbd>Esc</kbd> 回到正常视图</span>';
  } else if(UI.page === 'picker'){
    left = '<span>单击行＝选中并设为默认</span><span><kbd>↑↓</kbd> 移动</span><span><kbd>Enter</kbd> 选</span><span><kbd>Ctrl+S</kbd> 存默认</span><span><kbd>Esc</kbd> 返回</span>';
  } else if(UI.page === 'provider' || UI.page === 'defaults'){
    left = '<span>单击行进入</span><span><kbd>Esc</kbd> 返回上一级</span>';
  } else {
    left = '<span>单击行进入</span><span>组标题可开合</span><span><kbd>/</kbd> 过滤</span>';
  }
  kb.innerHTML = left + '<span class="right">只读示意：本页不写盘、不联网</span>';
}

function renderAll(){
  renderNav();
  renderContent();
  renderKeybar();
  $('#topCrumb').textContent = '设置';
  $('#stateSel').value = UI.state;
}

/* ============================================================
   6. 交互
   ============================================================ */
function toast(msg){
  var t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.hidden = true; }, 2600);
}

function goSection(k){
  UI.section = k; UI.page = k; UI.arg = null; UI.filter = '';
  $('#filter').value = '';
  renderAll();
}

document.addEventListener('click', function(ev){
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if(!el) return;
  var act = el.getAttribute('data-act');

  if(act === 'section'){ goSection(el.getAttribute('data-arg')); return; }

  if(act === 'toggle'){
    var g = el.getAttribute('data-grp');
    UI.collapsed[g] = !UI.collapsed[g];
    renderContent();
    return;
  }

  if(act === 'go'){
    var p = el.getAttribute('data-page'), a = el.getAttribute('data-arg');
    UI.page = p; UI.arg = a || null; UI.filter=''; $('#filter').value='';
    renderAll();
    return;
  }

  if(act === 'pickModel'){
    var val = el.getAttribute('data-arg'), tgt = el.getAttribute('data-target');
    if(tgt === '__default__'){ DATA.default.model = val; }
    else { if(!DATA.seeds[tgt]) DATA.seeds[tgt] = {}; DATA.seeds[tgt].model = val; }
    toast('已设为 ' + val + '（示意·不写盘）');
    UI.page = (tgt === '__default__') ? 'models' : 'defaults';
    UI.arg = null;
    renderAll();
    return;
  }

  if(act === 'pickLevel'){
    DATA.default.level = el.getAttribute('data-arg');
    toast('默认思考等级 = ' + DATA.default.level + '（示意·不写盘）');
    UI.page = 'models'; renderAll();
    return;
  }

  if(act === 'addProvider'){ addProviderDialog(); return; }

  if(act === 'setKey'){
    var pid = el.getAttribute('data-arg');
    keyDialog(pid);
    return;
  }

  if(act === 'clearKey'){
    var pid2 = el.getAttribute('data-arg');
    var p2 = providerOf(pid2);
    dlgConfirm('清除凭据？', '这会移除 ' + pid2 + ' 的 auth.json 记录。同名 models.json apiKey 若存在会重新生效。', '清除', function(){
      if(p2) p2.cred = null;
      toast('凭据已清除（示意·不写盘）');
      renderAll();
    });
    return;
  }

  if(act === 'delProvider'){
    var pid3 = el.getAttribute('data-arg');
    dlgConfirm('删除供应商 ' + pid3 + '？', '其模型会一并移除；auth.json 中的密钥保留。', '删除', function(){
      DATA.providers = DATA.providers.filter(function(x){ return x.id !== pid3; });
      DATA.models = DATA.models.filter(function(m){ return m.provider !== pid3; });
      toast('已删除（示意·不写盘）');
      UI.page = 'models'; renderAll();
    });
    return;
  }

  if(act === 'saveProvider'){ toast('已保存到本页内存（示意·不写盘）'); return; }
  if(act === 'testConn'){ toast('测试连接需要后端（示意·未联网）'); return; }
  if(act === 'fetchModels'){ toast('拉取模型列表需要后端（示意·未联网）'); return; }
  if(act === 'refreshCatalog'){ toast('刷新目录需要联网（示意·未联网）'); return; }
  if(act === 'newBackup'){ toast('已新建快照（示意·不写盘）'); return; }

  if(act === 'restoreBackup'){
    var i = parseInt(el.getAttribute('data-arg'),10);
    dlgConfirm('还原到 ' + DATA.backups[i].name + '？', '当前设置会先被自动备份，再整体替换。', '还原', function(){
      toast('已还原（示意·不写盘）');
    });
    return;
  }

  if(act === 'restoreArchive'){
    var id = el.getAttribute('data-arg');
    dlgConfirm('回档 ' + id + '？', '归档卡会恢复为活卡，原位置关系按归档前重建。', '回档', function(){
      toast('已回档 ' + id + '（示意·不写盘）');
    });
    return;
  }

  if(act === 'ruleHint'){ toast('规则编辑在画布右缘「规则卡」，设置页只读（示意）'); return; }

  if(act === 'state'){
    UI.state = el.getAttribute('data-arg');
    renderAll();
    return;
  }

  if(act === 'diag'){ toast('诊断：catalog 服务 12:04:31 起 502，连续 3 次（示意）'); return; }

  if(act === 'requestAccess'){

/* ============================================================
   7. 自检引擎（页内现算）
   ============================================================ */
function parseColor(s){
  s = String(s||'').trim();
  var m = s.match(/^rgba?\(([^)]+)\)$/);
  if(m){
    var p = m[1].split(',').map(function(x){ return parseFloat(x); });
    return { r:p[0], g:p[1], b:p[2], a: p.length>3 ? p[3] : 1 };
  }
  var h = s.match(/^#([0-9a-f]{6})$/i);
  if(h){
    return { r:parseInt(h[1].slice(0,2),16), g:parseInt(h[1].slice(2,4),16), b:parseInt(h[1].slice(4,6),16), a:1 };
  }
  return null;
}
function srgb(v){ v = v/255; return v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
function lum(c){ return 0.2126*srgb(c.r) + 0.7152*srgb(c.g) + 0.0722*srgb(c.b); }
function ratioA(a, b){
  var L1 = lum(a), L2 = lum(b);
  var hi = Math.max(L1,L2), lo = Math.min(L1,L2);
  return (hi + 0.05) / (lo + 0.05);
}
function blend(fg, bg){
  if(!fg) return bg;
  var a = fg.a == null ? 1 : fg.a;
  if(a >= 1) return fg;
  return { r: fg.r*a + bg.r*(1-a), g: fg.g*a + bg.g*(1-a), b: fg.b*a + bg.b*(1-a), a:1 };
}
function effBg(el){
  var cur = el, guard = 0;
  while(cur && guard++ < 40){
    var c = parseColor(getComputedStyle(cur).backgroundColor);
    if(c && c.a > 0 && cur !== document.documentElement){
      return blend(c, parseColor(getComputedStyle(document.body).backgroundColor) || {r:0,g:0,b:0,a:1});
    }
    cur = cur.parentElement;
  }
  return parseColor(getComputedStyle(document.body).backgroundColor);
}
function token(name){
  return parseColor(getComputedStyle(document.documentElement).getPropertyValue(name).trim());
}
function cs(el, prop){ return getComputedStyle(el)[prop]; }
function isVisible(el){
  var st = getComputedStyle(el);
  if(st.display === 'none' || st.visibility === 'hidden') return false;
  var r = el.getBoundingClientRect();
  return r.width > 0 && r.height > 0;
}

function checkText(){
  var sels = ['.topbar *', '.navlist *', '.content *', '.keybar *', '.drawer *'];
  var seen = [], min = 99, n = 0, fails = [];
  sels.forEach(function(sel){
    document.querySelectorAll(sel).forEach(function(el){
      if(el.closest('[aria-hidden="true"]')) return;
      if(!isVisible(el)) return;
      var txt = '';
      for(var i=0;i<el.childNodes.length;i++){
        if(el.childNodes[i].nodeType === 3) txt += el.childNodes[i].nodeValue;
      }
      if(!txt.trim()) return;
      var fg = parseColor(cs(el,'color'));
      var bg = effBg(el);
      if(!fg || !bg) return;
      var r = ratioA(fg, bg);
      n++;
      if(r < min) min = r;
      if(r < 4.5) fails.push({ t: txt.trim().slice(0,26), r:r, cls: el.className });
    });
  });
  return { n:n, min:min, fails:fails };
}

function checkNonText(){
  var pairs = [];
  function add(name, fg, bg, deco){
    if(!fg || !bg) return;
    pairs.push({ name:name, r: ratioA(fg,bg), deco: !!deco });
  }
  var inp = $('.inp');
  var btn = $('.btn');
  var nav = $('.navlist');
  var cur = $('.navrow[aria-current="true"]');
  var row = $('.row');
  var rc = $('.row .rc');
  var okdot = $('.dot.ok');
  var errdot = $('.dot.err');
  var badge = $('.badge');
  var tag = $('.tag');
  var pri = $('.btn-pri');
  var content = $('.content');

  if(inp) add('输入框边框 / 框内填充', parseColor(cs(inp,'borderTopColor')), effBg(inp));
  if(btn) add('按钮边框 / 按钮填充', parseColor(cs(btn,'borderTopColor')), effBg(btn));
  if(pri && content) add('主按钮填充 / 内容底', parseColor(cs(pri,'backgroundColor')), effBg(content));
  if(nav) add('导航右边框 / 导航填充', parseColor(cs(nav,'borderRightColor')), effBg(nav));
  if(cur) add('当前分区左条 / 选中行填充', parseColor(cs(cur,'borderLeftColor')), effBg(cur));
  if(rc && row) add('下钻箭头 / 行填充', parseColor(cs(rc,'color')), effBg(row));
  if(okdot) add('凭证 ✓ 点 / 相邻行填充', parseColor(cs(okdot,'backgroundColor')), effBg(okdot.parentElement));
  if(errdot) add('未解析 ✗ 点 / 相邻行填充', parseColor(cs(errdot,'backgroundColor')), effBg(errdot.parentElement));
  if(badge) add('徽标边框 / 徽标填充', parseColor(cs(badge,'borderTopColor')), effBg(badge));
  if(tag) add('标签虚线框 / 面板填充', parseColor(cs(tag,'borderTopColor')), token('--panel'));
  add('焦点环 / 面板填充', token('--focus'), token('--panel'));
  add('骨架条 / 面板填充', token('--skel'), token('--panel'));
  if(row) add('行内箭头列 / 面板填充', parseColor(cs(rc,'color')), token('--panel'));
  var top = $('.topbar');
  if(top) add('顶栏分隔线 / 顶栏填充', parseColor(cs(top,'borderBottomColor')), effBg(top));

  var counted = pairs.filter(function(p){ return !p.deco; });
  var min = 99, fails = [];
  counted.forEach(function(p){ if(p.r < min) min = p.r; if(p.r < 3) fails.push(p.name); });
  return { pairs:pairs, counted:counted, min:min, fails:fails };
}

function clickables(){
  var sel = 'button, a[href], input, select, textarea, [role="button"]';
  return Array.prototype.slice.call(document.querySelectorAll(sel));
}

function checkHit(){
  var els = clickables();
  var n = 0, min = 999, bad = [];
  els.forEach(function(el){
    if(!isVisible(el)) return;
    var r = el.getBoundingClientRect();
    n++;
    var m = Math.min(r.width, r.height);
    if(m < min) min = m;
    if(m < 24) bad.push({ tag: el.tagName.toLowerCase(), cls: String(el.className).slice(0,24), m: Math.round(m*10)/10 });
  });
  return { n:n, min: min === 999 ? 0 : Math.round(min*10)/10, bad:bad };
}

function checkRm(){
  var a = clickables().filter(isVisible).length;
  document.documentElement.classList.add('reduce-motion');
  var b = clickables().filter(isVisible).length;
  document.documentElement.classList.remove('reduce-motion');
  return { a:a, b:b };
}

function checkExt(){
  var html = document.documentElement.outerHTML;
  var needles = [ 's'+'rc=', '<'+'link', '@'+'import', 'url('+'http', 'href="'+'http' ];
  var hits = [];
  needles.forEach(function(nd){
    var i = html.indexOf(nd);
    if(i >= 0) hits.push(nd + ' @' + i);
  });
  return { hits:hits };
}

function measure(){
  var t = checkText();
  var nt = checkNonText();
  var hit = checkHit();
  var rm = checkRm();
  var ext = checkExt();
  return { text:t, non:nt, hit:hit, rm:rm, ext:ext, err:ERRCOUNT, theme: document.documentElement.getAttribute('data-theme') };
}

function recalcBoth(){
  var out = {};
  var html = document.documentElement;
  var cur = html.getAttribute('data-theme');
  out[cur] = measure();
  var other = cur === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', other);
  out[other] = measure();
  html.setAttribute('data-theme', cur);
  return out;
}

  '</ul>';
}

function selfHtml(){
  return ''+
  '<h3>自检读数</h3>'+
  '<p>下面全部在图内现算：切一遍两套主题各测一次，再切回当前主题。</p>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px">'+
    '<button class="btn sm btn-pri" type="button" id="runSelf">现算一遍</button>'+
    '<button class="btn sm" type="button" id="toggleRm">切 reduced-motion</button>'+
  '</div>'+
  '<div id="selfOut"><p class="mute">点「现算一遍」。读数按当前页面的真实 DOM 量，不是写死的数字。</p></div>';
}

function bindSelf(){
  var run = document.getElementById('runSelf');
  if(run) run.addEventListener('click', function(){
    var out = document.getElementById('selfOut');
    out.innerHTML = '<p class="mute">测量中…</p>';
    setTimeout(function(){
      var m = recalcBoth();
      function block(theme){
        var d = m[theme];
        var t = d.text, nt = d.non, hit = d.hit, rm = d.rm, ext = d.ext;
        var s = '<h3>'+(theme==='dark'?'深色':'浅色')+'主题</h3>';
        s += '<table class="t"><tr><th>项</th><th>读数</th><th>判定</th></tr>';
        s += '<tr><td>文字对比度</td><td class="n">'+t.n+' 节点 / 最小 '+t.min.toFixed(2)+':1</td><td class="'+(t.fails.length?'fail':'pass')+'">'+(t.fails.length? t.fails.length+' 处 <4.5' : '0 不合格')+'</td></tr>';
        s += '<tr><td>非文本对比度</td><td class="n">'+nt.counted.length+' 对 / 最小 '+nt.min.toFixed(2)+':1</td><td class="'+(nt.fails.length?'fail':'pass')+'">'+(nt.fails.length? nt.fails.join('、') : '0 不合格（另 '+ (nt.pairs.length-nt.counted.length) +' 对装饰线豁免）')+'</td></tr>';
        s += '<tr><td>命中区</td><td class="n">'+hit.n+' 个可点 / 最小 '+hit.min+'px</td><td class="'+(hit.bad.length?'fail':'pass')+'">'+(hit.bad.length? '有 '+hit.bad.length+' 个 <24px' : '<24px 清单为空')+'</td></tr>';
        s += '<tr><td>reduced-motion</td><td class="n">'+rm.a+' → '+rm.b+'</td><td class="'+(rm.a===rm.b?'pass':'fail')+'">'+(rm.a===rm.b?'可点元素不减少':'功能缺失')+'</td></tr>';
        s += '<tr><td>外部链接检索</td><td class="n">外链特征串 / 五项</td><td class="'+(ext.hits.length?'fail':'pass')+'">'+(ext.hits.length? ext.hits.join('、') : '0 命中')+'</td></tr>';
        s += '<tr><td>脚本错误</td><td class="n">'+d.err+'</td><td class="'+(d.err?'fail':'pass')+'">'+(d.err?'有错误':'0 条')+'</td></tr>';
        s += '</table>';

        s += '<table class="t"><tr><th>非文本对（对真实相邻填充）</th><th>比值</th><th>判定</th></tr>';
        nt.pairs.forEach(function(p){
          s += '<tr><td>'+esc(p.name)+'</td><td class="n">'+p.r.toFixed(2)+':1</td><td class="'+(p.deco?'':(p.r>=3?'pass':'fail'))+'">'+(p.deco?'装饰·豁免':(p.r>=3?'过':'不足'))+'</td></tr>';
        });
        s += '</table>';

        if(t.fails.length){
          s += '<p class="fail">文字不合格：'+t.fails.map(function(f){ return esc(f.t)+' '+f.r.toFixed(2); }).join('；')+'</p>';
        }
        if(hit.bad.length){
          s += '<p class="fail">命中区不足：'+hit.bad.map(function(b){ return b.tag+'.'+b.cls+' '+b.m+'px'; }).join('；')+'</p>';
        }
        return s;
      }
      out.innerHTML = block('dark') + block('light') +
        '<h3>测量口径</h3><ul>'+
        '<li>文字：逐元素取其直接文本节点的 <code>color</code>，背景取最近的实色祖先填充（<code>effBg</code>），算 WCAG 比值。</li>'+
        '<li>非文本：按对给定前景/背景，<b>背景取该控件自身的填充或其所在面板</b>，不是页面底色（圆点这类自身即填充的，取相邻行填充）。本版已取消行间分隔线，所以没有「装饰线豁免」的项。</li>'+
        '<li>命中区：<code>button / a / input / select / [role=button]</code> 的 <code>min(width,height)</code>，只算可见元素。</li>'+
        '<li>reduced-motion：加 <code>.reduce-motion</code> 前后数可点元素个数。</li>'+
        '</ul>';
    }, 30);
  });

  var rm = document.getElementById('toggleRm');
  if(rm) rm.addEventListener('click', function(){
    var on = document.documentElement.classList.toggle('reduce-motion');
    toast('reduced-motion ' + (on?'开':'关') + '（可点元素数不变）');
  });
}
