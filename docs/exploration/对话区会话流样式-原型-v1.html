<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对话区会话流 · 样式原型 v1</title>
<style>
  /* ===== 借鉴左侧边栏定稿的配色体系（左侧边栏原型-v1.html 同源） ===== */
  :root{
    --bg:#eef0f4;          /* 画布底色 */
    --card:#ffffff;
    --card-line:#e6e9ee;
    --line:#dfe3ea;
    --border:#e2e5ea;
    --row-hover:#f3f5f8;
    --row-active:#eaf2fe;
    --bar-active:#2563eb;
    --text:#2b2f36;
    --text-warm:#20242a;
    --text-cold:#a7adb6;
    --icon-folder:#5b8def;
    --icon-doc:#8a929e;
    --run:#12a264;
    --user-bubble:#eaf2fe;      /* 用户气泡＝左侧边栏 active 同款浅蓝 */
    --user-border:#d9e6fb;
    --code-bg:#f0f2f5;
    --pre-bg:#f6f7f9;
    --th-bg:#f7f8fa;
    --quote-bar:#b9cdf5;
    --danger:#c2453d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;color:var(--text);background:#fff;
  }

  /* ===== 左上角：新旧版对比开关 ===== */
  .toggle{
    position:fixed;top:14px;left:336px;z-index:99;
    font-size:12.5px;color:#3b424c;background:#fff;
    border:1px solid var(--border);border-radius:7px;
    padding:6px 14px;cursor:pointer;
    box-shadow:0 1px 3px rgba(16,24,40,.08);
    transition:background .15s,border-color .15s;
  }
  .toggle:hover{background:var(--row-hover);border-color:#c9cfd8}

  /* ===== 左侧边栏（原型复刻，静态展示用） ===== */
  .sidebar{
    width:320px;min-width:320px;height:100vh;flex:none;
    background:var(--bg);border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .sb-title{padding:14px 14px 6px;font-size:13px;font-weight:600;color:var(--text-warm)}
  .sb-sub{padding:0 14px 10px;font-size:11.5px;color:var(--text-cold)}
  .sb-tree{flex:1;overflow-y:auto;padding:4px 10px 16px}
  .sb-tree::-webkit-scrollbar{width:8px}
  .sb-tree::-webkit-scrollbar-track{background:transparent}
  .sb-tree::-webkit-scrollbar-thumb{background:#d3d8e0;border-radius:4px}
  .wrap.card{
    background:var(--card);border:1px solid var(--card-line);
    border-radius:10px;margin-top:8px;padding:3px 5px 5px;
    box-shadow:0 1px 2px rgba(16,24,40,.05);
  }
  .row{
    display:flex;align-items:center;height:30px;border-radius:7px;
    padding-left:12px;font-size:13px;color:var(--text-warm);user-select:none;
  }
  .row.project{height:36px;font-weight:600;font-size:13.5px}
  .row:hover{background:var(--row-hover)}
  .row.active{background:var(--row-active);color:#1e52c4;font-weight:600}
  .row .ico{width:18px;flex:none;margin-right:7px;display:flex}
  .row .ico svg{width:14px;height:14px}
  .row .label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .time{font-size:11px;color:var(--text-cold);flex:none;white-space:nowrap}
  .row.c2{padding-left:30px}
  .row.c3{padding-left:48px}
  .row.c4{padding-left:66px}

  /* ===== 右侧：对话区（本次原型的主角） ===== */
  .stage{flex:1;height:100vh;overflow-y:auto;background:var(--bg);padding:24px 0}
  .stage::-webkit-scrollbar{width:10px}
  .stage::-webkit-scrollbar-track{background:transparent}
  .stage::-webkit-scrollbar-thumb{background:#d3d8e0;border-radius:5px}

  /* ===== 整个对话流＝一张大卡片（用户 21:32 裁定）=====
     白底、1px 描边、圆角、轻阴影——通用 agent 样式：卡内消息直接排开 */
  .chat{
    max-width:1100px;margin:0 auto;
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:14px;
    box-shadow:0 1px 4px rgba(16,24,40,.07);
    padding:28px 36px 64px;
    display:flex;flex-direction:column;align-items:stretch;
  }

  /* ===== 统一内容列（用户 21:39 裁定：我的发言不超出模型消息的边界） =====
     所有消息共享同一列宽：user 靠右、assistant 靠左，但都在列内、
     右边缘对齐——我的气泡永远收在模型消息的边界内 */
  .msgs{
    width:100%;max-width:min(70%, 48em);
    margin:0 auto;
    display:flex;flex-direction:column;
  }
  .chat-head{margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .chat-head h2{font-size:19px;color:var(--text-warm);margin-bottom:6px}
  .chat-head .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{
    display:inline-block;font-size:11px;color:#6b7280;
    background:#f0f2f5;border-radius:4px;padding:2px 8px;
  }
  .tag.blue{color:#1e52c4;background:var(--row-active)}

  /* ===== 过程行（step-row）：次要信息，独立灰字 ===== */
  .step-row{
    align-self:flex-start;display:flex;align-items:center;gap:7px;
    font-size:12px;color:var(--text-cold);
    padding:4px 0;line-height:1.4;
  }
  .step-row .sdot{width:5px;height:5px;border-radius:50%;background:#c2c8d2;flex:none}
  .step-row .sdot.run{background:var(--run)}
  .step-row .sdot.done{background:var(--icon-folder)}

  /* ===== 消息基线 ===== */
  .msg{
    max-width:100%;   /* 列宽由 .msgs 统一约束（min(70%, 48em)）——用户 21:39 */
    margin:2px 0;
  }

  /* ===== 助手消息＝文档流：无边框、无底色、直接排开（规格 13.3 双形态） ===== */
  .msg.assistant{
    align-self:flex-start;
    background:transparent;border:none;
    font-size:14px;line-height:1.75;color:var(--text-warm);
    white-space:normal;
    padding:8px 0 22px;
  }
  .msg.assistant .meta{
    display:flex;align-items:center;gap:8px;
    margin-bottom:6px;user-select:none;
  }
  .badge{
    font-size:12px;color:#6b7280;background:#f0f2f5;
    border-radius:4px;padding:2px 8px;
  }
  .time{font-size:11px;color:var(--text-cold)}
  .demo-tag{
    font-size:11px;color:var(--danger);background:#fdf0ef;
    border-radius:4px;padding:2px 7px;
  }

  /* ===== Markdown 渲染元素（规格 U-1 字号 ∈ {11,12,13,14,18,36}px） ===== */
  .md h1{font-size:18px;font-weight:600;margin:18px 0 8px;line-height:1.4}
  .md h2{font-size:18px;font-weight:600;margin:16px 0 8px;line-height:1.4}
  .md h3,.md h4,.md h5,.md h6{font-size:14px;font-weight:600;margin:14px 0 6px}
  .md p{margin:6px 0}
  .md strong{font-weight:600}
  .md em{font-style:italic}
  .md ul,.md ol{padding-left:1.5em;margin:6px 0}
  .md li{margin:2px 0}
  .md code{
    font-family:ui-monospace,SFMono-Regular,"Cascadia Code",Consolas,monospace;
    font-size:12px;background:var(--code-bg);border-radius:4px;padding:1px 5px;
  }
  .md pre{
    background:var(--pre-bg);border:1px solid var(--card-line);
    border-radius:8px;padding:10px 12px;overflow-x:auto;margin:8px 0;
  }
  .md pre code{background:transparent;padding:0;font-size:12px;line-height:1.6}
  .md table{border-collapse:collapse;margin:8px 0;font-size:12px;width:100%}
  .md th,.md td{border:1px solid var(--line);padding:4px 10px;text-align:left}
  .md th{background:var(--th-bg);font-weight:600}
  .md blockquote{
    border-left:3px solid var(--quote-bar);margin:8px 0;padding:2px 14px;color:#6b7280;
  }
  .md blockquote p{margin:4px 0}
  .md hr{border:none;border-top:1px solid var(--line);margin:14px 0}

  /* ===== 我的消息＝右侧气泡（规格 13.3 双形态：用户＝气泡） ===== */
  .msg.user{
    align-self:flex-end;
    background:var(--user-bubble);border:1px solid var(--user-border);
    border-radius:10px;padding:9px 14px;
    font-size:13px;line-height:1.55;color:#3a4048;
    white-space:pre-wrap;
  }

  /* ===== 旧版对比（切回当前线上样子：无大卡、助手气泡、pre-wrap 素文本、720px） ===== */
  body.old .chat{
    background:transparent;border:none;box-shadow:none;
  }
  body.old .msgs{max-width:100%}
  body.old .msg{max-width:min(82%, 720px)}
  body.old .msg.assistant{
    background:var(--row-hover);border:1px solid var(--card-line);
    border-radius:10px;padding:12px 16px;
    white-space:pre-wrap;font-size:13px;line-height:1.55;color:#3a4048;
  }
  .note{font-size:12px;color:var(--text-cold);margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>

<button class="toggle" id="toggle">切到旧版对比</button>

<!-- 左侧边栏：定稿风格复刻（静态） -->
<div class="sidebar">
  <div class="sb-title">项目管理agent</div>
  <div class="sb-sub">样式参考 · 左侧边栏定稿（v2）</div>
  <div class="sb-tree">
    <div class="wrap card">
      <div class="row active"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1 3.5A1.5 1.5 0 0 1 2.5 2H6l1.7 1.5h5.8A1.5 1.5 0 0 1 15 5v7.5A1.5 1.5 0 0 1 13.5 14h-11A1.5 1.5 0 0 1 1 12.5z"/></svg></span><span class="label">工具</span><span class="time">10分钟前</span></div>
      <div class="row c2"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 2.5h7L12.5 5v8A1.5 1.5 0 0 1 11 14.5H3A1.5 1.5 0 0 1 1.5 13v-9A1.5 1.5 0 0 1 3 2.5z"/><path d="M10 2.5V5h2.5"/></svg></span><span class="label">方案 · 工具线收拢</span><span class="time">2小时前</span></div>
      <div class="row c3"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 2.5h7L12.5 5v8A1.5 1.5 0 0 1 11 14.5H3A1.5 1.5 0 0 1 1.5 13v-9A1.5 1.5 0 0 1 3 2.5z"/><path d="M10 2.5V5h2.5"/></svg></span><span class="label">卡片编辑机制改造</span><span class="time">3小时前</span></div>
      <div class="row"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1 3.5A1.5 1.5 0 0 1 2.5 2H6l1.7 1.5h5.8A1.5 1.5 0 0 1 15 5v7.5A1.5 1.5 0 0 1 13.5 14h-11A1.5 1.5 0 0 1 1 12.5z"/></svg></span><span class="label">UI交互</span><span class="time">4小时前</span></div>
      <div class="row c2"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 2.5h7L12.5 5v8A1.5 1.5 0 0 1 11 14.5H3A1.5 1.5 0 0 1 1.5 13v-9A1.5 1.5 0 0 1 3 2.5z"/><path d="M10 2.5V5h2.5"/></svg></span><span class="label">布局、信息视觉工程</span><span class="time">4小时前</span></div>
      <div class="row c3"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 2.5h7L12.5 5v8A1.5 1.5 0 0 1 11 14.5H3A1.5 1.5 0 0 1 1.5 13v-9A1.5 1.5 0 0 1 3 2.5z"/><path d="M10 2.5V5h2.5"/></svg></span><span class="label">主界面设计</span><span class="time">5天前</span></div>
      <div class="row"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1 3.5A1.5 1.5 0 0 1 2.5 2H6l1.7 1.5h5.8A1.5 1.5 0 0 1 15 5v7.5A1.5 1.5 0 0 1 13.5 14h-11A1.5 1.5 0 0 1 1 12.5z"/></svg></span><span class="label">权限管理</span><span class="time">1个月前</span></div>
    </div>

<!-- 右侧：对话区原型 -->
<div class="stage">
  <div class="chat" id="chat"></div>
</div>

<script>
/* ============ 工具 ============ */
function esc(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ Markdown 渲染（escape-first 白名单；原型版，约 60 行） ============ */
function inline(s){
  return esc(s)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
}
function cells(row){
  let a = row.split('|');
  if(a.length && a[0].trim()==='') a.shift();
  if(a.length && a[a.length-1].trim()==='') a.pop();
  return a.map(c => inline(c.trim()));
}
function renderMd(src){
  const lines = src.split('\n');
  const out = [];
  let i = 0, inCode = false, codeBuf = [];
  while(i < lines.length){
    const raw = lines[i];
    const t = raw.trim();
    if(t.startsWith('```')){
      if(!inCode){ inCode = true; codeBuf = []; }
      else { inCode = false; out.push('<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>'); }
      i++; continue;
    }
    if(inCode){ codeBuf.push(raw); i++; continue; }
    if(t === ''){ i++; continue; }

    /* 表格 */
    if(t.startsWith('|') && i+1 < lines.length && /^\s*\|[\s:|-]+\|/.test(lines[i+1]) && lines[i+1].includes('-')){
      let rows = '<tr>'+cells(raw).map(c=>'<th>'+c+'</th>').join('')+'</tr>';
      i += 2;
      while(i < lines.length && lines[i].trim().startsWith('|')){
        rows += '<tr>'+cells(lines[i]).map(c=>'<td>'+c+'</td>').join('')+'</tr>';
        i++;
      }
      out.push('<table>'+rows+'</table>'); continue;
    }
    /* 标题 */
    const h = t.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n = h[1].length; out.push('<h'+n+'>'+inline(h[2])+'</h'+n+'>'); i++; continue; }
    /* 分隔线 */
    if(/^-{3,}$/.test(t)){ out.push('<hr>'); i++; continue; }
    /* 引用 */
    if(t.startsWith('>')){
      const q = [];
      while(i < lines.length && lines[i].trim().startsWith('>')){ q.push(lines[i].trim().replace(/^>\s?/,'')); i++; }
      out.push('<blockquote>'+q.map(s=>'<p>'+inline(s)+'</p>').join('')+'</blockquote>'); continue;
    }
    /* 列表 */
    if(/^[-*]\s+/.test(t) || /^\d+\.\s+/.test(t)){
      const ordered = /^\d+\.\s+/.test(t);
      const items = [];
      while(i < lines.length){
        const tl = lines[i].trim();
        if(/^[-*]\s+/.test(tl)){ items.push(tl.replace(/^[-*]\s+/,'')); i++; }
        else if(/^\d+\.\s+/.test(tl)){ items.push(tl.replace(/^\d+\.\s+/,'')); i++; }
        else if(/^\s{2,}[-*]\s+/.test(lines[i])){ items.push(tl.replace(/^\s*[-*]\s+/,'')); i++; }
        else break;
      }
      out.push('<'+ (ordered?'ol':'ul') +'>'+ items.map(s=>'<li>'+inline(s)+'</li>').join('') +'</'+(ordered?'ol':'ul')+'>');
      continue;
    }
    /* 普通段落 */
    const para = [raw];
    i++;
    while(i < lines.length && lines[i].trim() !== '' &&
          !/^\s*(```|#{1,6}\s|>|-{3,}$)/.test(lines[i]) &&
          !/^\s*\|/.test(lines[i]) && !/^[-*]\s+/.test(lines[i]) && !/^\d+\.\s+/.test(lines[i])){
      para.push(lines[i]); i++;
    }
    out.push('<p>'+para.map(s=>inline(s)).join('<br>')+'</p>');
  }
  return out.join('\n');
}

/* ============ 真实数据：取自 _repro_data.json（card_019 会话，原样） ============ */
const MSGS = [
  {role:'step', body:'本轮调用：装配上下文 → 判型 → 三席并行 → 统合收敛'},
  {role:'user', body:'几个问题：\n1，模型会将上一轮的三席观点放在这一轮去讲\n2，它总是空喊落盘文件，我不知道为什么，它几乎不会调用工具了'},
  {role:'assistant', model:'moonshotai/kimi-k3', time:'22 分钟前', body:
`先答你的两个问题，再裁三席——这轮三席里有一份**伪造了代码证据**，不先核验就裁，等于在假地基上盖楼。

**问题 1（三席复读上一轮）**：根因是**历史回流**——三席的输入是整段对话历史（机制事实 14/18），上一轮三席的输出、我的交付，全在里面。三席互不可见（事实 10），没有同期同侪，就抓跨轮的旧话当参考，顺着往下讲。这不是三席记性好，是喂进去的东西没筛。

**问题 2（空喊落盘、不调工具）**：分两个“它”——
- **三席**：本来就没有工具（你 10-02 定的零工具），但读到的历史里满是“已落盘”“写入 ok”这种话。没有工具的模型看着满屏落盘腔调，最顺的续写就是学这个腔调——虚报病（报落盘、报建卡、伪工具调用）根子都是这一个。
- **我（统合官）**：前几轮我为了躲“回复被中断、整轮重跑”，主动搞了“零工具”策略——压掉了核验。这策略该回退，核验工具该用就用。

**一句话根子：给没有工具的模型，喂了满是工具动作的全量历史。**

---

**三席判读（先核验，后裁决）**

**输出 1——判死，伪造代码证据。** 它声称“主仓 simple_service 头注原话：call_main 统合交付、call_simple 保留为观测兼容/回滚路径”——**这是它编的**。我第 36 轮探针趟读到的头注原文是：“call_main 统合交付。call_simple（观点前置的旧编排）保留为观测兼容/回滚路径。” 它把“call_simple”偷换成“call_main”，把“旧编排”偷换成“观测兼容/回滚路径”，然后拿这个假证据推出“三席链路没有被替换，是被并入主链”——**结论方向反了**。E 升仓恰恰是把三席从全链前部挪到尾部（call_simple 是旧编排、call_main 是新主路径），不是“并入”。它用伪造的代码注释，把 E 的架构改动了说反了。这是虚报病的新亚型：**伪造代码证据**——比空喊落盘更危险，因为它有“原话”的伪装。

**输出 2——部分采纳，两处错。** 对：历史隔离（History Isolation）是成熟框架标准做法，方案 A（严格隔离：三席只收用户原始提问＋系统提示词，剥离历史 assistant 回复）和方案 B（摘要注入：统合官探针趟生成客观事实摘要注入）都可落地。错：①它把“几乎不调工具”归因为“E 升仓后工具定义遮蔽”——**没有证据**。E 升仓只动三席时序，没动统合官工具挂载；统合官工具调用正常（我这轮就在用）。②它建议“排查工具注册表”——工具注册表是 card_036 的事，与 E 无关。它的“输出流强校验”与 v2.1 第 5 节重复，不新增。

**输出 3——本轮最佳，零病。** 唯一同时答对两半的：问题 1 根因是“全量历史没筛”，问题 2 根因是“给没有工具的模型喂了满是工具动作的历史”。它主动提出“要不要我去读一下现在三席的上下文到底怎么拼的”——这是探针趟的正确姿态，但它没有工具，只能问。它的两条修法（交付后三席原始输出不再往前带／三席输入剥掉文件写入叙述）与 v2.1 第 5 节方向一致，可并入。

---

/* ============ 渲染 ============ */
const chat = document.getElementById('chat');
let old = false;

function makeStepEl(m){
  const el = document.createElement('div');
  el.className = 'step-row';
  el.innerHTML = '<span class="sdot done"></span>' + esc(m.body);
  return el;
}
function makeMessageEl(m){
  const el = document.createElement('div');
  if(m.role === 'user'){
    el.className = 'msg user';
    el.innerHTML = esc(m.body).replace(/\n/g, '<br>');
    return el;
  }
  el.className = 'msg assistant' + (m.role === 'demo' ? ' demo' : '');
  const meta = '<div class="meta"><span class="badge">' + esc(m.model) + '</span>' +
    (m.role === 'demo' ? '<span class="demo-tag">演示样本</span>' : '') +
    '<span class="time">' + esc(m.time || '') + '</span></div>';
  const bodyHtml = old ? esc(m.body).replace(/\n/g, '<br>') : renderMd(m.body);
  el.innerHTML = meta + '<div class="md">' + bodyHtml + '</div>';
  return el;
}
function render(){
  chat.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'chat-head';
  head.innerHTML = '<h2>对话区 · 会话流样式</h2>' +
    '<div class="tags"><span class="tag blue">整个对话区＝一张卡片 · 我的消息气泡 · 助手消息文档流 · Markdown 渲染 · 70%/48em</span>' +
    '<span class="tag">数据取自 _repro_data.json 真实会话</span>' +
    '<span class="tag">最后一条为渲染演示样本</span></div>';
  chat.appendChild(head);

  /* 通用样式：整张卡内一条统一内容列——过程行灰字、我的气泡靠右、助手文档流靠左，同边界 */
  const msgs = document.createElement('div');
  msgs.className = 'msgs';
  MSGS.forEach(m => {
    if(m.role === 'step'){ msgs.appendChild(makeStepEl(m)); return; }
    msgs.appendChild(makeMessageEl(m));
  });
  chat.appendChild(msgs);

  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = '整个对话流是一整张卡片（白底、细描边、圆角）。卡片内：过程行＝灰色小字独立行；我的消息＝右侧浅蓝气泡；助手消息＝文档流（无边框无底色、Markdown 真渲染）。宽度：min(70%, 48em)。拖动窗口宽度可看到 70% 跟随；超过门槛后封顶（48em = 672px，一行约 48 个汉字，W3C clreq 横排上限）。左上按钮可切旧版对比。';
  chat.appendChild(note);
}

const toggle = document.getElementById('toggle');
toggle.addEventListener('click', () => {
  old = !old;
  document.body.classList.toggle('old', old);
  toggle.textContent = old ? '回到新版' : '切到旧版对比';
  render();
});

render();

/* ============ 自检（?check=1）：机器断言，不靠肉眼 ============
   注意：同步执行（不用 setTimeout）——无头浏览器 --dump-dom 在 load 后立即 dump，
   异步自检会拿不到块。 */
if(location.search.includes('check')){
  const out = [];
  try{
    const q = sel => document.querySelector(sel);
    if(!q('.md strong')) out.push('NO-STRONG');
    if(!q('.md table')) out.push('NO-TABLE');
    if(!q('.md pre code')) out.push('NO-PRECODE');
    if(!q('.md blockquote')) out.push('NO-QUOTE');
    if(!q('.md ul')) out.push('NO-UL');
    if(!q('.msg.user')) out.push('NO-USER');
    if(!q('.msg.assistant')) out.push('NO-ASSISTANT');
    if(!q('.msg.assistant.demo')) out.push('NO-DEMO');
    if(!q('.step-row')) out.push('NO-STEP');
    /* 整张卡片：.chat 白底 + 圆角 + 描边 */
    const cc = getComputedStyle(q('.chat'));
    if(cc.backgroundColor !== 'rgb(255, 255, 255)') out.push('CHAT-BG: ' + cc.backgroundColor);
    if(!cc.borderRadius.includes('14')) out.push('CHAT-RADIUS');
    if(cc.borderTopWidth === '0px') out.push('CHAT-NOBORDER');
    /* 助手文档流：透明无边框 */
    const as = getComputedStyle(q('.msg.assistant'));
    if(as.backgroundColor !== 'rgba(0, 0, 0, 0)') out.push('ASSISTANT-BG: ' + as.backgroundColor);
    if(as.borderStyle !== 'none') out.push('ASSISTANT-BORDER');
    /* 用户气泡在 */
    const us = getComputedStyle(q('.msg.user'));
    if(us.backgroundColor !== 'rgb(234, 242, 254)') out.push('USER-BG: ' + us.backgroundColor);
    /* 我的发言不超出模型消息边界（用户 21:39）：user 右边缘 = 内容列右边缘 */
    const ub = q('.msg.user').getBoundingClientRect();
    const mb = q('.msgs').getBoundingClientRect();
    if(ub.right > mb.right + 1) out.push('USER-OVERFLOW: user.right=' + ub.right + ' > msgs.right=' + mb.right);
    if(ub.right < mb.right - 1) out.push('USER-RIGHT-GAP: ' + (mb.right - ub.right) + 'px');
    /* 卡片内无回合容器（无 .turn） */
    if(q('.turn')) out.push('TURN-LEFTOVER');
    const pre = document.createElement('pre');
    pre.id = 'checkout';
    pre.style.cssText = 'position:fixed;left:-9999px';
    pre.textContent = out.length ? 'CHECK-FAIL (' + out.length + ')\n' + out.join('\n')
      : 'CHECK-PASS: md 渲染齐；整张卡片在（白底/圆角/描边）；user 气泡在；assistant 透明无边框；step-row 在；无回合容器残留；demo 在';
    document.body.appendChild(pre);
  }catch(err){
    const pre = document.createElement('pre');
    pre.id = 'checkout';
    pre.style.cssText = 'position:fixed;left:-9999px';
    pre.textContent = 'CHECK-ERROR: ' + (err && err.stack ? err.stack : String(err));
    document.body.appendChild(pre);
  }
}
</script>
