<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>画布页 · CardColony</title>
<style>
/* ========== 1. 令牌（深浅两套同名同序；缺一即自检 fail） ========== */
:root[data-theme="dark"]{
  --bg:#0c1015; --surface:#1a212a; --surface2:#202935; --raised:#27303c;
  --text:#e8edf3; --text2:#a9b6c2; --text3:#84929f; --disabled:#5a6673;
  --stroke:#2a3542; --stroke-strong:#6b7a94;
  --accent:#4d9fff; --accent2:#3b90f0; --on-accent:#0b1220;
  --st-run:#35d0a0; --st-done:#6fbf73; --st-blocked:#ff8a6b; --st-paused:#d9b45c; --st-queued:#8fa8bf; --st-arch:#98a3ad; --st-round:#4da3ff;
  --k-master:#d8dee6; --k-manager:#4da3ff; --k-unit:#38b8a0; --k-worker:#f5a65b; --k-qa:#7ec97e; --k-pm:#dd8ab4; --k-ui:#56c8d8;
  --brand-gold:#e2a63d; --brand-gold-ink:#2b1f08; --brand-line:#e6edf3;
  --wire-parent:#5c6a78; --wire-comm:#4d9fff; --wire-rel:#a78bfa;
}
:root[data-theme="light"]{
  --bg:#e7e9e4; --surface:#ffffff; --surface2:#f3f4f1; --raised:#ffffff;
  --text:#1c2430; --text2:#45525e; --text3:#5c6a76; --disabled:#9aa6ae;
  --stroke:#d5d9d2; --stroke-strong:#7c8896;
  --accent:#1663c2; --accent2:#1255a8; --on-accent:#ffffff;
  --st-run:#0b7a56; --st-done:#2e7d3a; --st-blocked:#c0442a; --st-paused:#7d5e14; --st-queued:#4d6478; --st-arch:#646e79; --st-round:#1a5fb8;
  --k-master:#55606c; --k-manager:#1a5fb8; --k-unit:#17786a; --k-worker:#8f520f; --k-qa:#2f7030; --k-pm:#9c3f6f; --k-ui:#0d6f7e;
  --brand-gold:#c9901f; --brand-gold-ink:#2b1f08; --brand-line:#1c2733;
  --wire-parent:#6e7883; --wire-comm:#1663c2; --wire-rel:#6d50c4;
  /* 浅色下的层次靠三层明度差 + 真实投影撑起来（白底上无投影＝整张画面糊成一片） */
  --shadow-1:0 2px 8px rgb(28 36 48/.14),0 0 0 1px rgb(28 36 48/.05);
  --shadow-2:0 4px 12px rgb(28 36 48/.12),0 0 0 1px rgb(28 36 48/.05);
  --shadow-3:0 14px 34px rgb(28 36 48/.18),0 0 0 1px rgb(28 36 48/.06);
  --chrome-bg:#ffffff;
}
:root{
  --hit:24px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r-card:6px; --r-panel:8px; --r-float:10px; --r-modal:14px;
  --fs-title:16px; --fs-head:14px; --fs-body:13px; --fs-2:12px; --fs-3:11px; --fs-4:10px;
  --f-ui:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --t-fast:120ms; --t-mid:200ms; --t-canvas:400ms;
  --ease:cubic-bezier(.4,0,.2,1); --ease-move:cubic-bezier(.22,.75,.2,1);
  --shadow-1:0 2px 8px rgb(0 0 0/.42); --shadow-2:0 4px 14px rgb(0 0 0/.28); --shadow-3:0 12px 36px rgb(0 0 0/.42);
  --node-w:316px; --node-h:84px; --rowh:98px; --colw:366px;
}
/* ========== 2. 基础 ========== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f-ui);font-size:var(--fs-body);color:var(--text);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;font-size:inherit}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.mono{font-family:var(--f-mono);font-size:var(--fs-4);letter-spacing:.02em}
/* ========== 3. 图标 / 按钮 / 输入 ========== */
.ic{display:inline-block;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.ic-13{width:13px;height:13px}.ic-14{width:14px;height:14px}.ic-18{width:18px;height:18px}.ic-20{width:20px;height:20px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 12px;border-radius:var(--r-card);
  border:1px solid var(--stroke-strong);background:var(--surface2);color:var(--text);cursor:pointer;line-height:1;
  transition:background var(--t-fast),border-color var(--t-fast)}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.sm{min-height:24px;padding:0 8px;font-size:var(--fs-3)}
.btn.link{border-color:transparent;background:none;color:var(--accent);padding:0 6px}
.btn.link:hover{background:var(--surface2)}
.icon{width:32px;height:32px;min-width:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;
  border:none;background:none;border-radius:var(--r-card);color:var(--text2);cursor:pointer;transition:background var(--t-fast),color var(--t-fast)}
.icon:hover{background:var(--surface2);color:var(--text)}
.icon.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.field{height:32px;min-width:0;padding:0 10px;border-radius:var(--r-card);border:1px solid var(--stroke-strong);
  background:var(--raised);color:var(--text);font-family:inherit;font-size:var(--fs-2)}
.field::placeholder{color:var(--text3)}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
/* ========== 4. 框架：左栏 / 顶栏 / 舞台 / 模型条 ========== */
.app{display:flex;height:100vh}
/* R1：rail 恒 44px；展开体绝对定位覆盖画布（不挤压画布宽度，同 v3 基线做法） */
.rail{width:44px;flex:none;position:relative;z-index:60;background:var(--surface);border-right:1px solid var(--stroke)}
.rail-logo{height:44px;display:flex;align-items:center;justify-content:center}
.rail-btns{display:flex;flex-direction:column;gap:2px;padding:2px 6px}
.rail-btn{width:32px;height:32px;min-width:32px;min-height:32px;border:none;background:none;border-radius:var(--r-card);
  display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:pointer}
.rail-btn:hover{color:var(--text);background:var(--surface2)}
.rail-body{position:absolute;left:44px;top:0;bottom:0;width:216px;background:var(--surface);border-right:1px solid var(--stroke);
  box-shadow:var(--shadow-3);opacity:0;pointer-events:none;visibility:hidden;overflow-y:auto;
  transform:translateX(-6px);transition:opacity var(--t-fast),transform var(--t-fast),visibility 0s linear .12s}
/* 悬停左栏展开；列表本身是 .rail 的后代，指针进列表时 .rail:hover 仍成立，不会死锁。
   两条选择器都写：.rail:hover 管从窄条进入，.rail-body:hover 管列表自身保持。画布宽度不变（绝对定位覆盖，R1）。 */
.rail.open .rail-body,.rail:hover .rail-body,.rail-body:hover{opacity:1;pointer-events:auto;visibility:visible;transform:none;
  transition:opacity var(--t-fast),transform var(--t-fast),visibility 0s}
.rs-h{font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3);letter-spacing:.08em;padding:12px 12px 4px;
  display:flex;align-items:center;justify-content:space-between}
.tree-row{min-height:28px;display:flex;gap:8px;align-items:center;padding:0 10px;border-radius:var(--r-card);
  font-size:var(--fs-2);color:var(--text2);cursor:pointer;margin:0 4px;position:relative}
.tree-row:hover{background:var(--surface2);color:var(--text)}
.tree-row.d1{padding-left:24px}.tree-row.d2{padding-left:38px}
.tree-row .d{width:8px;height:8px;border-radius:50%;flex:none}
/* 左栏行＝**照运行中 Agent 左栏列表原样搬**（D:\AI_station\推演agent）：
   static/esm/nav_render.js @265-340 的行结构＝[图标 ico] → [文字徽标 badge] → [标题 title]；
   static/nav.css @393-402 图标：14×14、stroke=currentColor、颜色随类型；
   static/nav.css @496-545 徽标：font-size 9px / line-height 14 / padding 0 4 / radius 4 /
   类型色边框(.5) ＋ 类型色 10% 底。 */
.tree-row .kbadge{display:inline-flex;align-items:center;gap:4px;flex:none;color:var(--kc,var(--text3))}
.tree-row .kbadge .ic{width:14px;height:14px;stroke-width:1.5}
.tree-row .kbadge.k-struct .ic{stroke-width:2}
.tree-row .kbadge .kb-t{font-size:9px;line-height:14px;padding:0 4px;border-radius:4px;font-weight:600;
  color:var(--kc,var(--text2));letter-spacing:.2px;
  border:1px solid color-mix(in srgb,var(--kc,var(--text3)) 50%,transparent);
  background:color-mix(in srgb,var(--kc,var(--text3)) 10%,transparent)}
.tree-row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tree-row .fold{width:24px;height:24px;min-width:24px;display:inline-flex;align-items:center;justify-content:center;
  transition:transform var(--t-fast);border:none;background:none;color:var(--text3);cursor:pointer;border-radius:3px}
.tree-row.folded .fold svg{transform:rotate(-90deg)}
.tree-row .fold:hover{color:var(--text);background:var(--raised)}
.tree-row.hl{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--text)}
.rs-note{font-size:var(--fs-3);color:var(--text3);padding:10px 12px;line-height:1.5;border-top:1px solid var(--stroke);margin-top:8px}
.height{height:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--surface);
  border-bottom:1px solid var(--stroke);position:relative;z-index:65}
/* 品牌字标：直接用资产 lockup 几何（viewBox 0 0 716 196，mark 嵌套 x16 y29 w105 h120，文字 x125 y140 fs120 w650 ls1） */
.wordmark{display:inline-flex;align-items:center;user-select:none;padding-right:6px;line-height:1}
.wordmark svg{height:22px;width:auto;display:block}
.tb-div{width:1px;height:20px;background:var(--stroke);flex:none}
.crumb{font-size:var(--fs-2);color:var(--text2);white-space:nowrap}
.crumb .layer{color:var(--text)}
.tb-stat{font-size:var(--fs-3);color:var(--text3);white-space:nowrap}
.tb-stat b{color:var(--text2);font-weight:600}
.tb-stat .arch{pointer-events:none;color:var(--text3)}
.build{font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3);white-space:nowrap}
.tb-spacer{flex:1}
.zoomgrp{display:flex;align-items:center;gap:1px}
.zoomgrp .lbl{min-width:52px;min-height:24px;border:none;background:none;color:var(--text2);font-family:var(--f-mono);font-size:var(--fs-2);cursor:pointer;border-radius:var(--r-card)}
.zoomgrp .lbl:hover{background:var(--surface2);color:var(--text)}
.stage{flex:1;position:relative;overflow:hidden;background:var(--bg);
  background-image:radial-gradient(color-mix(in srgb,var(--stroke) 60%,transparent) 1px,transparent 1px);background-size:24px 24px}
.modelbar{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:6px;padding:0 8px;
  background:var(--surface);border-top:1px solid var(--stroke);z-index:30;
  overflow-x:auto;overflow-y:hidden;touch-action:pan-x;overscroll-behavior-x:contain;scrollbar-width:thin;
  -webkit-overflow-scrolling:touch}
.modelbar.dragging{cursor:grabbing;user-select:none}
.modelbar::-webkit-scrollbar{height:6px}
.modelbar::-webkit-scrollbar-thumb{background:var(--stroke);border-radius:3px}
.mb-lead{font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3);letter-spacing:.08em;margin-right:2px;flex:none}
/* 单行：图标＋类名＋当前模型名（不显示张数）；固定宽度，超出屏幕横向拖动 */
.mb-cell{flex:0 0 168px;width:168px;height:32px;display:flex;flex-direction:row;align-items:center;gap:6px;padding:0 8px;
  border:1px solid var(--stroke);border-radius:var(--r-card);background:var(--surface2);cursor:pointer;text-align:left;overflow:hidden}
.mb-cell:hover{background:var(--raised)}
.mb-cell.zero{opacity:.45}
.k-row{display:flex;align-items:center;gap:5px;font-size:var(--fs-3);color:var(--text2);white-space:nowrap;overflow:hidden;flex:none}
.k-ic{display:inline-flex;color:var(--kc,var(--text3))}
.k-ct{margin-left:auto;font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3)}
.k-md{font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
/* ========== 5. 画布 / 节点 / 线 ========== */
.canvas{position:absolute;inset:0;overflow:clip;touch-action:none;cursor:grab}
.canvas.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:3000px;height:2000px;transform-origin:0 0}
.world.anim{transition:transform var(--t-canvas) var(--ease-move)}
#wires{position:absolute;left:0;top:0;width:3000px;height:2000px;pointer-events:none;overflow:visible}
.wire-parent{fill:none;stroke:var(--wire-parent);stroke-width:1.5}
.wire-comm{fill:none;stroke:var(--wire-comm);stroke-width:1.5;stroke-dasharray:6 7}
.wire-rel{fill:none;stroke:var(--wire-rel);stroke-width:1.4;stroke-dasharray:2 5}
.wire-rel-dia{fill:var(--surface);stroke:var(--wire-rel);stroke-width:1.4}
.wire-comm-dot{fill:var(--wire-comm)}
.meteor-head{fill:var(--wire-comm)}
.meteor-tail{fill:none;stroke:var(--wire-comm);stroke-width:2.4;stroke-linecap:round}
.world.nolines #wires{display:none}
.node{position:absolute;width:var(--node-w);height:var(--node-h);display:flex;flex-direction:column;gap:3px;
  padding:8px 12px;background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-card);
  box-shadow:var(--shadow-1);overflow:visible;cursor:default}
.node.anim{transition:left 380ms var(--ease-move),top 380ms var(--ease-move),opacity 280ms linear,transform 280ms var(--ease)}
/* 折叠／展开的动效（不是闪现消失）：收起播退场（缩+淡 180ms）再隐藏；展开播入场（240ms）。
   期间其余卡由 left/top 过渡同时重排——所以「整支收起来」是一条连贯的动，而不是一张张瞬移。 */
@keyframes nodeIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.node.node-in{animation:nodeIn 240ms var(--ease) both}
.node.anim.node-out{opacity:0;transform:scale(.94);pointer-events:none}
/* 卡面不带任何装饰色条：状态由「状态点＋运行流光」表达，类型由图标表达（用户口径：卡上方的颜色条无意义，已删） */
.node[data-state="run"]{--stc:var(--st-run)}
.node[data-state="done"]{--stc:var(--st-done)}
.node[data-state="blocked"]{--stc:var(--st-blocked)}
.node[data-state="paused"]{--stc:var(--st-paused)}
.node[data-state="queued"]{--stc:var(--st-queued)}
.node[data-kind="master"]{--kc:var(--k-master)}.node[data-kind="manager"]{--kc:var(--k-manager)}
.node[data-kind="unit"]{--kc:var(--k-unit)}.node[data-kind="worker"]{--kc:var(--k-worker)}
.node[data-kind="qa_card"]{--kc:var(--k-qa)}.node[data-kind="pm_card"]{--kc:var(--k-pm)}
.node[data-kind="ui"]{--kc:var(--k-ui)}
.node.first-col{padding-left:14px}
.node .leftbar{position:absolute;left:-1px;top:8px;bottom:8px;width:4px;border-radius:2px;background:var(--kc,transparent)}
.node[data-kind="master"] .leftbar{width:4px;top:2px;bottom:2px;border-radius:var(--r-card) 0 0 var(--r-card)}
.node[data-kind="manager"] .leftbar{width:3px}
.node[data-kind="unit"] .leftbar{width:2px}
.node.is-work{border-style:dashed}
/* 非 active（lifecycle=completed）：降饱和 + 略深底，不用整卡 opacity（opacity 会把正文一起拖到 3.x:1）
   状态标记＝置灰 ＋ done 标记（v3 原型 §状态三层：生命周期 completed「画布上不单独出词」，
   所以只用色点＋done 记号，不再造一套中文状态词，也不换卡片形态） */
.node.inactive{filter:saturate(.45)}
/* 已完成卡（lifecycle=completed）＝与其它卡完全同一形态与交互，只多两处标记：
   ① 状态点转灰（.dot 用 --st-arch）  ② 右上角 done 记号。
   不再有「药丸形紧凑行」这套独立形态——那是本卡自造、原型与正稿都没有的东西，
   它让同一种卡出现两种读法、还让连线落点两套口径打架（已删）。 */
.node.inactive .n-head .dot{background:var(--st-arch)}
/* done 标记：卡片右上角的小记号（不是一整套独立形态，交互与其它卡完全一致） */
/* done 记号＝**行内元素**，排在「标题与折叠钮之间」这一格。
   原来是绝对定位 right:10px，正好压在行尾的「子卡数」上（用户实测：done 和数字堆在一起）。
   改成流内占位后，标题 … done … 子卡数 三者按顺序排，互不重叠。 */
.node .dnmark{position:static;display:none;align-items:center;gap:3px;flex:none;
  font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;color:var(--text3);
  border:1px solid var(--stroke);border-radius:3px;padding:0 4px;line-height:14px;pointer-events:none}
.node.inactive .dnmark{display:inline-flex}
/* 卡面面板：与其它右侧面板同一套「从右缘展开进来」的形态（不再单独改 right，避免两套定位打架） */
.float.docked{z-index:70}   /* 贴边展开的面板与其它面板同层：不存在“卡面面板被压在下面”的第二套层级 */
.face-sec input{width:100%;height:32px;border:1px solid var(--stroke-strong);background:var(--raised);color:var(--text);
  border-radius:var(--r-card);padding:0 10px;font-family:inherit;font-size:var(--fs-2)}
.node:hover{border-color:var(--stroke-strong);box-shadow:var(--shadow-2);z-index:6}
.node.collapsed .n-type .foldbtn .ic{transform:rotate(-90deg)}
/* 卡面统一对齐轴：每行左端＝内容，右端＝元数据（顺序由 order 排，DOM 不动） */
.n-type{display:flex;align-items:center;gap:6px;height:18px;color:var(--text3);font-size:var(--fs-3);flex:none}
.n-type>.kbadge{order:1}.n-type>.stword{order:2;min-width:0}
.n-type>.modb{order:3}.n-type>.childct{order:4}.n-type>.foldbtn{order:5}
.foldbtn{width:26px;height:26px;min-width:26px;min-height:26px;margin:-6px -6px -6px 0;border:none;background:none;color:var(--text3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:4px}
.foldbtn:hover{color:var(--text);background:var(--surface2)}
.foldbtn svg{transition:transform var(--t-fast)}
.kbadge{display:inline-flex;align-items:center;gap:4px;color:var(--kc);flex:none}
.kbadge .kname{font-size:var(--fs-4);color:var(--text3);letter-spacing:.04em}
/* 状态＝色点＋服务端显示词：短词（运行中/受阻/排队中）靠左恒在，尾部的轮次细节让位，
   被截断部分悬停给全文——不让一格把整行挤死 */
.stword{display:inline-flex;align-items:center;gap:5px;color:var(--text2);font-size:var(--fs-3);flex:0 1 auto;
  min-width:52px;max-width:132px;overflow:hidden;white-space:nowrap}
.stword .stext{overflow:hidden;text-overflow:ellipsis}
.stword .dot{width:6px;height:6px;border-radius:50%;background:var(--stc);flex:none}
.node[data-state="run"] .stword .dot{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--stc)}50%{opacity:.55;box-shadow:0 0 0 3px color-mix(in srgb,var(--stc) 30%,transparent)}}
.modb{margin:-6px 0;margin-left:auto;min-height:26px;min-width:24px;flex:0 0 auto;justify-content:center;font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3);display:inline-flex;align-items:center;gap:3px;
  max-width:78px;overflow:hidden;white-space:nowrap;border-radius:4px;padding:0 4px;cursor:pointer}
.modb .ic{opacity:.7}
.modb:hover{color:var(--text);background:var(--surface2)}
.modb:hover .ic{opacity:1}
.modb.ov{color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.modb.ov .ic{opacity:1}
.modb .mtx{overflow:hidden;text-overflow:ellipsis}
.childct{font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3);flex:none}
.n-title{display:flex;align-items:center;gap:6px;height:22px;flex:none}
.n-title .tt{font-size:var(--fs-body);font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* 卡号＝标识，退到标题行右端（不再是标题的邻居） */
.archcode{font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3);flex:none;margin-left:auto;letter-spacing:.02em}
.n-facts{display:flex;align-items:center;gap:9px;height:16px;flex:none;overflow:hidden;font-size:var(--fs-3);color:var(--text3);white-space:nowrap}
.n-facts .kv{display:inline-flex;align-items:baseline;gap:4px;min-width:0}
.n-facts .kv+.kv::before{content:'';align-self:center;width:1px;height:9px;background:var(--stroke);margin-right:5px}
.n-facts .kv i{font-style:normal;font-size:var(--fs-4);color:var(--text3);letter-spacing:.04em}
.n-facts .kv b{color:var(--text2);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.n-facts .kv.warn b{color:var(--st-blocked)}
.n-facts .n-why{display:none;margin-left:auto;font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3);flex:none}
.node.inactive .n-facts .n-why{display:inline}
.n-last{display:none;height:16px;flex:none;align-items:center;gap:5px;font-size:var(--fs-3);color:var(--text2);overflow:hidden;white-space:nowrap}
.n-last .lbl{font-size:var(--fs-4);color:var(--text3);letter-spacing:.06em;flex:none}
.n-last .txt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.n-last b{color:var(--text);font-weight:600}
.n-last .n-why{display:none;margin-left:auto;font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3);flex:none}
.node.inactive .n-last .n-why{display:inline}
/* 暂停的卡：卡面常显一枚「继续」（播放样式）钮——放在**卡身右侧**（用户口径：暂停卡没有内容滚动，卡面上本来就有空间），
   垂直居中贴在右缘内侧。无外圈、无文字，橙色播放图标（用户：放大一些、用橙色）。
   它不占动作行、不带走其它按钮。 */
.node .resumebtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;min-width:34px;min-height:34px;padding:0;
  display:none;align-items:center;justify-content:center;
  border:none;background:none;color:var(--brand-gold);
  border-radius:8px;cursor:pointer;z-index:6;box-shadow:none}
.node .resumebtn:hover{background:color-mix(in srgb, var(--brand-gold) 15%, transparent)}
.node .resumebtn .ic{width:17px;height:17px;margin-left:2px}
.node[data-state="paused"] .resumebtn{display:inline-flex}
.node[data-state="paused"] .acts{display:none!important}
.world[data-lod="far"] .resumebtn,.world[data-lod="near"] .resumebtn{display:none!important}

/* 同级完工卡打包：一束替身占一格。表达＝**几张卡叠在一起**（三层错边小卡，
   上层卡头露出类型徽标与张数）——画布是空间界面，「这里是一沓卡」用形状说，
   不用文字省略号说（那是列表的语义）。高度比正常卡矮（56 vs 84）——省空间。 */
.packnode{position:absolute;width:316px;height:44px;cursor:pointer;z-index:2;transition:box-shadow var(--t-fast),opacity .18s}
/* V4 热区补偿：低缩放档下束的屏上命中区反向放大至 ≥24px（视觉不放大） */
.packnode::after{content:'';position:absolute;left:50%;top:50%;width:24px;height:24px;
  transform:translate(-50%,-50%) scale(calc(1 / var(--z,1)));pointer-events:auto}
.packnode:hover{opacity:1}
/* 三层错边：暗卡与顶层同尺寸、只错 3px/6px——暗卡大半藏在顶层下，只从右下露窄边 */
.packnode .pk-b{position:absolute;left:0;top:0;width:calc(100% - 10px);height:calc(100% - 10px);border-radius:10px;
  border:1px solid var(--stroke);background:color-mix(in srgb,var(--surface) 88%,transparent)}
.packnode .pk-b2{transform:translate(10px,10px);opacity:.55}
.packnode .pk-b1{transform:translate(5px,5px);opacity:.8}
.packnode .pk-top{position:absolute;left:0;top:0;width:calc(100% - 10px);height:calc(100% - 10px);
  border-radius:10px;border:1px dashed var(--stroke-strong);background:var(--surface);
  display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px;box-shadow:var(--shadow-1)}
.packnode:hover .pk-top{border-color:var(--text3);box-shadow:var(--shadow-2)}
.packnode .pk-n{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--text2);line-height:1}
.packnode .pk-cv{display:inline-flex;align-items:center;color:var(--text3)}
.packnode .pk-cv svg{transition:transform .22s ease}
.packnode .pk-cv.is-open svg{transform:rotate(180deg)}
.packnode.is-open .pk-b1,.packnode.is-open .pk-b2{opacity:.18}
.packnode.pk-in{animation:pkIn .26s ease-out both}
.packnode.pk-out{animation:pkOut .22s ease-in both}
@keyframes pkIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes pkOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.94)}}
.world[data-lod="far"] .packnode .pk-lb,.world[data-lod="near"] .packnode .pk-lb{display:none}
.n-toolbar{position:absolute;right:-1px;top:-38px;display:flex;gap:2px;padding:2px;background:var(--surface);border:1px solid var(--stroke);
  border-radius:var(--r-card);box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity var(--t-fast)}
.node:hover .n-toolbar{opacity:1;pointer-events:auto}
.n-toolbar button{width:34px;height:34px;min-width:34px;min-height:34px;border:none;background:none;border-radius:4px;color:var(--text2);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.n-toolbar button:hover{background:var(--surface2);color:var(--text)}
.node[data-archived="1"]{display:none}
/* LOD 四档 */
.world[data-lod="far"] .n-facts,.world[data-lod="far"] .n-last,.world[data-lod="far"] .kname,
.world[data-lod="far"] .n-toolbar,.world[data-lod="far"] .n-why{display:none!important}
.world[data-lod="far"] .n-toolbar{pointer-events:none}
.world[data-lod="far"] .modb{max-width:70px}
.world[data-lod="near"] .n-facts .kv:nth-child(n+3){display:none}
.world[data-lod="near"] .n-toolbar{display:none!important}
/* far／near 档不渲染卡内小控件：折叠钮整颗不画（折叠走卡体单击，R10/R13），模型徽标降为纯读数 */
/* 折叠钮在 LOD 各档的呈现改由下方 LOD 段统一管（<75% 只 icon、≥75% 数字放大） */
.world[data-lod="far"] .modb,.world[data-lod="near"] .modb{pointer-events:none}
.world[data-lod="far"] .archcode{display:none!important}
.tree-row .fold{width:24px;height:24px;min-width:24px;min-height:24px}
.world[data-lod="full"] .n-last{display:none!important}
.world[data-lod="ultra"] .n-facts{display:none!important}
.world[data-lod="ultra"] .n-last{display:flex!important}
/* 拖拽中的卡必须让出命中测试：它跟着指针走，若仍可命中，
   document.elementFromPoint 永远返回它自己 ⇒ 永远找不到落点卡（这就是「拖了没反应」的真因）。 */
.node.dragging{opacity:.92;z-index:20;box-shadow:var(--shadow-3);pointer-events:none}
.node.drag-target{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.node.drag-reject{border-color:var(--st-blocked);box-shadow:0 0 0 2px var(--st-blocked)}
.node.dimmed{opacity:.28}
.node.highlight{box-shadow:0 0 0 2px var(--accent),var(--shadow-2)}
.node.ghost-out{opacity:0;transform:scale(.94)}
/* ========== 6. 右缘书签组 ========== */
.bm{position:fixed;top:150px;right:calc(8px + var(--paneW,0px));display:flex;flex-direction:column;z-index:60;
  transition:right .28s cubic-bezier(.22,.75,.2,1)}
/* 面板从右缘「展开进来」：贴边占位，书签组跟着面板左缘一起左移——按钮不是钉死不动。
   --paneW 由 openFloat/setPanelDock 在打开时按该面板实际宽度写入（不写死一个值）。 */
.bm-seg{width:36px;height:44px;border:1px solid var(--stroke);background:var(--surface);color:var(--text2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:-1px;position:relative;
  transition:background var(--t-fast),color var(--t-fast)}
/* 入口只给图标、不放文字：中文两字勉强塞进 36px，英文 ARCHIVE 必然溢出按钮（用户口径：这里不放字）。
   语义由 aria-label／title 承担。.bm-lb 保留为空节点，只为兼容重译路径与既有断言。 */
.bm-seg .bm-lb{display:none}
.bm-seg .ic{width:16px;height:16px}
.bm-seg:first-child{margin-top:0;border-radius:7px 7px 0 0}
.bm-seg:last-child{border-radius:0 0 7px 7px}
.bm-seg:hover{background:var(--surface2);color:var(--text)}
.bm-seg.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.bm-badge{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--on-accent);
  font-family:var(--f-mono);font-size:9px;display:none;align-items:center;justify-content:center;padding:0 3px}
.bm-seg.hasnew .bm-badge{display:flex}
.bm-seg.hasnew{color:var(--accent)}
/* ========== 7. 浮窗通用 ========== */
/* 右缘 44px 是「书签通道」：事件／规则／归档三段入口常驻此处，任何面板与浮窗都不得覆盖它。
   面板（docked）从 44px 起算宽度；画布让位量＝面板占位＋通道，使面板左缘与画布右缘对齐。 */
/* 右缘面板**只有一套几何与开合**：对话／事件／归档／规则卡／交互规格／卡面全部适用。
   贴右缘、顶栏下起始、从右缘滑入 .28s。不存在「有的弹窗、有的侧栏」两套行为。 */
.float,.dock{position:fixed;top:44px;bottom:0;right:0;max-height:none;
  display:flex;flex-direction:column;background:var(--surface);
  border-left:1px solid var(--stroke);border-radius:0;
  box-shadow:-10px 0 26px rgba(0,0,0,.18);z-index:70;
  transform:translateX(101%);visibility:hidden;
  transition:transform .28s cubic-bezier(.22,.75,.2,1),visibility 0s linear .28s}
.float{width:var(--fw,404px)}
.float.open,.dock.open{transform:translateX(0);visibility:visible;
  transition:transform .28s cubic-bezier(.22,.75,.2,1),visibility 0s}
.float-h{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-bottom:1px solid var(--stroke);flex:none}
.float-h .ft{font-size:var(--fs-head);font-weight:600;color:var(--text)}
.float-h .fsub{font-size:var(--fs-3);color:var(--text3);margin-top:2px}
.float-h .icon{margin-left:auto;width:26px;height:26px;min-width:26px;min-height:26px}
.float-b{flex:1;overflow-y:auto;padding:10px 12px;min-height:0}
.float-f{flex:none;border-top:1px solid var(--stroke);padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:var(--fs-3);color:var(--text3)}
.float-f .btn{margin-left:auto}
/* 对话浮窗 */
.msg{display:flex;flex-direction:column;gap:3px;padding:6px 0;border-bottom:1px dashed var(--stroke)}
.msg:last-child{border-bottom:none}
.msg .mh{font-size:var(--fs-3);color:var(--text3);display:flex;gap:6px}
.msg .mh b{color:var(--text2);font-weight:600}
.msg .mb{font-size:var(--fs-2);color:var(--text);line-height:1.55;white-space:pre-wrap;word-break:break-word}
.chat-input{height:34px;border:1px solid var(--stroke-strong);background:var(--raised);color:var(--text);border-radius:var(--r-card);
  padding:0 10px;flex:1;font-family:inherit;font-size:var(--fs-2)}
.chat-input::placeholder{color:var(--text3)}
.chat-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.chat-foot{display:flex;gap:8px;align-items:center;width:100%}
/* ========== 卡面面板（点铅笔在右侧调起该卡完整卡面） ========== */
/* 身份头部：类型图标＋状态点＋标题大字＋编号/类型/路径 */
.face-id{padding:14px 16px 12px;border-bottom:1px solid var(--stroke);
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface2) 65%,transparent),transparent)}
.face-id-row{display:flex;align-items:center;gap:9px}
.face-id-row .kico{color:var(--kc,var(--text3));display:inline-flex;flex:none}
.face-id-row .dot{width:9px;height:9px;border-radius:50%;background:var(--stc,var(--text3));flex:none}
.face-id[data-state="run"]{--stc:var(--st-run)}
.face-id[data-state="paused"]{--stc:var(--st-paused)}
.face-id[data-state="blocked"]{--stc:var(--st-blocked)}
.face-id[data-state="queued"]{--stc:var(--st-queued)}
.face-id[data-state="complete"]{--stc:var(--st-complete)}
.face-id[data-state="run"] .dot{animation:breathe 2.4s ease-in-out infinite}
.face-id-row input{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--text);background:transparent;
  border:1px solid transparent;border-radius:6px;padding:5px 8px;font-family:inherit}
.face-id-row input:hover{border-color:var(--stroke)}
.face-id-row input:focus{outline:none;border-color:var(--accent);background:var(--raised);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.face-id-meta{font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3);padding:6px 1px 0;letter-spacing:.02em}
/* 内容分区：每块＝标题行（标题 + 编辑 icon）+ 正文（尽量显示足；超出才给「展开全文」） */
.face-sec{padding:12px 16px;border-bottom:1px solid var(--stroke)}
.face-sec .sh{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.face-sec .sh .sn{font-size:12px;font-weight:600;color:var(--text);letter-spacing:.02em}
/* 编辑入口＝一枚 icon（不写「可编辑」这类提示文字） */
.face-sec .sh .editbtn{margin-left:auto;width:26px;height:26px;min-width:26px;min-height:26px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:4px;
  background:none;color:var(--text3);cursor:pointer;padding:0}
.face-sec .sh .editbtn:hover{background:var(--surface2);color:var(--text);border-color:var(--stroke)}
.face-sec .sh .editbtn.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);border-color:var(--accent)}
.ro-tag{font-family:var(--f-mono);font-size:10px;padding:1px 7px;border-radius:10px;margin-left:auto;flex:none;
  color:var(--text3);border:1px solid var(--stroke);background:var(--surface2)}
/* 正文：只读展示，尽量把字显示足（超出的部分可点开全文） */
.face-sec .rb-text{font-size:var(--fs-2);color:var(--text2);line-height:1.65;white-space:pre-wrap;
  word-break:break-word;cursor:default}
.face-sec .rb-text.clamp{max-height:132px;overflow:hidden;position:relative;
  -webkit-mask:linear-gradient(180deg,#000 0,#000 calc(100% - 26px),transparent 100%);
  mask:linear-gradient(180deg,#000 0,#000 calc(100% - 26px),transparent 100%)}
.face-sec .rb-text.openable{cursor:pointer}
.face-sec .rb-text.openable:hover{color:var(--text)}
.face-sec .morebtn{margin-top:6px;display:inline-flex;align-items:center;gap:4px;border:none;background:none;
  color:var(--accent);font-size:var(--fs-3);cursor:pointer;padding:2px 0;font-family:inherit}
.face-sec .morebtn:hover{text-decoration:underline}
.face-sec textarea{width:100%;min-height:74px;resize:vertical;border:1px solid var(--stroke-strong);background:var(--raised);
  color:var(--text);border-radius:var(--r-card);padding:8px 10px;font-family:inherit;font-size:var(--fs-2);line-height:1.6}
.face-sec textarea.req{min-height:120px}
.face-sec textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.face-sec.ro .ro-body{font-size:var(--fs-2);color:var(--text2);line-height:1.6;background:var(--surface2);
  border:1px dashed var(--stroke);border-radius:var(--r-card);padding:9px 11px;white-space:pre-wrap}
/* 全文浮窗：点「展开全文」开，只读展示整块内容 */
.face-full .float-b{white-space:pre-wrap;word-break:break-word;font-size:var(--fs-2);line-height:1.7;color:var(--text2)}
/* 动作区：主操作（保存）突出，状态操作/改模型次之，归档单独危险区 */
.face-acts{display:flex;gap:8px;padding:12px 16px 2px;flex-wrap:wrap}
.face-acts .btn{flex:1;min-width:0;justify-content:center}
.face-acts .btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.face-acts .btn.primary:hover{filter:brightness(1.08)}
.face-acts-danger{padding:10px 16px 14px}
.face-acts-danger .btn.danger{width:100%;border-color:var(--st-blocked);color:var(--st-blocked);
  background:color-mix(in srgb,var(--st-blocked) 8%,transparent)}
.face-acts-danger .btn.danger:hover{background:color-mix(in srgb,var(--st-blocked) 16%,transparent)}
.face-hint{font-size:var(--fs-4);color:var(--text3);padding:0 16px 12px;line-height:1.5}
.face-err{display:none;margin:8px 12px 0;padding:6px 8px;border-radius:var(--r-card);font-size:var(--fs-3);
  color:var(--st-blocked);background:color-mix(in srgb,var(--st-blocked) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--st-blocked) 45%,transparent)}
/* 事件 / 归档 / 规则卡 */
.ev{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--stroke);font-size:var(--fs-2);align-items:baseline}
.ev:last-child{border-bottom:none}
.ev .evt{font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3);flex:none}
.ev .evx{color:var(--text2)}
.ev .evx b{color:var(--text);font-weight:600}
.arc{display:flex;flex-direction:column;gap:5px;padding:9px 0;border-bottom:1px solid var(--stroke)}
.arc .ah{display:flex;align-items:baseline;gap:6px}
.arc .ah b{font-size:var(--fs-2);color:var(--text);font-weight:600}
.arc .am{font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3)}
.arc .aw{font-size:var(--fs-3);color:var(--text2);line-height:1.5}
.arc .af{display:flex;align-items:center;gap:8px}
.arc .inflight{font-family:var(--f-mono);font-size:var(--fs-4);color:var(--st-paused)}
.empty{padding:26px 8px;text-align:center;color:var(--text3);font-size:var(--fs-2);line-height:1.7}
.rule-meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:var(--fs-2);color:var(--text2);margin-bottom:10px}
.rule-meta .k{color:var(--text3)}
.rule-sec{border:1px solid var(--stroke);border-radius:var(--r-card);margin-bottom:8px;overflow:hidden}
.rule-sec .rh{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface2);font-size:var(--fs-2);color:var(--text2)}
.rule-sec .rh .tag{font-family:var(--f-mono);font-size:var(--fs-4);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:3px;padding:0 4px}
.rule-sec .rh .rname{flex:1;color:var(--text)}
.rule-sec .rb{padding:8px 10px;font-size:var(--fs-2);color:var(--text2);line-height:1.6;white-space:pre-wrap}
.rule-sec textarea{width:100%;min-height:90px;background:var(--raised);color:var(--text);border:1px solid var(--accent);
  border-radius:var(--r-card);padding:8px;font-family:var(--f-ui);font-size:var(--fs-2);line-height:1.6;resize:vertical}
/* 右侧面板（300px）：相对视口钉在屏幕右缘「展开进来」，画布让位（书签组跟着面板左缘走）。
   用 fixed 而不是 absolute——absolute 的包含块会被画布收窄带着漂，面板就跑到屏中间去了。 */
/* 300px 侧栏：几何与开合完全继承上面 .float,.dock 那一套，内容按 tab 切换 */
.dock{width:300px}
.dock-tabs{display:flex;gap:2px;padding:6px 10px 0;flex:none;border-bottom:1px solid var(--stroke)}
.dock-tab{flex:1;height:26px;min-height:24px;border:none;background:none;color:var(--text3);cursor:pointer;
  border-radius:5px 5px 0 0;font-family:inherit;font-size:var(--fs-3);border-bottom:2px solid transparent}
.dock-tab:hover{color:var(--text);background:var(--surface2)}
.dock-tab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.dock .float-b{padding:10px 12px}
/* ========== 8. 浮动层：菜单 / 面板 / tooltip / 模型层 ========== */
.pop{position:absolute;display:none;flex-direction:column;background:var(--surface);border:1px solid var(--stroke-strong);
  border-radius:var(--r-panel);box-shadow:var(--shadow-3);z-index:120;min-width:200px;padding:4px}
.pop.open{display:flex}
.pop .ph{display:flex;align-items:center;gap:6px;padding:6px 8px 4px;font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3)}
.pop .pi{display:flex;align-items:center;gap:8px;min-height:28px;padding:0 8px;border:none;background:none;color:var(--text2);
  font-size:var(--fs-2);cursor:pointer;border-radius:4px;text-align:left;width:100%}
.pop .pi:hover{background:var(--surface2);color:var(--text)}
.pop .pi .ic{margin-right:2px;color:var(--text3)}
.pop .pi.on{color:var(--accent)}
.pop .pi .kbd{margin-left:auto;font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3)}
.pop .pdiv{height:1px;background:var(--stroke);margin:4px 2px}
.pop .perr{margin:6px 4px 2px;padding:6px 8px;border:1px solid color-mix(in srgb,var(--st-blocked) 55%,var(--stroke));
  border-radius:var(--r-card);color:var(--st-blocked);font-size:var(--fs-3);line-height:1.5}
.pop .perr b{font-family:var(--f-mono);font-size:var(--fs-4)}
.pop .ph-cur{padding:2px 8px 6px;font-size:var(--fs-3);color:var(--text3)}

/* tooltip */
.tip{position:fixed;z-index:210;display:none;flex-direction:column;gap:6px;min-width:250px;max-width:460px;padding:10px 12px;
  background:var(--surface);border:1px solid var(--stroke-strong);border-radius:var(--r-panel);box-shadow:var(--shadow-3)}
.tip.open{display:flex}
.tip .th{display:flex;align-items:baseline;gap:6px;font-size:var(--fs-2);color:var(--text)}
.tip .th b{font-weight:600}
.tip .th .tid{font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3)}
.tip .th .tst{margin-left:auto;font-size:var(--fs-3);color:var(--text2);display:inline-flex;gap:4px;align-items:center}
.tip .tb{font-size:var(--fs-2);color:var(--text2);line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto}
.tip .tb .who{color:var(--text3);font-size:var(--fs-3);margin-right:4px}
.tip .tb.stream{max-height:22px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tip .tb.stream::after{content:'▌';color:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tip .tf{display:flex;align-items:center;gap:6px;font-size:var(--fs-3);color:var(--text3);border-top:1px solid var(--stroke);padding-top:6px}
.tip .tf .n{margin-left:auto;font-family:var(--f-mono);font-size:var(--fs-4)}
.tip .ti{height:28px;border:1px solid var(--stroke-strong);background:var(--raised);color:var(--text);border-radius:var(--r-card);
  padding:0 8px;flex:1;font-family:inherit;font-size:var(--fs-3)}
.tip .ti:focus{border-color:var(--accent)}
/* 搜索卡：已并入右缘覆盖层（与事件/规则/归档同一套 .float 几何、同一套互斥），不再居中弹出 */
#fxSearch .pin{width:100%;height:40px;border:none;border-bottom:1px solid var(--stroke);background:none;color:var(--text);
  padding:0 12px;font-family:inherit;font-size:var(--fs-body)}
#fxSearch .pin:focus{outline:none}
#fxSearch .plist{overflow-y:auto;padding:4px;max-height:none}
#fxSearch .prow{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 8px;border-radius:var(--r-card);cursor:pointer;font-size:var(--fs-2);color:var(--text2)}
#fxSearch .prow:hover,#fxSearch .prow.sel{background:var(--surface2);color:var(--text)}
#fxSearch .prow .pid{font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3)}
#fxSearch .prow .pth{margin-left:auto;font-size:var(--fs-4);color:var(--text3)}
/* 规格/自检面板 */
.spec{width:var(--fw,470px)}
.spec .sec{border:1px solid var(--stroke);border-radius:var(--r-card);padding:8px 10px;margin-bottom:8px}
.spec .sec h4{font-size:var(--fs-2);color:var(--text);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.spec .sec h4 .tagn{margin-left:auto;font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3)}
.spec table{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text2)}
.spec td,.spec th{padding:2px 4px;border-bottom:1px solid var(--stroke);text-align:left;white-space:nowrap}
.spec th{color:var(--text3);font-weight:500}
.spec .ok{color:var(--st-run)}.spec .bad{color:var(--st-blocked)}
.spec p{font-size:var(--fs-3);color:var(--text3);line-height:1.6;margin:4px 0}
.spec .out{width:100%;min-height:70px;background:var(--raised);border:1px solid var(--stroke);border-radius:var(--r-card);
  color:var(--text2);font-family:var(--f-mono);font-size:var(--fs-4);padding:6px;white-space:pre;overflow:auto}
/* 四态演示 */
.fourstate{position:absolute;left:12px;bottom:56px;width:372px;height:250px;display:none;flex-direction:column;
  background:var(--surface);border:1px solid var(--stroke-strong);border-radius:var(--r-panel);box-shadow:var(--shadow-3);z-index:44}
.fourstate.open{display:flex}
.fs-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--stroke);font-size:var(--fs-2);color:var(--text)}
.fs-h .fs-n{margin-left:auto;font-family:var(--f-mono);font-size:var(--fs-4);color:var(--text3)}
.fs-b{flex:1;padding:12px;display:flex;flex-direction:column;justify-content:center;gap:8px;font-size:var(--fs-2);color:var(--text2);overflow:auto}
.fs-f{display:flex;gap:4px;padding:6px 8px;border-top:1px solid var(--stroke);flex-wrap:wrap}
.fs-f .btn{min-height:24px;font-size:var(--fs-3);padding:0 8px}
.fs-f .btn.on{border-color:var(--accent);color:var(--accent)}
.skel{display:flex;flex-direction:column;gap:6px}
.skel i{display:block;height:10px;border-radius:4px;background:linear-gradient(90deg,var(--surface2),var(--raised),var(--surface2));
  background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.fs-err{font-family:var(--f-mono);font-size:var(--fs-3);color:var(--st-blocked)}
.drop-hint{position:fixed;padding:5px 10px;border-radius:var(--r-card);background:var(--accent);color:var(--on-accent);
  font-size:var(--fs-3);pointer-events:none;z-index:220;display:none;box-shadow:var(--shadow-2)}
.drop-hint.open{display:block}
/* 错误条：操作未执行时必须「看得见」（总纲④ 界面诚实）——底部居中，3.5s 自动收 */
.errmsg{position:absolute;left:50%;bottom:56px;transform:translateX(-50%) translateY(6px);
  display:none;align-items:center;gap:8px;max-width:min(560px,72vw);
  padding:8px 12px;border-radius:var(--r-card);background:var(--surface2);
  border:1px solid var(--st-blocked);color:var(--text);font-size:var(--fs-2);
  box-shadow:var(--shadow-3);z-index:210;opacity:0;transition:opacity var(--t-fast),transform var(--t-fast)}
.errmsg.open{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
.errmsg b{font-family:var(--f-mono);color:var(--st-blocked);font-weight:600}
/* ========== 9. 卡面极简重构（本轮设计轮） ==========
   一张卡只回答三件事：① 是哪张（类型图标 + 状态点 + 标题）
   ② 此刻在跑什么（推流一行，运行中才有）③ 身份与操作（编号 / 模型 / 悬停动作一行）。
   事实行、最近执行体、卡号邻居位、类型文字、顶部色条、类型左条 —— 全部删除。 */
.node::before{content:none}
/* V4 命中热区：卡体**视觉尺寸**随缩放缩小（25% 时约 79×21），但**热区**反向放大到屏上 ≥24×24。
   伪元素在世界坐标下高 = max(100%, 24px / --z)，视觉上完全不可见（无背景无边框），
   只在 far 档接管命中——把「点得到」与「看得见」解耦，不改变任何视觉与能力。
   far 档卡内小控件本就不渲染（R10），所以热区不会盖住任何有独立功能的相邻元素。 */
.node::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:100%;height:max(100%, calc(24px / var(--z, 1)));pointer-events:none;z-index:1}
.world[data-lod="far"] .node::after{pointer-events:auto}
.node .leftbar{display:none}
.n-type,.n-facts,.n-last,.n-toolbar{display:none!important}
.node{gap:6px;padding:10px 12px}
/* 运行中：边缘统一颜色流光旋转（颜色只由状态决定，不表类型） */
.node .flow{display:none;position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.node[data-state="run"] .flow{display:block;overflow:hidden}
.node .flow::before{content:'';position:absolute;left:-50%;top:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg,transparent 0 58%,color-mix(in srgb,var(--st-run) 90%,transparent) 80%,transparent 97%);
  animation:flowspin 3.4s linear infinite}
@keyframes flowspin{to{transform:rotate(360deg)}}
/* 第一行：类型徽标＋状态点＋标题。类型表达借原型 v3 的类型徽标做法（v3 .n-type 度量）：
   字形＝单字符 ◆ Master／◈ Manager／◇ Unit／▦ worker／✓ QA／✎ PM／◱ UI，
   字母＝worker／QA／PM／UI（照原型写法，不改大小写、不另造简称）。
   结构卡：实线框、只给字形；工作卡：虚线框＋工种字母。
   度量抄 v3：font-size 10.5px / letter-spacing .02em / padding 1px 5px / radius 3px。 */
.n-head{display:flex;align-items:center;gap:7px;height:20px;flex:none;min-width:0}
/* 类型徽标＝**照运行中 Agent 左栏列表原样搬**（不是自创字形）：
   一枚 14×14 线性 SVG 图标 ＋ 一枚 9px 彩色文字徽标。
   依据：static/esm/nav_render.js @43-49（SVG_CODER/SVG_UI/SVG_QA/SVG_PM）、@265-340（行结构）；
        static/nav.css @393-402（图标 14px、stroke=currentColor、颜色随类型）；
        static/nav.css @496-545（徽标 9px/行高14/padding 0 4/radius 4/类型色边框＋10% 底）。
   结构卡（master/manager/unit）：沿用本页原图标（冠/分层/方框），**只给图标不给文字**。
   工作卡（worker/UI/QA/PM）：图标 ＋ 文字名。 */
.kbadge{display:inline-flex;align-items:center;gap:5px;flex:none;white-space:nowrap;color:var(--kc,var(--text3))}
.kbadge .ic{width:14px;height:14px;stroke-width:1.5}
.kbadge.k-struct .ic{stroke-width:2}
.kbadge .kb-t{font-size:9px;line-height:14px;padding:0 4px;border-radius:4px;font-weight:400;
  color:var(--kc,var(--text2));letter-spacing:0;font-family:inherit;
  border:1px solid color-mix(in srgb,var(--kc,var(--text3)) 50%,transparent);
  background:color-mix(in srgb,var(--kc,var(--text3)) 10%,transparent)}
/* 工作卡（worker/UI/QA/PM）的卡名＝等宽体 12.5px，
   照 Agent 左栏 .nav-coder/.nav-ui/.nav-qa/.nav-pm 下的 .nav-ctitle 原样（nav.css @500/@513/@527/@538）。 */
.node.is-work .n-head .tt{font-family:var(--f-mono);font-size:12.5px;font-weight:600;letter-spacing:0}
/* far 档只留图标，文字徽标不占位（R10：该档不渲染卡内小控件） */
.world[data-lod="far"] .kbadge .kb-t{display:none}
.n-head .dot{width:7px;height:7px;border-radius:50%;background:var(--stc,var(--text3));flex:none}
.node[data-state="run"] .n-head .dot{animation:breathe 2.4s ease-in-out infinite}
.n-head .tt{font-size:var(--fs-body);font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;min-width:0;flex:1}
.n-head .foldbtn{width:36px;height:36px;min-width:36px;min-height:36px;margin:0 -10px 0 0;padding:0 2px;
  display:inline-flex;align-items:center;justify-content:center;gap:1px;border:none;background:none;
  color:var(--text3);cursor:pointer;border-radius:4px;font-family:var(--f-mono);font-size:9px}
.n-head .foldbtn:hover{color:var(--text);background:var(--surface2)}
.n-head .foldbtn svg{transition:transform var(--t-fast)}
.node.collapsed .n-head .foldbtn:not(.packed) svg{transform:rotate(-90deg)}
/* 完工卡的折叠控件＝**另一种东西**，不是「这张卡有 N 个子卡」的那个箭头。
   语义差别：普通卡的 ▾N 是「这张卡的子卡」（子级）；完工卡的这枚是「整支已打包，
   这些卡不再占画布空间」（同级卡，只是收起来了）。用户口径：别用子卡同款，那会误导人。
   所以做成独立芯片：圆角框＋箱形图标＋张数，不旋转、不是箭头。 */
.n-head .foldbtn.packed{position:relative;height:36px;min-height:36px;min-width:24px;padding:0 6px;gap:3px;
  border:none;background:none;border-radius:0;color:var(--text3);font-size:9px;letter-spacing:.02em}
/* 视觉上是一枚小圆角芯片（20px 高），命中区按 V4 必须 ≥24px——所以按钮本体占 36px，
   芯片外形用 ::before 画在中间。这样 67% 档屏上命中区仍是 36×0.67≈24px。 */
.n-head .foldbtn.packed::before{content:'';position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  height:20px;border:1px solid var(--stroke);background:var(--surface2);border-radius:9px}
.n-head .foldbtn.packed:hover{background:none;color:var(--text)}
.n-head .foldbtn.packed:hover::before{border-color:var(--stroke-strong)}
.n-head .foldbtn.packed svg,.n-head .foldbtn.packed .fc{position:relative;z-index:1}
.n-head .foldbtn.packed svg{transform:none!important;width:11px;height:11px}
.n-head .foldbtn.packed .fc{font-weight:600}
/* 状态：不写任何状态词（用户口径：颜色点足够）。
   run      绿点＋呼吸＋边缘流光
   round-done（一轮结束）蓝点，点开看过就消失（读毕即消，状态留在服务端，界面不再提示）
   done（整卡结束）灰点＋done 记号
   blocked  红点
   paused   琥珀点
   queued   不用点，用三格跳动动图＝排队等待中（不是文字）
   注意：这些档位全部有数据来源（goal_state / live 词），前端不拥有词表，也不自造新状态。 */
.n-head .dot{width:7px;height:7px;border-radius:50%;background:var(--stc,var(--text3));flex:none}
.node[data-state="run"] .n-head .dot{animation:breathe 2.4s ease-in-out infinite}
.node[data-state="queued"] .n-head .dot{display:none}
.node[data-state="round"] .n-head .dot{background:var(--st-round)}
.node[data-state="round"].read .n-head .dot{display:none}
.node[data-state="blocked"] .n-head .dot{background:var(--st-blocked)}
.node[data-state="round"]{--stc:var(--st-round)}
.node[data-state="round"] .qanim{display:none}
/* 排队中动图＝「一列人在闸前一位一位往前挪，走到闸前就停住」。
   原来那套三格上下跳动读起来像音量条／像在跑，不是排队。现在：
   · 三个点排成一条线（队列的形状本身）
   · 每个点：站住等 → 往前挪一格 → 到闸前停住 → 轮到它才离开
   · 右侧一道竖线＝闸（队列等着的那道门）
   不用文字，也不用色点。 */
.n-head .qanim{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:none;align-items:center;gap:3px;height:12px;flex:none;z-index:6;padding-right:6px}
.node[data-state="queued"] .n-head .qanim{display:inline-flex}
.qanim::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:1px;height:9px;background:var(--st-queued);opacity:.5}
.qanim i{width:3px;height:3px;border-radius:50%;background:var(--st-queued);
  animation:qline 1.8s cubic-bezier(.35,0,.25,1) infinite}
.qanim i:nth-child(2){animation-delay:.24s}
.qanim i:nth-child(3){animation-delay:.48s}
@keyframes qline{
  0%{transform:translateX(0);opacity:.22}
  22%{transform:translateX(0);opacity:.8}      /* 站住等——排队的特征 */
  58%{transform:translateX(3px);opacity:1}     /* 往前挪一格 */
  84%{transform:translateX(3px);opacity:.9}    /* 到闸前停住 */
  100%{transform:translateX(3px);opacity:.18}  /* 轮到了，离开队列 */
}
/* 第二行：推流（只有运行中的卡有；高度恒占，避免卡高跳动） */
.n-stream{height:16px;flex:none;overflow:hidden;position:relative;opacity:0;
  transition:opacity var(--t-fast);
  -webkit-mask:linear-gradient(90deg,transparent,#000 8px,#000 calc(100% - 14px),transparent);
  mask:linear-gradient(90deg,transparent,#000 8px,#000 calc(100% - 14px),transparent)}
.node[data-state="run"] .n-stream{opacity:1}
.n-stream .sw{display:inline-flex;white-space:nowrap;animation:marq 15s linear infinite;will-change:transform}
.n-stream .sx{padding-right:44px;font-family:var(--f-mono);font-size:9.5px;color:var(--text3);letter-spacing:.01em}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-56%)}}
/* 第三行：卡号 · 模型 · 悬停动作（同一行） */
.n-meta{display:flex;align-items:center;gap:6px;height:24px;flex:none;margin-top:auto;min-width:0}
.n-meta .archcode{font-family:var(--f-mono);font-size:9.5px;color:var(--text3);flex:none;letter-spacing:.02em;margin-left:0}
.n-meta .modb{margin:0;padding:0 5px;height:24px;min-width:24px;max-width:168px;display:inline-flex;align-items:center;gap:4px;
  border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;
  font-family:var(--f-mono);font-size:9.5px;color:var(--text3);overflow:hidden;white-space:nowrap}
.n-meta .modb .ic{opacity:.75;flex:none}
.n-meta .modb .mtx{overflow:hidden;text-overflow:ellipsis}
.n-meta .modb:hover{background:var(--surface2);color:var(--text);border-color:var(--stroke)}
.n-meta .modb:hover .ic{opacity:1}
.n-meta .modb.ov{color:var(--accent)}
.n-meta .acts{margin-left:auto;display:inline-flex;gap:2px;flex:none;opacity:0;pointer-events:none;
  transition:opacity var(--t-fast)}
.node:hover .n-meta .acts,.node:focus-within .n-meta .acts{opacity:1;pointer-events:auto}
/* 已暂停的卡：不用悬停，继续（播放）钮常显——暂停是「等人点」的状态，不该藏起来 */
.node[data-state="paused"] .n-meta .acts{opacity:1;pointer-events:auto}
.n-meta .acts button{width:24px;height:24px;min-width:24px;min-height:24px;display:inline-flex;align-items:center;
  justify-content:center;border:none;background:none;border-radius:4px;color:var(--text3);cursor:pointer;padding:0}
.n-meta .acts button:hover{background:var(--surface2);color:var(--text)}
/* LOD（按用户口径重定，阈值 75% / 88%）：
   <75% 只留「状态点＋标题」——标题放大、推流不上屏、折叠只留箭头 icon（不写数字）；
   75%~88% 加流式与折叠数字（数字放大）；≥88%（full）才露出底部行（卡号／模型／动作）。 */
.world[data-lod="far"] .n-meta,.world[data-lod="near"] .n-meta{display:none}
.world[data-lod="far"] .node,.world[data-lod="near"] .node,.world[data-lod="full"] .node{justify-content:center}
/* R10 far 档：受阻/暂停/排队 用左侧 3px 色条区分（顶部色条已整体删除） */
.world[data-lod="far"] .node[data-state="blocked"],
.world[data-lod="far"] .node[data-state="paused"],
.world[data-lod="far"] .node[data-state="queued"]{box-shadow:inset 3px 0 0 var(--stc),var(--shadow-1)}
/* <75%：只状态点＋标题，标题放大到 16px；流式不上屏；折叠只留 icon */
.world[data-lod="far"] .n-head .tt{font-size:16px}
/* 工作卡在 far 档同样放大到 16px（等宽体在 12.5px 下缩到 67% 就糊了），
   用更高特异度写死，避免与上面的等宽体规则打架时谁后谁赢。 */
.world[data-lod="far"] .node.is-work .n-head .tt{font-size:16px}
.world[data-lod="far"] .n-stream{display:none}
.world[data-lod="far"] .n-head .foldbtn{display:inline-flex;font-size:0}
.world[data-lod="far"] .n-head .foldbtn .fc{display:none}
.world[data-lod="far"] .n-head .foldbtn svg{width:16px;height:16px}
/* ≥75%：折叠数字放大（9px → 12px mono） */
.world[data-lod="near"] .n-head .foldbtn .fc,.world[data-lod="full"] .n-head .foldbtn .fc{font-size:12px;font-weight:600}
.world[data-lod="far"] .n-meta .modb,.world[data-lod="near"] .n-meta .modb{pointer-events:none}
/* ========== 10. 减动效 ========== */
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
  .skel i{background:var(--surface2)}
}

   · **不碰内容**：对话/事件/归档/规则/规格/卡面的内容渲染由外部 setRenderer 注入。
   · 所有右侧面板共用一套几何（CSS .float,.dock）：贴右缘、滑入 .28s、同一互斥规则。
   · 宽度只有一个来源（WIDTH 表），书签位置只有一个来源（--paneW，CSS 过渡驱动）——
     不再有第二份内联 right、不再有「先测一遍再补一遍」的多次写入（那是按钮飘的根因）。 */
var Overlay = (function () {
  /* 右缘浮窗统一一个宽度：事件／规则卡／归档／搜索 全部 404px（用户口径：三个窗口宽度不要略有不同）。
     R22 里事件 432 与其余 404 的差异按用户当面裁定收敛为 404。侧栏（交互规格）是侧栏不是浮窗，按 R3 保持 300。 */
  var WIDTH = {chat:392, archive:404, events:404, face:420, rule:404, search:404, spec:300};
  var CHANNEL = 52;                    // 右缘书签通道（书签组 36 + 左右留白）
  var DOCK_KINDS = {spec:1};           // 只有交互规格是贴边侧栏（dock）
  var cur = {kind:null, id:null};
  var renderer = {};
  var unreadEvents = 0;

  function elOf(kind) {
    if (DOCK_KINDS[kind]) return document.getElementById('ruleDock');
    return document.getElementById('fx' + kind.charAt(0).toUpperCase() + kind.slice(1));
  }
  function paneWidth() { return cur.kind ? (WIDTH[cur.kind] || 404) : 0; }

  /* 唯一的让位与书签定位来源：写一次 CSS 变量，过渡由 CSS 做。
     画布内容同时左移半个面板宽（用户要求：面板展开时画布跟着一起左移，缩放不变）——
     位移量按「本次宽度差/2」算，开关来回自然抵消，不需要任何 setTimeout 补算。 */
  var lastW = 0;
  function applyGeometry() {
    var w = paneWidth();
    document.documentElement.style.setProperty('--paneW', w + 'px');
    if (typeof App === 'undefined' || !App.els || !App.els.canvas) return;
    App.els.canvas.style.right = (w + CHANNEL) + 'px';
    var d = w - lastW; lastW = w;
    if (d !== 0 && App.state) {
      App.state = Object.assign({}, App.state, {tx: App.state.tx - d / 2});
      App.layout(); App.renderAll(false); App.applyView(false);
    }
  }
  function sync() {
    /* 普通浮窗逐个对应一个元素 */
    ['chat', 'archive', 'events', 'face', 'rule', 'search'].forEach(function (k) {
      var n = elOf(k); if (!n) return;
      var on = (cur.kind === k);
      n.classList.toggle('open', on);
      n.classList.toggle('docked', on);
      n.style.visibility = on ? 'visible' : 'hidden';
      n.style.transform = on ? 'translateX(0)' : 'translateX(101%)';
    });
    /* 侧栏是**一个**元素、两个 tab：只能按「当前是否是任一 dock kind」判一次。
       逐个 kind 循环会让 rule 与 spec 互相把 open 摘掉——那正是规则侧栏打不开的根因。 */
    var dockEl = document.getElementById('ruleDock');
    if (dockEl) {
      var onDock = !!(cur.kind && DOCK_KINDS[cur.kind]);
      dockEl.classList.toggle('open', onDock);
      dockEl.classList.toggle('docked', onDock);
      dockEl.style.visibility = onDock ? 'visible' : 'hidden';
      dockEl.style.transform = onDock ? 'translateX(0)' : 'translateX(101%)';
    }
    var be = document.getElementById('bmEvents');
    if (be) {
      be.classList.toggle('on', cur.kind === 'events');
      be.classList.toggle('hasnew', unreadEvents > 0);
      var badge = be.querySelector('.bm-badge');
      if (badge) badge.textContent = String(unreadEvents);
    }
    var br = document.getElementById('bmRule');
    if (br) br.classList.toggle('on', cur.kind === 'rule');
    var ba = document.getElementById('bmArchive');
    if (ba) ba.classList.toggle('on', cur.kind === 'archive');
    var bs = document.getElementById('bmSearch');
    if (bs) bs.classList.toggle('on', cur.kind === 'search');
    Array.prototype.forEach.call(document.querySelectorAll('#ruleDock .dock-tab'), function (b) {
      var on = (cur.kind === b.dataset.dock);
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }
  function open(kind, id) {
    cur.kind = kind; cur.id = (id == null ? null : id);
    if (kind === 'events') unreadEvents = 0;
    applyGeometry(); sync();
    if (renderer[kind]) renderer[kind](cur.id);
  }
  function close() {
    if (!cur.kind) { sync(); return; }
    cur.kind = null; cur.id = null;
    applyGeometry(); sync();
  }
  function toggle(kind, id) {
    if (cur.kind === kind && (id == null || id === cur.id)) { close(); return false; }
    open(kind, id); return true;
  }
  function noteEvent() { if (cur.kind !== 'events') { unreadEvents++; sync(); } }

  return {
    init: function () { applyGeometry(); sync(); },
    open: open, close: close, toggle: toggle, sync: sync, noteEvent: noteEvent,
    setRenderer: function (map) { Object.keys(map).forEach(function (k) { renderer[k] = map[k]; }); },
    widthOf: function (k) { return WIDTH[k] || 0; },
    get kind() { return cur.kind; }, get id() { return cur.id; },
    get paneWidth() { return paneWidth(); }, get unread() { return unreadEvents; }
  };
})();

/* ================= 模块：RailView（左栏树） =================
   与画布彻底脱钩，边界写在这里：
   · 只读 state 快照渲染左栏；不调用 App 的 layout / syncNodes / drawWires / renderChrome
   · 折叠只发一条 collapsed_set 增量；画布自己按同一份 state 重算，本模块不碰画布任何像素
   · 展开/收起是本模块自己的状态机（.rail.open），不依赖 CSS :hover 的隐式继承链，
     默认收起——不会出现"常驻展开" */
var RailView = (function () {
  var rail = null, host = null, countEl = null, sig = '', open = false, hideT = null;

  function sync(S) {
    if (!host || !S) return;
    var html = '';
    (function walk(id, d) {
      var c = S.cards[id]; if (!c || c.archived) return;
      var kids = StateLayer.childrenOf(S, id);
      var t = StateLayer.typeOf(S, id);
      var folded = !!S.collapsed[id];
      var stTok = (c.state === 'round' ? 'round' : c.state);
      html += '<div class="tree-row d' + Math.min(2, d) + (folded ? ' folded' : '') + '" data-id="' + id + '" role="button" tabindex="0">' +
        (kids.length
          ? '<button class="fold" data-fold="' + id + '" aria-label="' + (folded ? '展开' : '折叠') + '" title="' + (folded ? '展开' : '折叠') + '该支 · ' + kids.length + ' 张直接子卡">' + App.icon('chevron', 'ic-14') + '</button>'
          : '<span class="fold" style="visibility:hidden"></span>') +
        '<span class="kbadge' + (App.STRUCT_KINDS.indexOf(t) >= 0 ? ' k-struct' : '') + '" style="--kc:var(--k-' + (t === 'qa_card' ? 'qa' : t === 'pm_card' ? 'pm' : t) + ')" title="' + App.TYPE_NAME[t] + '">' + App.kbadgeHtml(t) + '</span>' +
        '<span class="d" style="background:var(--st-' + (stTok || 'done') + ')"></span>' +
        '<span class="t">' + c.title + '</span></div>';
      if (!folded) kids.forEach(function (k) { walk(k, d + 1); });
    })('card_001', 0);
    if (html !== sig) { sig = html; host.innerHTML = html; }
    if (countEl) {
      var n = S.order.filter(function (k) { return S.cards[k] && !S.cards[k].archived; }).length;
      countEl.textContent = String(n);
    }
  }

  function expand(v) {
    open = !!v;
    if (rail) rail.classList.toggle('open', open);
  }

  function bind() {
    if (!rail) return;
    rail.addEventListener('mouseenter', function () { clearTimeout(hideT); expand(true); });
    rail.addEventListener('mouseleave', function () {
      clearTimeout(hideT);
      hideT = setTimeout(function () { expand(false); }, 160);
    });
    /* 左栏自己的点击：折叠该支 / 定位该卡。不借用画布的 stage 委托。 */
    rail.addEventListener('click', function (e) {
      var fold = e.target.closest('[data-fold]');
      if (fold) {
        e.preventDefault(); e.stopPropagation();
        App.dispatch({ type: 'collapsed_set', id: fold.dataset.fold, value: !App.state.collapsed[fold.dataset.fold] }, true);
        return;
      }
      var row = e.target.closest('.tree-row');
      if (row) App.locate(row.dataset.id, true);
    });
  }

  function init() {
    rail = document.getElementById('rail');
    host = document.getElementById('treeHost');
    countEl = document.getElementById('treeCount');
    bind();
    expand(false);
    if (App.state) sync(App.state);
  }

  return { init: init, sync: sync, expand: expand, isOpen: function () { return open; } };
})();
</script>
<script>
"use strict";
/* ========== 12. i18n：中文 / English 两套文案 ==========
   语言中立的东西（卡号、模型名、状态 token、类型名）不翻译；只有界面文案随语言切换。
   状态一律用英文 token（run/done/blocked/paused/queued），不随语言变——服务端 display_word 原文
   另在 tooltip 与卡面详情按服务端口径呈现，前端不改写（R9）。 */
var I18N = {
  zh: {
    projectTree:'项目树', overview:'全景', cards:'卡', running:'运行中', blocked:'受阻',
    archived:'已归档', zoom:'缩放', search:'搜索卡（⌘K）', more:'更多', theme:'切换主题',

    fullText:'全文', searchCards:'搜索卡', emptyEvents:'还没有事件。归档 / 改名 / 模型切换都会在这里留一条。',
    noArchive:'暂无归档记录。', chatCount:'共', send:'发送', reply:'就地回复（Enter 发送）',
    collapse:'折叠', expand:'展开', kids:'张直接子卡', lineParent:'仅父子', lineAll:'全部', lineNone:'隐藏',
    loading:'加载', empty:'空', error:'错误', denied:'无权限', normal:'正常',
    fourState:'画布覆盖层 · 四态演示', openFour:'打开四态演示', langName:'EN', done:'done',
    packLabel:'张已完成', packTitle:'{n} 张同级的已完成卡合成一束（省画布空间）· 点开散回画布', packTitleOpen:'{n} 张同级完工卡已散开 · 点这里重新归拢成一束'
  },
  en: {
    projectTree:'Project tree', overview:'Overview', cards:'cards', running:'running', blocked:'blocked',
    archived:'archived', zoom:'Zoom', search:'Search cards (⌘K)', more:'More', theme:'Toggle theme',
    events:'Events', rule:'Rule card', bmRule:'Rule', archive:'Archive', model:'Model', expandAll:'Expand all',
    collapseAll:'Collapse all', tidy:'Tidy layout', ruleView:'Rule card · view / edit',
    archiveDone:'Archive · collapse finished',
    spec:'Interaction spec', lines:'Connections', chat:'Chat', backToCanvas:'Back to canvas',
    face:'Card', mission:'Mission', objective:'Objective', status:'Status', requirements:'Requirements',
    readOnly:'read-only', edit:'Edit', save:'Save changes', changeModel:'Change model', expandFull:'Expand full text',
    stop:'Stop', resume:'Resume', intervene:'Intervene', archiveWhole:'Archive subtree', onlyRead:'Read-only',
    fullText:'Full text', searchCards:'Search cards',
    emptyEvents:'No events yet. Archive / rename / model changes land here.',
    noArchive:'No archived records.', chatCount:'Total', send:'Send', reply:'Reply here (Enter to send)',
    collapse:'Collapse', expand:'Expand', kids:'direct child cards',
    lineParent:'Parent only', lineAll:'All', lineNone:'Hidden',
    loading:'Loading', empty:'Empty', error:'Error', denied:'No permission', normal:'Normal',
    fourState:'Canvas overlay · four states', openFour:'Open four-state demo', langName:'中文', done:'done',
    packLabel:'finished', packTitle:'{n} finished sibling cards packed into one bundle (saves canvas space) · click to spread', packTitleOpen:'{n} finished siblings spread · click to pack again'
  }
};
var LANG = 'zh';
function t(k) { return (I18N[LANG] && I18N[LANG][k]) || (I18N.zh[k] || k); }
function setLang(l) {
  LANG = (l === 'en') ? 'en' : 'zh';
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.body.classList.toggle('lang-en', LANG === 'en');
  applyI18n();
  if (window.Interact && Interact.retranslate) Interact.retranslate();
  if (window.App && App.langChanged) App.langChanged();
  var lb = document.getElementById('btnLang');
  if (lb) lb.textContent = t('langName');
}
/* 静态文案节点：data-i18n 指定 key，data-i18n-attr 指定要替换的属性（否则替换 textContent） */
function applyI18n() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (n) {
    var key = n.getAttribute('data-i18n'), v = I18N[LANG][key];
    if (v == null) return;
    var attr = n.getAttribute('data-i18n-attr');
    if (attr) n.setAttribute(attr, v); else n.textContent = v;
  });
}

<script>
"use strict";
/* ---------------- 交互层 ---------------- */
var Interact = (function () {
  var els = {}, FW = {chat:392, archive:404, rule:404, events:404, search:404, spec:300, face:420};
  var openKind = null, chatCardId = null, evUnread = 0, dockOpen = false, dockKind = null, dockW = 0;
  var tipId = null, tipT = null, tipH = null, tipPinned = false;
  var pendingFold = null, foldJustFired = null, suppress = 0, dragState = null, palOpen = false, fsMode = 'normal';
  /* 与 App.STRUCT_KINDS 同义：结构卡徽标只给字形、不写名字 */
  var STRUCT_KINDS = ['master', 'manager', 'unit'];
  var ruleEditing = null, lineCounts = {parent:0, comm:0, rel:0}, meteors = [];
  var faceCardId = null;
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function $(s) { return document.querySelector(s); }
  function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function nowStr() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function fullNow() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + ' ' + nowStr(); }
  function rp() { return dockOpen ? dockW : 0; }
  function logEvent(kind, text) {
    App.dispatch({type:'event_added', ev:{t:nowStr(), kind:kind, text:text}});
    /* 未读数归 Overlay 记账（它是书签角标的唯一负责人） */
    if (typeof Overlay !== 'undefined') Overlay.noteEvent(); else if (openKind !== 'events') evUnread++;
    renderEvents(); syncBm();
  }
  function placePop(pop, anchor, width) {
    var r = anchor.getBoundingClientRect();
    pop.style.minWidth = (width || 200) + 'px';
    /* 仅为测量临时显形；测量完立刻回落到 CSS 控制，可见性只由 .open 类决定 */
    pop.style.display = 'flex';
    var w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.display = '';
    var left = Math.min(r.left, window.innerWidth - w - 8);
    var top = r.bottom + 6;
    if (top + h > window.innerHeight - 52) top = Math.max(48, r.top - h - 6);
    pop.style.left = Math.max(8, left) + 'px';
    pop.style.top = top + 'px';
  }

  /* ---------- 覆盖层开合（互斥） ---------- */
  /* 书签组跟着当前打开的面板左缘走：不靠「猜面板宽度」，也不用 CSS 变量继承链，
     直接把面板真实 rect 换算成 .bm 的 right（内联，最可靠）。 */
  /* 书签位置只有一个来源：Overlay 写的 --paneW（CSS 过渡统一驱动）。
     本模块不再自己测量、不再写第二份内联 right——那正是「按钮飘、先后」的根因。 */
  function shiftBm() { if (typeof Overlay !== 'undefined') Overlay.sync(); }
  function syncBm() { if (typeof Overlay !== 'undefined') Overlay.sync(); }
  /* 关闭全部右侧面板：容器生命周期归 Overlay，本模块只顺带关掉菜单 / 命令面板 / 全文窗 */
  function closeAll() {
    var ff = document.getElementById('fxFull');
    if (ff) ff.classList.remove('open');           // 全文窗是本模块的内部件，不归 Overlay
    closeMenus(); closePalette();
    if (typeof Overlay !== 'undefined') Overlay.close();
    openKind = null; dockOpen = false; dockKind = null; dockW = 0;
    App.renderChrome();
  }
  /* 读毕即消：round-done 蓝点表示「这一轮跑完了、你还没看」。
     打开过这张卡（对话浮窗或卡面详情）即视为看过，界面上的蓝点消失（read 本地标记）。
     服务端状态不受影响——这只是一个「已读」提示，不是状态改写。 */
  var readIds = {};
  function markRead(id) {
    if (!id || readIds[id]) return;
    readIds[id] = 1;
    var el = App.nodeEls[id];
    if (el && el.dataset.state === 'round') el.classList.add('read');
  }
  /* 打开/切换右侧面板：几何、宽度、互斥、书签跟随全归 Overlay；
     本模块只登记「当前在谁身上」，内容渲染通过 setRenderer 注册给 Overlay。 */
  function openFloat(kind, id) {
    if (kind === 'spec') { toggleDock('spec'); return; }
    var same = (openKind === kind && (!id || (kind === 'chat' ? id === chatCardId : id === faceCardId)));
    if (same) { closeAll(); return; }
    closeAll();
    openKind = kind;
    if (kind === 'chat') chatCardId = id;
    if (kind === 'face') faceCardId = id;
    if (kind === 'chat' || kind === 'face') markRead(id);
    if (kind === 'events') evUnread = 0;
    if (typeof Overlay !== 'undefined') Overlay.open(kind, id);
    App.renderChrome();
  }
  /* 300px 贴边侧栏＝交互规格面板（正稿 R3）。规则卡已改为 404px 浮窗（R20/R22），不再走这里。
     与浮窗共用 Overlay 的几何与互斥，本函数只负责「开哪个、装什么内容」。 */
  function setPanelDock(kind, open, width) {
    if (!open) {
      dockOpen = false; dockKind = null; dockW = 0;
      if (typeof Overlay !== 'undefined') Overlay.close();
      App.renderChrome();
      return;
    }
    if (dockOpen && dockKind === kind) return;
    closeAll();
    dockOpen = true; dockKind = 'spec'; dockW = 300;
    if (typeof Overlay !== 'undefined') Overlay.open('spec');
    if (window.SelfCheck) window.SelfCheck.render();
    App.renderChrome();
  }
  function setDock(open) {
    if (open) closeAll();
    setPanelDock('spec', open, 300);
  }
  /* 侧栏开关：同一块内容再点一次就收起 */
  function toggleDock(kind) {
    if (dockOpen && dockKind === kind) { setPanelDock(kind, false, 300); return; }
    closeAll();
    setPanelDock(kind, true, 300);
    syncBm();
  }
  /* 入口（书签／更多菜单／tab）一律「只开不 toggle」：
     入口的语义是「打开这块内容」，不是开关。关闭走面板自己的 ✕ 或 Esc——
     这样即使同一坐标收到重复的 click，结果也只能是「开着」，不会自我抵消。 */
  function openDock(kind) {
    if (dockOpen && dockKind === kind) return;
    closeAll();
    setPanelDock(kind, true, 300);
    syncBm();
  }
  function openPane(kind, id) {
    if (Overlay && Overlay.kind === kind && (id == null || Overlay.id === id)) return;
    openFloat(kind, id);
  }
  /* 卡面编辑：右侧调起该卡完整卡面（使命只读，标题/目标/现状/需求文档可改）——几何归 Overlay */
  function openFace(id) {
    try {
      var wasOpen = (openKind === 'face' && faceCardId === id);
      if (wasOpen) { closeAll(); return; }
      closeAll();
      openKind = 'face'; faceCardId = id;
      markRead(id);
      if (typeof Overlay !== 'undefined') Overlay.open('face', id);
      App.renderChrome();
    } catch (e) {
      /* 出错落进面板内可见错误区，不静默（总纲④） */
      showCardErr({ok:false, status:500, code:'open_face_failed: ' + (e && e.message ? e.message : String(e))});
    }
  }

  /* ---------- 各浮窗内容 ---------- */
  function renderChat() {
    var S = App.state, c = S.cards[chatCardId]; if (!c) return;
    $('#chatTitle').textContent = c.title;
    $('#chatSub').textContent = c.id + ' · ' + App.wordOf(c) + ' · ' + App.pathOf(c.id);
    $('#chatBody').innerHTML = c.chat.map(function (m) {
      return '<div class="msg"><div class="mh"><b>' + m.who + '</b><span>' + m.time + '</span></div><div class="mb">' + m.text + '</div></div>';
    }).join('');
    $('#chatFootNote').textContent = '共 ' + c.chat.length + ' 条';
  }
  function renderEvents() {
    var S = App.state;
    $('#eventBody').innerHTML = S.events.length ? S.events.map(function (e) {
      return '<div class="ev"><span class="evt">' + e.t + '</span><span class="evx"><b>' + e.kind + '</b> ' + e.text + '</span></div>';

  /* ---------- 对话发送 + 流星 ---------- */

  /* ---------- tooltip ---------- */
  function renderTip() {
    var S = App.state, c = S.cards[tipId]; if (!c) return;
    var streaming = !!c.streaming && c.state === 'run';
    var t = document.getElementById('tip');
    t.innerHTML = '<div class="th"><b>' + c.title + '</b><span class="tid">' + c.id + '</span>' +
      '<span class="tst">' + (streaming ? '<span style="color:var(--accent)">输出中</span> · ' : '') + App.wordOf(c) + '</span></div>' +
      '<div class="tb' + (streaming ? ' stream' : '') + '"><span class="who">' + c.recent.who + ' · ' + c.recent.time + '</span>' + c.recent.text + '</div>' +
      (c.lifecycle === 'completed' ? '<div class="tb" style="color:var(--text3);font-size:var(--fs-3)">非 active · 原因码 lifecycle=completed</div>' : '') +
      '<div class="tf"><input class="ti" id="tipInput" placeholder="就地回复（Enter 发送）" aria-label="就地回复"><span class="n">共显示 1 条</span></div>';
    t.classList.add('open');
    var input = document.getElementById('tipInput');
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { sendToCard(tipId, input.value); input.value = ''; renderTip(); }
      e.stopPropagation();
    });
    input.addEventListener('focus', function () { tipPinned = true; });
    input.addEventListener('blur', function () { tipPinned = false; });
    t.addEventListener('mouseenter', function () { clearTimeout(tipH); });
    t.addEventListener('mouseleave', function () { scheduleHideTip(); });
    positionTip();
  }
  function positionTip() {
    var t = document.getElementById('tip'), el = App.nodeEls[tipId]; if (!el) return;
    var r = el.getBoundingClientRect();
    var w = t.offsetWidth, h = t.offsetHeight;
    var left = r.right + 12, top = r.top - 6;
    if (left + w > window.innerWidth - 12) left = Math.max(12, r.left - w - 12);
    top = Math.max(52, Math.min(window.innerHeight - h - 56, top));
    t.style.left = left + 'px'; t.style.top = top + 'px';
  }
  function scheduleHideTip() {
    clearTimeout(tipH);
    tipH = setTimeout(function () {
      if (tipPinned) return;
      document.getElementById('tip').classList.remove('open'); tipId = null;
    }, 150);
  }
  function closeTip() { clearTimeout(tipT); clearTimeout(tipH); document.getElementById('tip').classList.remove('open'); tipId = null; }

  /* ---------- 菜单（模型浮层 / 更多菜单） ---------- */
  function closeMenus() {
    /* 必须同时清内联 display——placePop 为测量写过 style.display='flex'，
       内联样式优先级高于 .pop{display:none}，只去 open 类会导致「类没了、像素还在」（关不掉）。 */
    ['modelPop', 'moreMenu'].forEach(function (id) {
      var el = document.getElementById(id);
      el.classList.remove('open');
      el.style.display = '';
    });
  }
  /* 卡面面板的动作按钮：按卡当前状态呈现其一（契约 §5.2 的 stop／resume／intervene） */
  /* 状态操作＝契约 §5.2 的真实操作：运行中/排队 → 停止；已暂停/受阻 → 恢复；其余 → 介入。
     标签随界面语言走（动作名是界面文案），但动作本身与失败码来自契约。 */
  function opItem(c) {
    /* 已完工的卡没有「可停的活」：不呈现停止/恢复/介入（它的出口是查看与归档） */
    if (c.lifecycle === 'completed' || c.state === 'done') return null;
    if (c.state === 'run' || c.state === 'queued') return {label:t('stop'), icon:'stop', act:'stop', hint:'§5.2 · stop'};
    if (c.state === 'paused') return {label:t('resume'), icon:'resume', act:'resume', hint:'§5.2 · resume'};
    /* 受阻及其它 active 态：走「介入」（人工处理阻塞，§5.2 intervene） */
    return {label:t('intervene'), icon:'intervene', act:'intervene', hint:'§5.2 · intervene'};
  }

  /* ---------- 拖拽改归属 ---------- */
  function onDown(e) {
    /* R12 写死：pointerType==='touch' 的 pointerdown 一律不进拖拽/平移分支
       （单指触屏留给点卡片/按钮；触屏平移走 bindTouch 的双指分支）。 */
    if (e.pointerType === 'touch') return;
    if (e.button !== 0) return;
    var node = e.target.closest('.node');
    if (node && !e.target.closest('button')) {
      var id = node.dataset.id;
      if (!App.state.cards[id].parent) { dragState = null; return; }
      dragState = {mode:'cand', id:id, sx:e.clientX, sy:e.clientY, moved:false};
      return;
    }
    if (!node && (e.target.closest('#canvas') || e.target.id === 'canvas')) {
      dragState = {mode:'pan', sx:e.clientX, sy:e.clientY, tx0:App.state.tx, ty0:App.state.ty};
      App.els.canvas.classList.add('panning');
    }
  }
  function onMove(e) {
    if (!dragState) return;
    var dx = e.clientX - dragState.sx, dy = e.clientY - dragState.sy;
    if (dragState.mode === 'pan') {
      App.state = Object.assign({}, App.state, {tx: dragState.tx0 + dx, ty: dragState.ty0 + dy});
      App.applyView(false);
      return;
    }
    if (!dragState.moved) {
      if (Math.abs(dx) + Math.abs(dy) < 6) return;
      dragState.moved = true; suppress = Date.now() + 320;
      closeAll(); closeTip(); closeMenus();
      var el = App.nodeEls[dragState.id];
      el.classList.add('dragging');
      StateLayer.subtree(App.state, dragState.id).forEach(function (k) {
        if (k !== dragState.id && App.nodeEls[k]) App.nodeEls[k].classList.add('dimmed');
      });
    }
    var el2 = App.nodeEls[dragState.id];
    el2.style.transform = 'translate(' + (dx / App.state.scale) + 'px,' + (dy / App.state.scale) + 'px)';
    var under = document.elementFromPoint(e.clientX, e.clientY);
    var tgt = under && under.closest ? under.closest('.node') : null;
    $$('.node').forEach(function (n) { n.classList.remove('drag-target', 'drag-reject'); });
    var hint = document.getElementById('dropHint');
    if (tgt && tgt.dataset.id !== dragState.id) {
      var isDesc = StateLayer.subtree(App.state, dragState.id).indexOf(tgt.dataset.id) >= 0;
      tgt.classList.add(isDesc ? 'drag-reject' : 'drag-target');

      hint.classList.add('open');
      hint.style.left = (e.clientX + 14) + 'px'; hint.style.top = (e.clientY + 14) + 'px';
      dragState.target = isDesc ? null : tgt.dataset.id;
      dragState.reject = !!isDesc;
    } else { hint.classList.remove('open'); dragState.target = null; dragState.reject = false; }
  }
  function onUp() {
    document.getElementById('dropHint').classList.remove('open');
    if (!dragState) return;

    App.els.canvas.classList.remove('panning');

    $$('.node').forEach(function (n) { n.classList.remove('drag-target', 'drag-reject'); });

      if (!pf.ok) { el.style.transform = ''; alertErr('归属变更未执行', pf); return; }
      App.dispatch({type:'card_reparented', id:st.id, parent:st.target});
