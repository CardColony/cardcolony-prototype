  /* ---------- 手势 ---------- */
  function onWheel(e) {
    e.preventDefault();
    closeTip();
    var k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 100 : 1;
    var r = App.els.canvas.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) {
      /* R12：Ctrl/⌘+滚轮＝零过渡缩放（手势永不过渡） */
      App.zoomAt(e.deltaY < 0 ? 1.12 : 0.89, e.clientX - r.left, e.clientY - r.top, false);
    } else {
      var dx = e.shiftKey ? e.deltaY : e.deltaX, dy = e.shiftKey ? 0 : e.deltaY;
      App.state = Object.assign({}, App.state, {tx: App.state.tx - dx * k, ty: App.state.ty - dy * k});
      App.applyView(false);
    }
    closeMenus();
  }
  function bindTouch() {
    var last = null;
    function dist(a, b) { return Math.sqrt(Math.pow(a.clientX - b.clientX, 2) + Math.pow(a.clientY - b.clientY, 2)); }
    App.els.canvas.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) {
        last = {x:(e.touches[0].clientX + e.touches[1].clientX) / 2, y:(e.touches[0].clientY + e.touches[1].clientY) / 2,
          d:dist(e.touches[0], e.touches[1]), tx:App.state.tx, ty:App.state.ty};
      }
    }, {passive:true});
    App.els.canvas.addEventListener('touchmove', function (e) {
      if (e.touches.length === 2 && last) {
        var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2, my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        var d2 = dist(e.touches[0], e.touches[1]);
        /* 双指：捏合缩放（绕双指中点，手势永不过渡）＋中点平移 */
        if (d2 > 0 && last.d > 0 && Math.abs(d2 / last.d - 1) > 0.02) {
          var r = App.els.canvas.getBoundingClientRect();
          App.zoomAt(d2 / last.d, mx - r.left, my - r.top, false);
        }
        App.state = Object.assign({}, App.state, {tx: App.state.tx + (mx - last.x), ty: App.state.ty + (my - last.y)});
        App.applyView(false);
        last.x = mx; last.y = my; last.d = d2;
      }
    }, {passive:true});
    App.els.canvas.addEventListener('touchend', function (e) { if (e.touches.length < 2) { last = null; } }, {passive:true});
  }

  /* ---------- 流星（三类线：通信线的传递语义） ---------- */
  function bezier(a, b, t) {
    var x1 = a.x + 145, y1 = a.y + 84, x2 = b.x + 145, y2 = b.y, my = (y1 + y2) / 2;
    var c1x = x1, c1y = my, c2x = x2, c2y = my;
    var u = 1 - t;
    return {x: u*u*u*x1 + 3*u*u*t*c1x + 3*u*t*t*c2x + t*t*t*x2,
            y: u*u*u*y1 + 3*u*u*t*c1y + 3*u*t*t*c2y + t*t*t*y2};
  }
  function meteor(aId, bId) {
    var a = App.posOf(aId), b = App.posOf(bId); if (!a || !b) return;
    if (App.reduced()) return;
    var svg = App.els.wires, g = App.els._meteors;
    if (!g) return;
    var ns = 'http://www.w3.org/2000/svg';
    var head = document.createElementNS(ns, 'circle'); head.setAttribute('class', 'meteor-head'); head.setAttribute('r', '4');
    var tail = document.createElementNS(ns, 'path'); tail.setAttribute('class', 'meteor-tail');
    var station = document.createElementNS(ns, 'circle'); station.setAttribute('class', 'meteor-head');
    station.setAttribute('r', '3'); station.setAttribute('cx', b.x + 145); station.setAttribute('cy', b.y);
    g.appendChild(tail); g.appendChild(head); g.appendChild(station);
    var m = {a:a, b:b, head:head, tail:tail, station:station, t0: performance.now(), done:false};
    meteors.push(m);
    if (meteors.length === 1) requestAnimationFrame(mtick);
  }
  function mtick(now) {
    meteors = meteors.filter(function (m) { return !m.done; });
    meteors.forEach(function (m) {
      var el = now - m.t0, T1 = 620, T2 = 1350, T3 = 850;
      if (el < T1) {
        var t = el / T1, p = bezier(m.a, m.b, t);
        m.head.setAttribute('cx', p.x); m.head.setAttribute('cy', p.y);
        m.head.setAttribute('opacity', '1'); m.station.setAttribute('opacity', '0');
        var trail = 70 + 170 * t, pts = [];
        for (var i = 0; i <= 10; i++) { var q = bezier(m.a, m.b, Math.max(0, t - (trail / 620) * (i / 10))); pts.push((i ? 'L' : 'M') + q.x + ',' + q.y); }
        m.tail.setAttribute('d', pts.join(' ')); m.tail.setAttribute('opacity', '.9');
      } else if (el < T1 + T2) {
        var k = (el - T1) / T2;
        m.tail.setAttribute('opacity', String(Math.max(0, 0.9 - k)));
        m.head.setAttribute('opacity', String(Math.max(0, 1 - k * 0.6)));
        m.station.setAttribute('opacity', String(0.4 + 0.6 * Math.abs(Math.sin(k * Math.PI * 3))));
      } else if (el < T1 + T2 + T3) {
        var k2 = (el - T1 - T2) / T3;
        m.head.setAttribute('opacity', String(1 - k2)); m.station.setAttribute('opacity', String(1 - k2));
        m.tail.setAttribute('opacity', String(0.9 * (1 - k2)));
      } else { m.done = true; m.head.remove(); m.tail.remove(); m.station.remove(); }
    });
    if (meteors.length) requestAnimationFrame(mtick);  /* 空闲自停，不空转 */
  }

  /* ---------- 生长：由数据面驱动，无演示入口 ----------
     R27 的「先落父卡右下再走位＋每长一张核视野」落在 App.growOnCreate（card_created 增量到达时触发）；
     正式版不保留「重放从根生长」的演示功能与按钮。 */

    /* fxFace 动作区：保存 / 停止·恢复·介入 / 改模型 / 归档（R14 四项真实操作，右侧面板内） */

      if (Date.now() < suppress) return;

      var pkNode = e.target.closest('.packnode');

        logEvent(cur ? '展开完工束' : '收拢完工束',

        /* 所有卡一套逻辑：单击（有子卡）＝折叠/展开；双击＝打开该卡对话（R13）。

            ' · 目标 ' + tgt + ' · 落点提示 open=' + hintOk +
            ' · 指针下元素=' + (under ? (under.className || under.tagName) : 'null'));
        if (moved) App.dispatch({type:'card_reparented', id:src, parent:oldParent}); /* 还原，不污染演示数据 */
        next();
      },
      function (next) {
        /* 同级完工卡打包：同一父卡下 **≥2 张已完成的兄弟卡**合成一束（占一格省空间），
           点束散回画布各占自己的格。这是「同级兄弟」的打包，**不是**「某张卡折起自己的子卡」——
           两者形态必须不同（束不是任何一张卡的折叠钮）。 */
        var host = null;
        Object.keys(App.state.cards).forEach(function (k) {
          if (host) return;
          var d = StateLayer.childrenOf(App.state, k).filter(function (x) {
            var c = App.state.cards[x]; return c.lifecycle === 'completed' &&
              (c.kind === 'worker' || c.kind === 'ui' || c.kind === 'qa_card' || c.kind === 'pm_card');
          });
          if (d.length >= 2) host = k;
        });
        if (!host) {
          rec('设计㉚ 同级完工卡打包成一束，点开散回画布', false, '演示数据里没有「≥2 张同级完工兄弟卡」');
          return next();
        }
        /* 与 packGroup 同口径：只数四类执行卡（结构卡 agent/manager/unit 不打包，保持独立占格） */
        var done = StateLayer.childrenOf(App.state, host).filter(function (x) {
          var c = App.state.cards[x]; return c.lifecycle === 'completed' &&
            (c.kind === 'worker' || c.kind === 'ui' || c.kind === 'qa_card' || c.kind === 'pm_card');
        });
        var pk = document.querySelector('.packnode[data-pack="' + host + '"]');
        var shown0 = !!pk && pk.style.display !== 'none';
        var kidsHidden = done.every(function (k) { return !App.nodeEls[k] || App.nodeEls[k].style.display === 'none'; });
        var pkH = pk ? pk.getBoundingClientRect().height : 0;
        var notFold = !!pk && !pk.classList.contains('foldbtn');
        rec('设计㉚ 同级完工卡打包成一束（同级兄弟打包 ≠ 子卡折叠）', shown0 && kidsHidden && notFold,
          host + ' · ' + done.length + ' 张同级完工 · 卡本身不在画布=' + kidsHidden + ' · 束高 ' + pkH.toFixed(1) + 'px');
        /* 束的归属线：父卡 → 束，一条 wire-parent（束不是孤儿） */
        var wireToPk = document.querySelectorAll('#wires .wire-parent').length;
        /* 前面拖拽测试留了 320ms 防误触窗口——先等它过去，否则第一次点击被吞，
           后面所有时序全部错位（这正是上一版 ㉚b/㉚c 假 FAIL 的根因） */
        setTimeout(function () {
          if (pk) pk.click();
          setTimeout(function () {
            var pk2 = document.querySelector('.packnode[data-pack="' + host + '"]');
            var stillThere = !!pk2 && pk2.style.display !== 'none';
            var vis1 = done.filter(function (k) { return App.nodeEls[k] && App.nodeEls[k].style.display !== 'none'; }).length;
            rec('设计㉚b 点束⇒散开：成员各占一格、**束仍常驻**（对齐 Agent quietfold）',
              vis1 >= done.length && stillThere,
              vis1 + '/' + done.length + ' 张在画布 · 束仍在=' + stillThere);
            /* 再点一次＝重新归拢（双向开合，这是「展开再折叠就消失」bug 的回归断言） */
            if (pk2) pk2.click();
            setTimeout(function () {
              var pk3 = document.querySelector('.packnode[data-pack="' + host + '"]');
              var rehidden = done.every(function (k) { return !App.nodeEls[k] || App.nodeEls[k].style.display === 'none'; });
              var wireAfter = document.querySelectorAll('#wires .wire-parent').length;
              rec('设计㉚c 再点束⇒重新归拢：成员回束、束不消失、归属线仍在',
                !!pk3 && pk3.style.display !== 'none' && rehidden && wireAfter >= wireToPk,
                '束在=' + (!!pk3 && pk3.style.display !== 'none') + ' · 成员回束=' + rehidden + ' · 父子线 ' + wireToPk + '→' + wireAfter);
              /* 恢复打包，供后面的命中区读数使用 */
              if (App.state.packed[host] === false) App.dispatch({type:'packed_set', id: host, value:true}, true);
              /* 束箭头：收起朝下、展开朝上（rotate 180）——中央折号箭头 */
              var cvC = document.querySelector('.packnode[data-pack="' + host + '"] .pk-cv svg');
              var cvRotClosed = cvC ? getComputedStyle(cvC).transform : '';
              App.dispatch({type:'packed_set', id: host, value:false}, true);
              var cvO = document.querySelector('.packnode[data-pack="' + host + '"] .pk-cv.is-open svg');
              var cvRotOpen = cvO ? getComputedStyle(cvO).transform : '';
              App.dispatch({type:'packed_set', id: host, value:true}, true);
              var closedFlat = cvRotClosed === 'none' || cvRotClosed === '';
              var openRot = cvRotOpen.indexOf('matrix') >= 0 || cvRotOpen.indexOf('rotate') >= 0;
              rec('设计㉚d 束箭头：收起朝下、展开朝上（rotate 180）', closedFlat && openRot,
                '收起 transform=' + cvRotClosed + ' · 展开 transform=' + cvRotOpen);
              next();
            }, 700);
          }, 500);
        }, 420);
      },
      function (next) {
        /* ---- 本轮 5 条：继续钮无外圈 / 排队动图语义 / done 不压数字 / 折叠不重建 DOM / 完工卡打包芯片 ---- */
        var out = [];

        /* ① 继续钮没有外圈 */
        var pz = Object.keys(App.state.cards).filter(function (k) { return App.state.cards[k].state === 'paused'; })[0];
        var rbtn = pz && App.nodeEls[pz] && App.nodeEls[pz].querySelector('.resumebtn');
        if (!rbtn) { out.push(['设计㉞ 「继续」钮无外圈（无边框/无底色/无阴影）', false, '演示数据里没有暂停卡']); }
        else {
          var rc = getComputedStyle(rbtn);
          var noRing = rc.borderTopWidth === '0px' && rc.boxShadow === 'none' &&
            (rc.backgroundColor === 'rgba(0, 0, 0, 0)' || rc.backgroundColor === 'transparent');
          out.push(['设计㉞ 「继续」钮无外圈（无边框/无底色/无阴影，只有一枚播放图标）', noRing,
            'border=' + rc.borderTopWidth + ' / bg=' + rc.backgroundColor + ' / shadow=' + rc.boxShadow + ' / text="' + rbtn.textContent + '"']);
        }

        /* ② 排队动图＝队列逐位前挪＋右侧闸线（不是上下跳动的音量条） */
        var probe = 'card_507', prevState = App.state.cards[probe].state;
        App.dispatch({ type: 'card_updated', id: probe, patch: { state: 'queued' } });
        var qEl = App.nodeEls[probe].querySelector('.qanim');
        var qi = qEl && qEl.querySelector('i');
        var qa = qi ? getComputedStyle(qi) : null;
        var gateW = qEl ? getComputedStyle(qEl, '::after').width : '0px';
        var qOk = !!qEl && getComputedStyle(qEl).display !== 'none' && qa &&
          qa.animationName === 'qline' && parseFloat(qa.borderRadius) >= 1.5 && parseFloat(gateW) > 0;
        out.push(['设计㉟ 排队中＝「一列点在闸前逐位前挪并停住」（点成列＋右侧闸线），不是跳动的音量条',
          !!qOk, 'qanim=' + (qEl ? getComputedStyle(qEl).display : '无') +
            ' / 动画=' + (qa ? qa.animationName : '无') + ' / 点圆度=' + (qa ? qa.borderRadius : '-') +
            ' / 闸线宽=' + gateW + ' / 状态点=' + (App.nodeEls[probe].querySelector('.dot') ? getComputedStyle(App.nodeEls[probe].querySelector('.dot')).display : '-')]);
        /* 用户口径：排队动效放在「继续」钮那个位置——卡身右侧、垂直居中 */
        var qr = qEl ? qEl.getBoundingClientRect() : null;
        var qnr = App.nodeEls[probe].getBoundingClientRect();
        var qGap = qr ? qnr.right - qr.right : -1;
        var qVC = qr ? Math.abs((qr.top + qr.height / 2) - (qnr.top + qnr.height / 2)) : 99;
        out.push(['设计㉟b 排队动效在卡身右侧、垂直居中（与「继续」钮同一位置）',
          qGap >= 0 && qGap <= 22 && qVC <= 3,
          '距卡右缘 ' + qGap.toFixed(1) + 'px · 垂直差 ' + qVC.toFixed(1) + 'px']);
        App.dispatch({ type: 'card_updated', id: probe, patch: { state: prevState } });

        /* ③ done 记号与「子卡数」不重叠 */
        var dcId = null;
        Object.keys(App.state.cards).forEach(function (k) {
          if (!dcId && App.state.cards[k].lifecycle === 'completed') dcId = k;
        });
        var dnEl = dcId && App.nodeEls[dcId] && App.nodeEls[dcId].querySelector('.dnmark');
        var fcEl = dcId && App.nodeEls[dcId] && App.nodeEls[dcId].querySelector('.foldbtn');
        if (!dnEl || !fcEl) { out.push(['设计㊱ done 记号与子卡数不重叠', false, '缺少可比元素']); }
        else {
          var r1 = dnEl.getBoundingClientRect(), r2 = fcEl.getBoundingClientRect();
          var ov = !(r1.right <= r2.left + 0.5 || r2.right <= r1.left + 0.5);
          out.push(['设计㊱ done 记号与子卡数不重叠（done 改行内占位，不再绝对定位压住数字）', !ov,
            'done right=' + r1.right.toFixed(1) + ' / 折叠钮 left=' + r2.left.toFixed(1) + ' / 重叠=' + ov]);
        }

        /* ④ 折叠/展开不重建节点、不刷新页面：同一 DOM 元素实例存活，其余卡走位移过渡 */
        var keep = 'card_257';
        var beforeEl = App.nodeEls[keep];
        var beforeCollapsed = !!App.state.collapsed[keep];
        App.dispatch({ type: 'collapsed_set', id: keep, value: !beforeCollapsed }, true);
        var afterEl = App.nodeEls[keep];
        var moving = Object.keys(App.animMap).length;
        var sameEl = beforeEl === afterEl && document.body.contains(afterEl);
        App.dispatch({ type: 'collapsed_set', id: keep, value: beforeCollapsed }, true);
        out.push(['设计㊲ 折叠/展开全程不重建节点、不刷新页面（同一 DOM 实例存活＋其余卡位移过渡）',
          sameEl && moving > 0, '同一元素实例=' + sameEl + ' / 折叠瞬间在位移的卡=' + moving + ' 张 / 在文档内=' + document.body.contains(afterEl)]);

        /* ⑤ 完工卡**不再**有特殊折叠形态：它的折叠钮与普通卡完全一样（都是 chevron）。
           「完工省空间」由同级打包（.packnode 束）承担，不是折起自己的子卡——两者不可混同。 */
        var foldAll = Object.keys(App.state.cards).filter(function (k) {
          return App.nodeEls[k] && App.nodeEls[k].style.display !== 'none' &&
                 StateLayer.childrenOf(App.state, k).length > 0;
        }).map(function (k) { return App.nodeEls[k].querySelector('.foldbtn'); }).filter(Boolean);
        var anyPacked = foldAll.some(function (b) { return b.classList.contains('packed') || b.dataset.packed === 'true'; });
        var allChevron = foldAll.every(function (b) { return b.innerHTML.indexOf('M4 8l8-4 8 4') < 0; });
        out.push(['设计㊳ 完工卡的折叠钮与普通卡同一形态（无「打包芯片」特殊件）——省空间由同级束承担',
          !anyPacked && allChevron,
          '在画的折叠钮 ' + foldAll.length + ' 个 · 含打包芯片=' + anyPacked + ' · 全为 chevron=' + allChevron]);

        /* ⑥ 束（同级完工卡打包）的命中区 ≥24px ——量热区伪元素（::after 反向放大补偿），不是视觉盒 */
        var anyPk = document.querySelector('.packnode');
        var pkR = null;
        if (anyPk && anyPk.style.display !== 'none') {
          var pkCS = getComputedStyle(anyPk, '::after');
          var z = parseFloat(pkCS.getPropertyValue('--z')) || App.state.scale || 1;
          pkR = { w: parseFloat(pkCS.width) / z * (App.state.scale || 1), h: parseFloat(pkCS.height) / z * (App.state.scale || 1) };
        }
        out.push(['设计㊴ 同级完工卡「束」的命中区 ≥24px（热区补偿后屏上实测）', !!pkR && pkR.h >= 23.99 && pkR.w >= 23.99,
          pkR ? ('热区屏上 ' + pkR.w.toFixed(1) + '×' + pkR.h.toFixed(1) + 'px（视觉盒 ' + (anyPk ? anyPk.getBoundingClientRect().height.toFixed(1) : '-') + 'px）') : '当前无束']);

        /* ⑧ 束沉底：每个有束的父卡，束的 y ≥ 其所有可见运行子卡的 y（完工卡默认排最下方） */
        var sinkBad = [];
        Object.keys(App.PACKPOS || {}).forEach(function (pid) {
          var pp = App.PACKPOS[pid];
          if (!pp) return;
          var pkEl = document.querySelector('.packnode[data-pack="' + pid + '"]');
          if (!pkEl || pkEl.style.display === 'none') return;
          var pkY = pkEl.getBoundingClientRect().top;
          pp.ids.forEach(function (k) { /* 打包态成员不在画布，跳过 */ });
          StateLayer.childrenOfSorted(App.state, pid).forEach(function (k) {
            if (pp.ids.indexOf(k) >= 0 && App.state.packed[pid] !== false) return;
            var el = App.nodeEls[k];
            if (!el || el.style.display === 'none') return;
            if (el.getBoundingClientRect().top > pkY + 2) sinkBad.push(pid + ':' + k);
          });
        });
        out.push(['设计㊵b 束沉底（同级完工卡排在所有运行子卡之下）', sinkBad.length === 0,
          sinkBad.length ? sinkBad.slice(0, 3).join(',') : Object.keys(App.PACKPOS || {}).length + ' 个束全部垫底']);

        /* ⑦ 类型色与字体：逐值对齐运行中 Agent 左栏（nav.css @499/@512/@526/@537 图标色、
              @504/@517/@531/@542 徽标、@500/@513/@527/@538 标题等宽体） */
        var rs = getComputedStyle(document.documentElement);
        function hex(c) {
          var m = String(c).trim().match(/^#?([0-9a-f]{6})$/i);
          if (m) return '#' + m[1].toLowerCase();
          var n = String(c).match(/\d+/g);
          if (!n || n.length < 3) return String(c);
          return '#' + [n[0], n[1], n[2]].map(function (x) {
            return ('0' + parseInt(x, 10).toString(16)).slice(-2);
          }).join('');
        }
        var want = { worker: '#f5a65b', ui: '#56c8d8', qa: '#7ec97e', pm: '#dd8ab4' };
        var got = {}, colOk = true;
        Object.keys(want).forEach(function (k) {
          got[k] = hex(rs.getPropertyValue('--k-' + k));
          if (got[k] !== want[k]) colOk = false;
        });
        out.push(['设计㊵ 类型色逐值对齐 Agent 左栏（worker #f5a65b／UI #56c8d8／QA #7ec97e／PM #dd8ab4）',
          colOk, '实测 ' + Object.keys(want).map(function (k) { return k + '=' + got[k]; }).join(' / ')]);

        var bW = App.nodeEls['card_507'].querySelector('.kbadge .kb-t');
        var bU = App.nodeEls['card_507'].querySelector('.kbadge .ic');
        var ttEl = App.nodeEls['card_507'].querySelector('.n-head .tt');
        var csW = bW ? getComputedStyle(bW) : null;
        var csU = bU ? getComputedStyle(bU) : null;
        var csT = getComputedStyle(ttEl);
        /* 卡名字号随 LOD 分档（<75% 放大到 16px 才看得清），所以按当前档位判：
              far ⇒ 16px；其余 ⇒ 12.5px。字体族一律等宽（对齐 Agent 左栏 .nav-ctitle）。 */
        var lodNow = document.getElementById('world').dataset.lod;
        var wantSize = lodNow === 'far' ? '16px' : '12.5px';
        var fontOk = !!csW && csW.fontSize === '9px' && csW.lineHeight === '14px' &&
          (csW.fontWeight === '400' || csW.fontWeight === 'normal') &&
          !!csU && csU.width === '14px' && csU.height === '14px' &&
          csT.fontSize === wantSize && /mono|Consolas|Cascadia/i.test(csT.fontFamily);
        out.push(['设计㊶ 徽标与卡名逐项对齐 Agent 左栏（徽标 9px/行高14/常规字重；图标 14×14；工作卡卡名等宽 12.5px）',
          fontOk, '徽标 ' + (csW ? csW.fontSize + '/' + csW.lineHeight + '/w' + csW.fontWeight : '-') +
            ' · 图标 ' + (csU ? csU.width + '×' + csU.height : '-') +
            ' · 卡名 ' + csT.fontSize + ' @' + lodNow + ' ' + String(csT.fontFamily).slice(0, 22)]);

        out.forEach(function (a) { rec(a[0], a[1], a[2]); });
        next();
      }
    ], function () { flush(); });
  }
  return {run:run};
})();
</script>
