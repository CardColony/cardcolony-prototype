<title>CardColony · 画布页 · 视觉设计稿 v2（React 形态）</title>
<!--
  ════════════════════════════════════════════════════════════════
  画布页 · 视觉设计稿 v2 — React 形态（preact + htm，单文件直开）
  ════════════════════════════════════════════════════════════════
  ① 产品级视觉设计稿（深浅令牌 33 项×2、组件全态、LOD、三类线）
  ② React 形态：函数组件 + hooks + 单向数据流 + 位置即状态
     迁 Vite+React：组件零改动，运行时换 react/react-dom 两行 import
  ③ 运行时 preact 10.19.3 + hooks + htm 3.1.1 全部内联（本卡无
     bash/python，无法跑 npm 工程；UMD 内联是展示载体的权宜，
     不是技术选型改动——架构基线以 card_074 需求正稿 §8 为准）
  ④ 修复 v1 四缺陷：B1 卡面文字遮盖 / B2 按钮语义 / B3 输入框
     不可见 / B4 收起后线乱（根因与修法见页内「设计说明→缺陷修复」）
  结构与交互判据照 v3 定版（R1～R33 三条总纲保留）。
  ════════════════════════════════════════════════════════════════
-->
