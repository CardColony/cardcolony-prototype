<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画布根卡 · 同源原型 v8</title>
<style>
  /* ====== 真实画布令牌（style.css 同源，不另发明） ====== */
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2128;
    --border: #30363d;
    --fg: #e6edf3;
    --dim: #8b949e;
    --c-work: #d29922;       /* 琥珀 · 剧本/根 */
    --c-work-dim: #b0831a;   /* 琥珀降一档 · 消息卡（同族） */
    --radius: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(circle at 1px 1px, #1c2128 1px, transparent 0);
    background-size: 24px 24px;
    background-color: var(--bg);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    padding: 60px;
    gap: 40px;
    align-items: flex-start;
  }

  /* ============ 根卡 ============ */
  .card {
    width: 240px;                 /* 窄 */
    background: var(--panel);
    border: 2px solid var(--c-work);
    border-left-width: 6px;
    border-radius: var(--radius);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    overflow: hidden;
    display: flex;
  }
  .card.is-root { min-width: 240px; }

  /* 卡体：主区 + 右缘竖轨 */
  .card-body {
    flex: 1;
    padding: 14px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
    word-break: break-word;
  }
  /* 无 ttype 类型行——名字自己说话 */

  .status-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin-top: 2px;
  }
  .status-lines {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
    font-size: 12px;
    color: var(--dim);
    line-height: 1.55;
  }

  /* 右缘竖轨 · 子树开关（整条可点，纯符号） */
  .rail {
    width: 44px;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .rail:hover { background: rgba(210,153,34,0.08); }
  .rail .tri { font-size: 13px; color: var(--c-work); }
  .rail .cnt { font-size: 15px; font-weight: 600; color: var(--fg); }
  .rail .cap { font-size: 9px; color: var(--dim); letter-spacing: 0.08em; }

  /* ============ 消息卡（独立完整卡 · 留缝 · 同族色） ============ */
  .msg-card {
    width: 240px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--c-work-dim);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  /* 快照行：纯消息内容，无发送方 */
  .snap {
    padding: 12px 14px;
    font-size: 12px;
    color: var(--fg);
    line-height: 1.5;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    word-break: break-word;
  }
  .snap:hover { background: rgba(176,131,26,0.08); }
  .snap .open { color: var(--c-work-dim); font-size: 12px; flex-shrink: 0; align-self: center; }

  /* 输入行：无提示文字 */
  .entry {
    display: flex;
    align-items: center;
    padding: 6px 8px 6px 12px;
  }
  .entry .field {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--fg);
    font-size: 12px;
    outline: none;
  }
  .entry .field::placeholder { color: transparent; }
  .entry .send {
    border: none;
    background: transparent;
    color: var(--c-work-dim);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 6px;
  }
  .entry .send:hover { color: var(--c-work); }

  /* 角标示例：未读数 0 时不出现，演示用淡显 */
  .msg-badge {
    position: absolute;
    top: -7px;
    left: -7px;
    background: var(--c-work);
    color: #0d1117;
    font-size: 10px;
    font-weight: 700;
    border-radius: 10px;
    padding: 1px 6px;
    box-shadow: 0 0 0 2px var(--bg);
  }
  .wrap { position: relative; }

  /* 普通子卡对照 */
  .child-card {
    width: 220px;
    background: var(--panel);
    border: 2px solid #58a6ff;
    border-left-width: 6px;
    border-radius: var(--radius);
    padding: 12px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .child-card .t {
    font-size: 13px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .child-card .t .kid { font-size: 10.5px; color: var(--dim); border:1px solid var(--border); border-radius:8px; padding:0 6px; cursor:pointer; }
  .child-card .s { font-size: 11px; color: var(--dim); line-height:1.5; margin-top:6px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; }

  .caption { color: var(--dim); font-size: 12px; position: absolute; bottom: -24px; left: 0; }
  .demo-row { display: flex; flex-direction: column; gap: 12px; position: relative; }
</style>
</head>
<body>

  <!-- === 根卡 + 吸附消息卡（留缝） === -->
  <div style="display:flex; flex-direction:column; gap:12px;" class="wrap">
    <div class="card is-root">
      <div class="card-body">
        <div class="card-title">银河远征计划</div>
        <div class="status-label">当前状况</div>
        <div class="status-lines">
          第 7 回合：远征军已越过第三星域屏障。<br>
          行为体"勘探队·队长"提交了新的航线主张，<br>
          正等待统合裁定。物资链两处告急。
        </div>
      </div>
      <div class="rail" title="子卡开关">
        <span class="tri">▸</span>
        <span class="cnt">3</span>
        <span class="cap">子树</span>
      </div>
    </div>

    <!-- 独立消息卡 · 留缝 */
    -->
    <div class="msg-card">
      <div class="snap">
        <span>第 7 回合裁定完成：采纳航线主张甲案，删除丙案，等待行为体执行。</span>
        <span class="open">↗</span>
      </div>
      <div class="entry">
        <input class="field" type="text" />
        <button class="send" title="发送">➤</button>
      </div>
    </div>

    <div class="caption">根卡 ─ 独立消息卡（子卡计数区在根卡右缘）</div>
  </div>

  <!-- === 普通子卡对照 === -->
  <div class="wrap">
    <div class="child-card">
      <div class="t">
        <span>勘探队·航线主张</span>
        <span class="kid">▸ 2</span>
      </div>
      <div class="s">主张经甲星域突围，理由是屏障密度最低。队长提议三舰编队并行突破，需统合确认航迹。</div>
    </div>
    <div class="caption">普通子卡（对比）</div>
  </div>

</body>
</html>
