<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>根卡原型</title>
<style>
:root{
  --bg:#0c0c0c; --panel:#161616; --panel-dim:#121212; --border:#2e2e2e; --hair:#222222;
  --text:#f2f2f2; --soft:#b0b0b0; --dim:#8a8a8a;
  --amber:#f2f2f2; --amber-dim:rgba(242,242,242,.45);
  /* ── 色表：类型→卡色（真实令牌，与 style.css 同源；新卡从表里选一个；界面其余保持黑白灰） ── */
  --c-work:#d4a72c;    /* 剧本 · 金（根卡） */
  --c-char:#a371f7;    /* 行为体 · 紫 */
  --c-plot:#db6d28;    /* 节点 · 橙 */
  --c-setting:#388bfd; /* 世界观 · 蓝 */
  --font:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding:32px;overflow:auto}
button{font-family:var(--font);cursor:pointer}

.stage{min-height:420px;padding:8px}
.unit{width:360px;--cc:var(--c-work)}

/* ══════ 根卡：一棵活动树的门面 ══════
   结构：面板底 + 圆角 + 琥珀左条
   卡体自上而下：名字 → 三行状况 → （有则）新消息气泡
   右侧卡片右缘钉一个子卡控件（icon+数字，收起/展开两态）
   整卡一张干净的卡，无碎块。 */
.root{position:relative;display:flex;min-height:292px;background:var(--panel);border:1px solid var(--border);
  border-left:3px solid var(--cc);border-radius:8px}
.rbody{flex:1;padding:22px 20px 18px 20px;display:flex;flex-direction:column}
                                                          /* rcore 只包住内容、不吃余量——icon 锚＝内容真实中线；余量由气泡 auto 上边距吸收，气泡永远贴卡底 */
.rcore{position:relative}                                /* 正常内容区（名字+状况）＝icon 居中基准；气泡在其外，不参与中线计算 */
.rname{font-size:21px;font-weight:650;line-height:1.5;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding-right:52px}                                   /* 仅名字这行让位右缘 icon，不波及下方 */
.rstatus{margin-top:20px;display:flex;flex-direction:column;gap:12px;
  padding-right:52px}
.rstatus div{font-size:13.5px;color:var(--soft);line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 子卡控件：锚=.rcore（名字+状况），top:50% 即内容区中线——气泡在 rcore 之外，天然不计入
   收起=三张叠卡 · 展开=三张扇形散开的牌；两态水平同轴 20，icon 与数字并排(左icon·右数字)·垂直居中对齐 ── */
.subctl{position:absolute;right:-12px;top:50%;transform:translateY(-50%);
  /* 锚=rcore（内容区）中线；rcore 右缘在卡内 20px，right:-12px 抵偿后＝距卡右缘 8px，视觉位置与旧版一致 */
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:none;padding:6px 4px;border-radius:8px;
  cursor:pointer;user-select:none;color:var(--dim)}
.subctl .ic{width:30px;height:30px;display:flex;transition:width .15s,height .15s}
.subctl .ic svg{width:100%;height:100%;display:block}
.subctl .n{font-size:16px;line-height:1;font-variant-numeric:tabular-nums;transition:font-size .15s}
.subctl:hover{color:var(--soft)}
.subctl .ic-open{display:none}
.subctl.on{color:var(--cc)}
.subctl.on .ic{width:40px;height:40px}
.subctl.on .n{font-size:21px;font-weight:700}
.subctl.on .ic-open{display:block}
.subctl.on .ic-closed{display:none}

/* ── 新消息气泡（消息泡形 · 左下尾巴 · 右上 NEW红壳 · 两行高流式窗·无滚动条 · 流式自动跟随 · 点击开快捷窗） ── */
.bubble{--bbg:#272727;--bbr:#3c3c3c;position:relative;margin:30px -8px 12px -10px;padding:11px 14px 12px;
  border-radius:12px 12px 12px 4px;cursor:pointer;
  background:var(--bbg);border:1px solid var(--bbr);
  font-size:13px;color:var(--soft)}
.rbody>.bubble{margin-top:auto}   /* 根卡气泡：auto 上边距吃掉余量 → 贴卡底（子卡气泡不受影响） */
.bubble::before{content:"";position:absolute;left:14px;bottom:-5.5px;width:10px;height:10px;
  background:var(--bbg);border-right:1px solid var(--bbr);border-bottom:1px solid var(--bbr);
  transform:rotate(45deg)}
.bnew{position:absolute;top:-8px;right:-4px;font-size:9px;font-weight:800;font-style:normal;
  letter-spacing:1px;line-height:1;padding:3px 7px;border-radius:8px 8px 8px 2px;
  background:#e5484d;color:#fff;pointer-events:none}
.btxt{display:block;max-height:42px;overflow:hidden;line-height:1.6;word-break:break-word}
.bubble:hover{--bbg:#303030;--bbr:#4a4a4a;color:var(--text)}
.bubble[hidden]{display:none}
.kid .bubble{margin:22px -6px 9px -8px}
.inrow{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 20px;border-top:1px solid var(--hair)}
.qin{flex:1;min-width:0;background:transparent;border:none;outline:none;
  border-bottom:1px solid #3a3a3a;color:var(--text);font-size:13.5px;padding:4px 2px 6px}
.qin:focus{border-bottom-color:var(--amber)}
.send{width:32px;height:32px;flex:0 0 32px;border-radius:6px;background:transparent;
  border:1px solid var(--border);color:var(--dim);font-size:14px;line-height:1}
.send:hover{color:var(--amber);border-color:var(--amber-dim)}

/* ── 子卡 ── */
.kids{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.kidwrap{width:330px;display:flex;flex-direction:column}
.kidwrap.t-char{--cc:var(--c-char)}
.kidwrap.t-plot{--cc:var(--c-plot)}
.kidwrap.t-setting{--cc:var(--c-setting)}
.kid{background:var(--panel-dim);border:1px solid var(--border);border-left:3px solid var(--cc);border-radius:8px;padding:13px 16px}
.ktitle{display:flex;align-items:center;gap:8px}
.kname{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcnt{flex:0 0 auto;font-size:11px;color:var(--dim);line-height:1}
.ksum{margin-top:6px;font-size:12.5px;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 卡片状态：运转中（绕框流光·色=卡色）/ 退役（静止封存） ── */
.st-run{position:relative}
.st-run::after{content:"";position:absolute;top:-2px;right:-2px;bottom:-2px;left:-4px;border-radius:9px;padding:1.5px;
  pointer-events:none;
  background:conic-gradient(from var(--ang),var(--cc,#f2f2f2) 0%,var(--cc,#f2f2f2) 4%,transparent 24%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  animation:stspin 2.8s linear infinite}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes stspin{to{--ang:360deg}}
.st-done::after{content:none}
.st-done .kid{background:#0e0e0e;border-color:#262626;--cc:#565656}
.st-done .inrow{opacity:.35;pointer-events:none}

/* ── 右侧常驻规则卡（占位） ── */
.rules{position:fixed;top:12px;right:12px;bottom:12px;width:280px;z-index:30;
  background:var(--panel-dim);border:1px solid var(--border);border-left:3px solid var(--c-setting);
  border-radius:8px;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.rules-t{font-size:15px;font-weight:650;color:var(--text)}
.rules-line{font-size:12.5px;color:var(--dim);line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 遮罩：仅中央弹窗使用 ── */
.rp-back{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:39}

/* ── 弹窗：中央正方 ⇄ 吸右常驻 ── */
.rpop{position:fixed;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--border);border-radius:12px;
  transition:left .3s cubic-bezier(.4,0,.2,1),top .3s cubic-bezier(.4,0,.2,1),
    width .3s cubic-bezier(.4,0,.2,1),height .3s cubic-bezier(.4,0,.2,1)}
@keyframes rpop-in{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
.rpop.in{animation:rpop-in .22s cubic-bezier(.3,1.3,.5,1)}
.rp-head{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 20px}
.rp-name{flex:1;min-width:0;font-size:17px;font-weight:650;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-head button{width:40px;height:40px;flex:0 0 40px;border:none;background:transparent;
  color:var(--dim);font-size:19px;line-height:1;border-radius:8px}
.rp-head button:hover{color:var(--text);background:var(--hair)}
.rp-flow{flex:1;min-height:0;overflow-y:auto;padding:2px 20px 14px;
  display:flex;flex-direction:column;gap:10px}
.m{font-size:14px;line-height:1.6;padding:9px 13px;border-radius:8px;max-width:80%}
.m.md{align-self:flex-start;background:var(--hair);color:var(--soft)}
.m.us{align-self:flex-end;background:#2b2b2b;border:1px solid #404040;color:var(--text)}
.rpop .inrow{padding:14px 16px 16px 20px;gap:10px}

#probe-out{display:none}
</style>
</head>
<body>

<section class="stage">
  <div class="unit" id="unit">
    <div class="root st-run" id="rootCard" data-card="赤潮登陆推演">
      <div class="rbody">
        <div class="rcore">
          <button class="subctl" id="rail" type="button" aria-label="展开/收起子卡">
            <span class="ic">
              <svg viewBox="0 0 40 40" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
                <!-- 收起：三张短卡（14×18）实体叠成一摞（y=7/11/15 → 可见中心 20＝盒中心，不偏下；水平中心 20 两态同轴） -->
                <g class="ic-closed">
                  <rect x="9"  y="7"  width="14" height="18" rx="2" style="fill:var(--panel)"/>
                  <rect x="13" y="11" width="14" height="18" rx="2" style="fill:var(--panel)"/>
                  <rect x="17" y="15" width="14" height="18" rx="2" style="fill:var(--panel)"/>
                </g>
                <!-- 展开：三张同尺寸短卡（13×18）绕支点(20,29)扇形摊开 ±20°（可见中心≈20，与收起态同轴不跳） -->
                <g class="ic-open">
                  <rect x="13.5" y="11" width="13" height="18" rx="2" style="fill:var(--panel)" transform="rotate(-20 20 29)"/>
                  <rect x="13.5" y="11" width="13" height="18" rx="2" style="fill:var(--panel)" transform="rotate(20 20 29)"/>
                  <rect x="13.5" y="11" width="13" height="18" rx="2" style="fill:var(--panel)"/>
                </g>
              </svg>
            </span>
            <span class="n">3</span>
          </button>
          <div class="rname" id="pName">赤潮登陆推演</div>
          <div class="rstatus" id="pStatus">
            <div>第12轮 · 补给线切断后第3天</div>
            <div>3行为体待决策 · 2节点悬置</div>
            <div>停在：是否空投物资</div>
          </div>
        </div>
        <div class="bubble" data-card="赤潮登陆推演"><i class="bnew">NEW</i><span class="btxt">北部集群燃料仅够维持4天，第二梯队可佯攻吸引火力但胜率不足三成。是否立即执行空投方案？</span></div>
      </div>
    </div>
    <div class="kids" id="kids" hidden>
      <div class="kidwrap t-char">
        <div class="kid st-run" data-card="北部集群"><div class="ktitle"><span class="kname">北部集群</span><span class="kcnt">2 子卡</span></div><div class="ksum">燃料4天 · 3个单位待命</div></div>
      </div>
      <div class="kidwrap t-plot">
        <div class="kid st-run" data-card="空投方案"><div class="ktitle"><span class="kname">空投方案</span><span class="kcnt">1 子卡</span></div><div class="ksum">18小时决策窗 · 胜率三成</div>
          <div class="bubble" data-card="空投方案"><i class="bnew">NEW</i><span class="btxt">最坏结局：运输机损失40%，物资到位60%，仍优于固守待援。这是很长的一段文字用来测试气泡两行滚动与流式跟随的效果到底稳不稳定。</span></div></div>
      </div>
      <div class="kidwrap t-setting st-done">
        <div class="kid"><div class="ktitle"><span class="kname">补给线地理</span></div><div class="ksum">河谷桥点 · 季风窗口期</div></div>
      </div>
    </div>
  </div>
</section>

<aside class="rules" id="rulesCard">
  <div class="rules-t">规则</div>
  <div class="rules-line">每轮推演不超过 12 个节点</div>
  <div class="rules-line">跨卡引用仅限结论块</div>
  <div class="rules-line">终局条件：目标达成或资源耗尽</div>
</aside>

<div class="rp-back" id="rpBack" hidden></div>
<div id="pops"></div>

<pre id="probe-out"></pre>

<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var rail=$('#rail'),kids=$('#kids');
  var back=$('#rpBack'),pops=$('#pops'),rules=$('#rulesCard');

  /* 各卡预置对话 */
  var SEED={
    '赤潮登陆推演':[
      ['md','第10轮局势：北部集群燃料储备降至4天临界线，敌方两个师压至河岸线。'],
      ['us','第二梯队现在佯攻还来得及吗？'],
      ['md','来得及，但必须在18小时内决定，否则燃料缺口不可逆。'],
      ['us','空投与佯攻同时做呢？'],
      ['md','可以并行。佯攻吸引火力窗口约6小时，空投需4小时，时间上咬合。'],
      ['us','敌方会有什么反应？'],
      ['md','预判敌方将收缩东线兵力驰援河岸，东线出现12小时空虚。'],
      ['us','那东线可以插一刀？'],
      ['md','可行，但意味着三线同时开动，补给压力翻倍。'],
      ['us','先记着，第13轮再定。'],
      ['md','已挂起。第13轮将自动汇总三线补给账。']
    ],
    '北部集群':[
      ['md','燃料4天，3个单位待命。'],
      ['us','佯攻需要多少兵力？'],
      ['md','两个连足够，胜率三成但目的在吸引不在攻克。'],
      ['us','燃料消耗预测？'],
      ['md','佯攻6小时耗0.4天燃料，可承受。'],
      ['us','行，保持待命。'],
      ['md','已锁定待命状态，随时可执行。']
    ],
    '空投方案':[
      ['md','决策窗18小时，胜率三成。'],
      ['us','有没有替代方案？'],
      ['md','两个：东线穿插（胜率两成五，可牵制）或固守待援（无风险，失先手）。'],
      ['us','固守失先手的代价？'],
      ['md','敌方完成河岸合围，第14轮我方全线转入被动。'],
      ['us','空投的最坏结局？'],
      ['md','运输机损失40%，物资到位60%，仍优于固守。']
    ],
    '补给线地理':[
      ['md','河谷桥点是唯一重装备通道。'],
      ['us','炸桥的后果？'],
      ['md','敌我双方重装备同时锁死，轻步兵可涉渡。'],
      ['us','季风窗口什么时候关？'],
      ['md','72小时后降雨量超涉渡阈值。'],
      ['us','记入变量。'],
      ['md','已挂"季风窗口72h"变量。']
    ]
  };

  /* 卡片状态：run=运转中 done=退役 */
  var STATE={'赤潮登陆推演':'run','北部集群':'run','空投方案':'run','补给线地理':'done'};

  /* 展开收起：icon 对翻面纯 CSS（.on），JS 只管子卡显隐 */
  rail.addEventListener('click',function(){
    rail.classList.toggle('on');
    kids.hidden=!kids.hidden;
  });

  /* ── 弹窗：中央正方 ⇄ 吸右常驻 ── */
  var DOCK_W=340, DOCK_GAP=12;
  var wins=[];
  function findW(card){for(var i=0;i<wins.length;i++)if(wins[i].card===card)return wins[i];return null}
  function modalList(){return wins.filter(function(w){return w.mode==='modal'})}
  function dockList(){return wins.filter(function(w){return w.mode==='dock'})}
  function setBox(el,l,t,w,h,z){
    el.style.left=Math.round(l)+'px';el.style.top=Math.round(t)+'px';
    el.style.width=Math.round(w)+'px';el.style.height=Math.round(h)+'px';el.style.zIndex=z;
  }
  function relayout(){
    var IW=document.documentElement.clientWidth,IH=window.innerHeight;
    var d=dockList(),m=modalList();
    var rulesLeft=(rules&&!rules.hidden)?rules.getBoundingClientRect().left:12;
    var H=IH-2*DOCK_GAP;
    var slot=d.length?(H-(d.length-1)*DOCK_GAP)/d.length:0;
    var hh=Math.min(320,slot>0?slot:320);
    for(var i=0;i<d.length;i++){
      setBox(d[i].el,rulesLeft-DOCK_GAP-DOCK_W,DOCK_GAP+i*(hh+DOCK_GAP),DOCK_W,hh,45);
    }
    for(var j=0;j<m.length;j++){
      var w=Math.min(640,IW*.92),h=Math.min(640,IH*.88);
      setBox(m[j].el,(IW-w)/2+j*40,(IH-h)/2+j*40,w,h,50+j);
    }
    back.hidden=m.length===0;
  }
  window.addEventListener('resize',relayout);

  function openPop(card){
    var w=findW(card);
    if(w){$('.qin',w.el).focus();return}
    var el=document.createElement('div');
    el.className='rpop';
    el.innerHTML=
      '<div class="rp-head"><div class="rp-name"></div>'+
      '<button class="rp-dock">⇥</button><button class="rp-x">×</button></div>'+
      '<div class="rp-flow"></div>'+
      '<div class="inrow"><input class="qin" type="text" placeholder=""><button class="send">➤</button></div>';
    var nm=$('.rp-name',el);
    nm.appendChild(document.createTextNode(card));
    var eb=bubOf(card);if(eb){var nw=$('.bnew',eb);if(nw)nw.remove()}
    if(STATE[card]==='done')el.classList.add('st-done');
    var flow=$('.rp-flow',el);
    (SEED[card]||[]).forEach(function(m){
      var d=document.createElement('div');d.className='m '+m[0];d.textContent=m[1];flow.appendChild(d);
    });
    flow.scrollTop=1e6;
    wins.push({card:card,el:el,mode:'modal'});
    pops.appendChild(el);
    el.classList.add('in');
    el.addEventListener('animationend',function(){el.classList.remove('in')},{once:true});
    relayout();
    wireCard(card);
    $('.rp-x',el).addEventListener('click',function(){closeEl(el)});
    $('.rp-dock',el).addEventListener('click',function(){toggleDock(card)});
    $('.qin',el).focus();
  }
  function toggleDock(card){
    var w=findW(card);if(!w)return;
    w.mode=(w.mode==='dock')?'modal':'dock';
    $('.rp-dock',w.el).textContent=(w.mode==='dock')?'⇤':'⇥';
    relayout();
    $('.qin',w.el).focus();
  }
  function closeEl(el){
    for(var i=0;i<wins.length;i++)if(wins[i].el===el){wins.splice(i,1);break}
    el.remove();relayout();
  }
  function closeTop(){
    var m=modalList();if(!m.length)return;
    closeEl(m[m.length-1].el);
  }
  back.addEventListener('click',function(e){if(e.target===back)closeTop()});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')closeTop();
  });

  /* 气泡流式：内容更新自动滚底跟随（探针模式同步落全文，便于断言） */
  var PROBE=location.hash==='#probe';
  function streamBub(b,text){
    var t=$('.btxt',b);if(!t)return;
    if(PROBE){t.textContent=text;t.scrollTop=t.scrollHeight;return}
    t.textContent='';var i=0;
    (function step(){
